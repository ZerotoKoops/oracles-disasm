      Want to learn
      about \col(1)saving\col(0)?
        \opt()Yes \opt()No

  - name: TX_3207
    index: 0x07
    text: |-
      Want to learn
      about \col(1)ages\col(0)?
        \opt()Yes \opt()No

  - name: TX_3208
    index: 0x08
    text: |-
      Want to learn
      about the
      \col(1)Subscreens\col(0)?
        \opt()Yes \opt()No

  - name: TX_3209
    index: 0x09
    text: |-
      Want to learn
      about \col(1)essences\col(0)?
        \opt()Yes \opt()No

  - name: TX_320a
    index: 0x0a
    text: |-
      A skill for a
      courageous hero!\stop
      Press and hold
      the \col(1)sword\col(0) button
      to save power,
      then release it
      to unleash a
      spin attack!

  - name: TX_320b
    index: 0x0b
    text: |-
      Deflect enemy
      attacks while
      pressing the
      \col(1)shield\col(0) button.

  - name: TX_320c
    index: 0x0c
    text: |-
      There are five
      kinds of
      \col(1)Mystical Seeds\col(0).
      Each \col(1)seed\col(0) type
      has a unique
      effect.\stop
      You can't carry
      \col(1)seeds\col(0) without a
      \col(1)satchel\col(0).

  - name: TX_320d
    index: 0x0d
    text: |-
      After taking a
      \col(1)Bomb\col(0) out, press
      the button again
      to place it.
      Press \col(0x84)\item(0x00)\col(0) to
      throw a \col(1)Bomb\col(0) in
      that direction.
      Press the button
      again to pick up
      a placed \col(1)Bomb\col(0).

  - name: TX_320e
    index: 0x0e
    text: |-
      Set items to \abtn
      or \bbtn on the
      Subscreen. The
      number of items
      like \col(1)seeds\col(0) and
      \col(1)Bombs\col(0) decreases
      with each use,
      so keep track of
      how many you
      have.

  - name: TX_320f
    index: 0x0f
    text: |-
      Press SELECT to
      view the map.
      Move the cursor
      and press \abtn to
      see place names.
      Dark regions are
      ones you have
      not yet visited.
      Only that which
      you've seen and
      heard is
      recorded.

  - name: TX_3210
    index: 0x10
    text: |-
      Open the Sub-
      screen and press
      SELECT twice to
      see the Essence
      Screen. Next,
      choose Save and
      press \abtn to see
      the Save Screen.
      Pressing START
      and SELECT at
      the same time
      also opens the
      Save Screen.

  - name: TX_3211
    index: 0x11
    text: |-
      The present age
      and the past
      age are related.
      Events in the
      past affect
      events in the
      present. Also,
      items found
      only in the
      present can be
      taken to the
      past!

  - name: TX_3212
    index: 0x12
    text: |-
      Press START to
      access the
      Subscreen, then
      press SELECT to
      scroll through
      screens.\stop
      First is the
      Item Screen,
      then the Quest
      Status Screen.
      Next is the
      essence screen.\stop
      Pick a \col(1)ring\col(0) to
      wear on the
      Quest Status
      Screen.

  - name: TX_3213
    index: 0x13
    text: |-
      Umm, even this
      \col(3)Know-It-All
      Bird\col(0) knows
      little of
      \col(1)essences\col(0).

  - name:
    - TX_3214
    - TX_3215
    index:
    - 0x14
    - 0x15
    text: |-
      No! I have to
      hear \col(3)Nayru's\col(0)
      song!

  - name: TX_3216
    index: 0x16
    text: |-
      \col(3)Lynna City\col(0)!
      \col(3)Nayru's\col(0) House!
      \col(3)Zelda\col(0) comes!
      \col(3)Zelda\col(0) comes!

  - name: TX_3217
    index: 0x17
    text: |-
      Please! Please!

- group: 0x33
  data:
  - name: TX_3300
    index: 0x00
    text: |-
      This is the
      \col(3)Eyeglass Isle
      Library\col(0). \col(1)Fairy
      Powder\col(0) is said
      to be stored in
      back, but I've
      yet to see it.

  - name: TX_3301
    index: 0x01
    text: |-
      This is the
      \col(3)Eyeglass Isle
      Library\col(0). The
      \col(1)Fairy Powder\col(0) is
      gone, but I'm
      just glad the
      seas are clean.

  - name: TX_3302
    index: 0x02
    text: >-
      Huh? How did you get here? Are you also a
      researcher of this mysterious \col(1)Deeper Woods\col(0)?

      I am \col(1)Cisypherestus\col(0) and I live
      here with my friend \col(3)Horatio\col(0).
      There is a \col(3)Shrine\col(0) somewhere between
      the trees, but I have struggled finding the means to reach it.
      These books are all useless, but I at least know that you must
      collect \col(3)four\col(0) \col(1)stones\col(0) to learn the right path.

      We are always in research,
      so \col(1)if you come back later\col(0),
      we might have more information for you.

      Good luck in your endeavors, adventurer!

  - name: TX_3303
    index: 0x03
    text: >-
      Did \col(1)Cisypherestus\col(0) send you on an impossible quest?
      If that's the case, one of my books tells me that defeating a
      powerful \col(3)blue\col(0) beast in a familiar swamp will
      help you in locating \col(1)two\col(0) stones.

      There might be a portal to that swamp in this very library,
      but I have never seen it.

      Cisypherestus and I have a friend who lives in a hovel
      somewhere \col(1)hidden in these woods\col(0) that may lead you to that portal.

      Come back if you've found anything!
      
      Good luck!

  - name: TX_3304
    index: 0x04
    text: |-
      You fought the \col(3)blue\col(0) beast? Where was he? What did he give you? Flippers? What strange technology...\stop
      In another of my books, it tells of how \col(1)caves\col(0) can \col(3)freeze\col(0) in the harsh cold of winter.

  - name: TX_3305
    index: 0x05
    text: |-
      Were you successful in finding the stones? \col(3)Horatio\col(0) told me the hedge maze to the east of here may hide passages where the armos once stood.

  - name: TX_3306
    index: 0x06
    text: |-
      What was the treasure of the \col(1)shrine\col(0)?\stop
      A cape of winds!! How fantastic!\stop
      I must tell \col(1)Cisypherestus\col(0).

  - name: TX_3307
    index: 0x07
    text: |-
      You made it to the \col(1)shrine\col(0)? Was it as magnificent as the books say?

  - name: TX_3308
    index: 0x08
    text: >-
      Oh, and take this! It was curled inside one of my books.

  - name: TX_3309
    index: 0x09
    text: |-
      You say you can
      solve the riddle
      of this \col(1)book\col(0)?
      Hoh hoh! This
      should be
      interesting! I
      give to you the
      \col(1)Book of Seals\col(0)!

  - name: TX_330a
    index: 0x0a
    text: |-
      Did you solve
      the riddle?

  - name: TX_330b
    index: 0x0b
    text: |-
      You have done
      well to make it
      so far. I
      acknowledge your
      courage and
      offer you this.

  - name: TX_330c
    index: 0x0c
    text: |-
      Continue on
      without fear.
      Do not forget
      your courage.

  - name:
    - TX_330d
    - TX_330e
    - TX_330f
    index:
    - 0x0d
    - 0x0e
    - 0x0f
    text: |-
      Tch! I build
      a humble hovel
      at the top of
      \col(1)Forever Falls\col(0),
      and what do I
      get? Some random
      elf boy barging in!
      You're going to
      be a good lad
      and leave me
      alone now, right?
        \opt()Yes \opt()No

  - name: TX_3310
    index: 0x10
    text: |-
      I thought
      you said you'd
      leave! Now go!
        \opt()Ok \opt()Nah

  - name: TX_3311
    index: 0x11
    text: |-
      Then go!
      Leave!

  - name: TX_3312
    index: 0x12
    text: |-
      Gah! What are
      they teaching
      the children in
      town these days?!
      Fine. Take this
      and leave me alone.
      Go burn down
      the castle or
      something.

  - name:
    - TX_3313
    - TX_3314
    index:
    - 0x13
    - 0x14
    text: |-
      I have nothing
      more for you!
      Now leave!

  - name: TX_3315
    index: 0x15
    text: |-
      I thank you for
      paying to fix
      my door.

  - name: TX_3316
    index: 0x16
    text: |-
      Don't do it
      again.

  - name: TX_3317
    index: 0x17
    text: |-
      ...I'd like to
      say that, but I
      cannot take what
      you do not have.
      \jump(TX_3316)
    null_terminator: False

  - name: TX_3318
    index: 0x18
    text: |-
      Shh! Don't tell!

  - name: TX_3319
    index: 0x19
    text: |-
      I have nothing
      more for you.

- group: 0x34
  data:
  - name: TX_3400
    index: 0x00
    text: |-
      Th-the pain!
      This is the end
      for me...
      To think the
      prosperous royal
      family could
      fade in a
      generation...
      The pain...

  - name: TX_3401
    index: 0x01
    text: |-
      \call(TX_3400)\stop
      Give him the
      \col(1)Magic Potion\col(0)?
        \opt()Yes \opt()No

  - name: TX_3402
    index: 0x02
    text: |-
      Is this
      \col(1)Magic Potion\col(0)?\stop
      Hmm...
      It looks very
      suspect, but if
      I am to die, it
      can't hurt to
      drink it!

  - name: TX_3403
    index: 0x03
    text: |-
      Glug, glug, ahh!

  - name: TX_3404
    index: 0x04
    text: |-
      Eww! It's awful!\stop
      But it flows
      through me! The
      royal line is
      saved!\stop
      Who are you?\stop
      Well, thank you,
      \Link!\stop
      The filthy water
      that flowed in
      from the east
      lately must have
      made me ill. I
      will never
      forget you!\stop
      What do you
      wish for,
      \Link?\stop
      Huh? A big fish?
      Do you mean...
      \col(3)Jabu-Jabu\col(0)?\stop
      But \col(3)Jabu-Jabu\col(0) is
      the guardian of
      us Zoras!
      Calling him a
      fish is an
      insult! Watch
      your language!

  - name: TX_3405
    index: 0x05
    text: |-
      Filthy water has
      been flowing in
      from the east
      lately. Perhaps
      that is what
      made me ill.
      Anyhow, I'll
      never forget
      your deeds!

  - name: TX_3406
    index: 0x06
    text: |-
      You have even
      given us clean
      seas again! I
      must thank you
      once more! What?
      You wish to
      enter \col(3)Jabu-Jabu\col(0)?
      I wish I could
      tell you to do
      as you please,
      but \col(3)Jabu-Jabu\col(0) is
      still young.
      He's too small
      to go inside
      him. You'd
      better give up.

  - name: TX_3407
    index: 0x07
    text: |-
      \Link!
      The savior of
      the \col(3)Zora Seas\col(0)!\stop
      I thank you on
      behalf of all
      Zoras!

  - name: TX_3408
    index: 0x08
    text: |-
      Great healer!\stop
      What do you ask?\stop
      You wish to
      enter \col(3)Jabu-Jabu\col(0)?
      My permission is
      needed to enter
      \col(3)Jabu-Jabu\col(0), but
      I can't permit
      just anyone to
      see our
      guardian.
      Anyhow, the
      filthy seawater
      has left \col(3)Jabu-
      Jabu\col(0) near death.\n
    null_terminator: False

  - name: TX_3409
    index: 0x09
    text: |-
      If you say you
      must, then find
      a way to get rid
      of this filthy
      seawater and
      save \col(3)Jabu-Jabu\col(0).
      Will you accept
      this quest?
        \opt()Yes \opt()No

  - name: TX_340a
    index: 0x0a
    text: |-
      Is that so...
      Then nothing
      can be done.

  - name: TX_340b
    index: 0x0b
    text: |-
      Very well!
      Then take this!

  - name: TX_340c
    index: 0x0c
    text: |-
      This is the \col(1)key\col(0)
      to \col(3)Eyeglass
      Isle Library\col(0)
      east of here. It
      is an ancient
      \col(3)library\col(0), so I do
      not know if this
      \col(1)key\col(0) still works,
      but perhaps you
      can research why
      the seawater is
      so filthy. I
      trust you to
      save \col(3)Jabu-Jabu\col(0).

  - name: TX_340d
    index: 0x0d
    text: |-
      Thanks to you,
      our seawater is
      clean again, and
      \col(3)Jabu-Jabu's\col(0)
      health has
      returned.
      All is well.\stop
      I never go back
      on my word. I
      dub you Zora
      Hero and permit
      you to enter
      \col(3)Jabu-Jabu\col(0).\n
    null_terminator: False

  - name: TX_340e
    index: 0x0e
    text: |-
      You may go see
      \col(3)Jabu-Jabu\col(0).

  - name: TX_340f
    index: 0x0f
    text: |-
      You are the hero
      who saved the
      \col(3)Zora Seas\col(0). I
      offer you thanks
      on behalf of
      all Zoras.

  - name: TX_3410
    index: 0x10
    text: |-
      \col(3)King Zora\col(0) has no
      successor. If
      his illness
      continues and he
      passes on, we
      Zoras will lose
      our last king.

  - name: TX_3411
    index: 0x11
    text: |-
      Thanks to you,
      \col(3)King Zora\col(0) is
      all better! The
      royal line is
      secure!

  - name: TX_3412
    index: 0x12
    text: |-
      You want to go
      inside
      \col(3)Jabu-Jabu\col(0)?!?
      But \col(3)Jabu-Jabu\col(0) is
      just a baby!
      You can't fit
      inside him!

  - name: TX_3413
    index: 0x13
    text: |-
      That stairway
      leads to the
      throne room.
      The king is ill.
      If you must see
      him, make it
      brief.

  - name: TX_3414
    index: 0x14
    text: |-
      That stairway
      leads to the
      throne room.
      Please watch
      your manners
      when speaking
      to the king.

  - name: TX_3415
    index: 0x15
    text: |-
      Our ruler, \col(3)King
      Zora\col(0), suddenly
      fell ill...
      We've done all
      that we can, but
      his condition
      does not change.

  - name: TX_3416
    index: 0x16
    text: |-
      \Link!
      This is \col(3)King
      Zora's\col(0) palace.

  - name: TX_3417
    index: 0x17
    text: |-
      \col(3)King Zora's\col(0) face
      looks so pained,
      doesn't it?

  - name: TX_3418
    index: 0x18
    text: |-
      Thank you so
      much for what
      you did! You
      gave \col(3)King Zora\col(0)
      his life!

  - name: TX_3419
    index: 0x19
    text: |-
      The \col(3)Zora Seas\col(0)
      are once again
      sparkling clean!
      This, too, is
      thanks to you,
      \Link.

  - name: TX_341a
    index: 0x1a
    text: |-
      We believe we
      need a special
      medicine called
      a \col(1)Magic Potion\col(0)
      to cure \col(3)King
      Zora's\col(0) illness.
      Where can we
      find a magician
      to create such
      a \col(1)potion\col(0)?

  - name:
    - TX_341b
    - TX_341c
    - TX_341d
    - TX_341e
    - TX_341f
    index:
    - 0x1b
    - 0x1c
    - 0x1d
    - 0x1e
    - 0x1f
    text: |-
      Well, well,
      \Link!

  - name: TX_3420
    index: 0x20
    text: |-
      This was the
      palace of our
      ruler, \col(3)King
      Zora\col(0), but long
      ago the king
      fell ill. Ever
      since, we've
      continued on
      with no king.
      That which the
      king looked
      after...
      The \col(1)key\col(0) to
      \col(3)Eyeglass Isle
      Library\col(0)--it's
      been lost.

  - name: TX_3421
    index: 0x21
    text: |-
      The king looked
      after the \col(1)key\col(0) to
      \col(3)Eyeglass Isle
      Library\col(0) far to
      the east.

  - name: TX_3422
    index: 0x22
    text: |-
      \col(3)King Zora\col(0) will
      only permit a
      great hero to
      enter \col(3)Jabu-Jabu\col(0).

  - name: TX_3423
    index: 0x23
    text: |-
      Did you get that
      \col(1)"essence"\col(0) all
      right? That's as
      expected from
      one dubbed hero
      by \col(3)King Zora\col(0).

  - name: TX_3424
    index: 0x24
    text: |-
      That stairway
      leads to the
      throne room.
      Watch your
      manners while
      before the king.

  - name: TX_3425
    index: 0x25
    text: |-
      Welcome,
      traveler. This
      is the palace
      of the great
      \col(3)King Zora\col(0).

  - name: TX_3426
    index: 0x26
    text: |-
      Well, well!
      \Link!
      This is \col(3)King
      Zora's\col(0) palace.

  - name: TX_3427
    index: 0x27
    text: |-
      Our ruler, \col(3)King
      Zora\col(0), sits in
      the rear. Take
      care not to be
      discourteous.

  - name: TX_3428
    index: 0x28
    text: |-
      The king is a
      very open Zora.
      Feel free to
      speak to him
      about anything.

  - name:
    - TX_3429
    - TX_342a
    - TX_342b
    - TX_342c
    - TX_342d
    - TX_342e
    - TX_342f
    index:
    - 0x29
    - 0x2a
    - 0x2b
    - 0x2c
    - 0x2d
    - 0x2e
    - 0x2f
    text: |-
      Our seas are
      clean once again
      thanks to you.
      The king is
      most pleased!

  - name: TX_3430
    index: 0x30
    text: |-
      Welcome, traveler, to my humble island!\stop
      I'm not sure why, but I feel the need to give this to you.\stop
      I offer you this--
      a \col(1)Zora Scale\col(0)!

  - name: TX_3431
    index: 0x31
    text: |-
      This \col(1)scale\col(0) will allow you to take deeper dives under-
      water! Have fun!

  - name: TX_3432
    index: 0x32
    text: |-
      ...\stop
      Why are you here?

  - name: TX_3433
    index: 0x33
    text: >-
      I have nothing more to give you.

      You may be on your way!

  - name: TX_3434
    index: 0x34
    text: |-
      Wait!

  - name: TX_3435
    index: 0x35
    text: |-
      Do you need me,
      great mermaid?
        \opt()Yes \opt()No

  - name: TX_3436
    index: 0x36
    text: |-
      I see...

  - name: TX_3437
    index: 0x37
    text: |-
      Oh! A \col(1)secret\col(0)
      from the Zora I
      sent to \col(3)Holodrum\col(0)
      to find us a new
      domain! You have
      done well! Thank
      you. For your
      reward... Yes!
      Lend me your
      \col(1)Sword\col(0)! I shall
      sharpen it!

  - name: TX_3438
    index: 0x38
    text: |-
      Do you mean
      to cheat me?

  - name:
    - TX_3439
    - TX_343a
    - TX_343b
    - TX_343c
    - TX_343d
    - TX_343e
    - TX_343f
    index:
    - 0x39
    - 0x3a
    - 0x3b
    - 0x3c
    - 0x3d
    - 0x3e
    - 0x3f
    text: |-
      I'll teach you
      the \col(1)secret\col(0) to
      sharpening your
      \col(1)sword\col(0) in
      \col(3)Holodrum\col(0), too!\stop
      \secret1\stop
      Come back if you
      forget my
      \col(1)secret\col(0).

  - name: TX_3440
    index: 0x40
    text: |-
      The seas are
      filthy--koff!
      Koff! I can't
      swim in peace.

  - name: TX_3441
    index: 0x41
    text: |-
      Ha-ha! The seas
      are clean!
      I can swim in
      peace again!

  - name: TX_3442
    index: 0x42
    text: |-
      \call(TX_3447)
      Take care not
      to be rude!

  - name: TX_3443
    index: 0x43
    text: |-
      The seas are
      back to normal!
      \col(3)King Zora\col(0) is all
      better, too!
      All is good!

  - name: TX_3444
    index: 0x44
    text: |-
      Don't think us
      noble sea Zoras
      the same as
      those savage,
      vulgar river
      Zoras!

  - name: TX_3445
    index: 0x45
    text: |-
      You're in the
      wrong place if
      you want to
      complain about
      being attacked
      by a river Zora.

  - name: TX_3446
    index: 0x46
    text: |-
      There's a large
      \col(3)library\col(0) east of
      \col(3)King Zora's\col(0)
      palace.

  - name: TX_3447
    index: 0x47
    text: |-
      \col(3)King Zora's
      Palace\col(0) is
      beyond here.

  - name: TX_3448
    index: 0x48
    text: |-
      The seas are
      sparkling clean!
      \col(3)King Zora\col(0) will
      be so pleased!

  - name: TX_3449
    index: 0x49
    text: |-
      \col(3)Jabu-Jabu\col(0)
      resides beyond
      here. It's said
      to be quite a
      maze inside
      his belly.

  - name: TX_344a
    index: 0x4a
    text: |-
      We must take
      care around
      \col(3)Jabu-Jabu\col(0)!
      He can even
      swallow us!

  - name: TX_344b
    index: 0x4b
    text: |-
      Isn't there
      anyone who we
      can entrust the
      Zora's symbol
      of heroism to?
      The symbol--
      the \col(1)Zora Scale\col(0)--
      is a powerful
      sea charm...

  - name: TX_344c
    index: 0x4c
    text: |-
      \Link! Hero
      of the Zoras!

  - name: TX_344d
    index: 0x4d
    text: |-
      We don't get
      many mermaids
      visiting us!
      This is
      \col(3)Zora Village\col(0)!

  - name: TX_344e
    index: 0x4e
    text: |-
      Welcome, young
      mermaid! This
      is \col(3)Zora Village\col(0)!

- group: 0x35
  data:
  - name: TX_3500
    index: 0x00
    text: |-
      You can plant a
      \col(1)Gasha Seed\col(0).
        \opt()Plant \opt()Don't

  - name: TX_3501
    index: 0x01
    text: |-
      You got a
      \col(1)Gasha Nut\col(0)!
      Check what's
      inside!

  - name: TX_3502
    index: 0x02
    text: |-
      inside!

  - name: TX_3503
    index: 0x03
    text: |-
      Inside was a \heartpiece
      \col(1)Piece of Heart\col(0)!
      Check it on the
      Subscreen.

  - name: TX_3504
    index: 0x04
    text: |-
      A \col(1)ring\col(0) was
      \jump(TX_3502)
    null_terminator: False

  - name: TX_3505
    index: 0x05
    text: |-
      A \col(1)Potion\col(0) was
      \jump(TX_3502)
    null_terminator: False

  - name: TX_3506
    index: 0x06
    text: |-
      \col(1)200 Rupees\col(0) were
      \jump(TX_3502)
    null_terminator: False

  - name: TX_3507
    index: 0x07
    text: |-
      \col(1)5 hearts\col(0) were
      \jump(TX_3502)
    null_terminator: False

  - name: TX_3508
    index: 0x08
    text: |-
      A \col(1)fairy\col(0) was
      \jump(TX_3502)
    null_terminator: False

  - name: TX_3509
    index: 0x09
    text: |-
      This soft earth
      is great for
      planting \col(1)seeds\col(0).

- group: 0x36
  data:
  - name: TX_3600
    index: 0x00
    text: |-
      Sailin' the seas
      is every man's
      dream!\stop
      It was great
      to so gallantly
      sail off to me
      dreams...
      \call(TX_3602)

  - name: TX_3601
    index: 0x01
    text: |-
      Ahoy! It's been
      a long time! I
      didn't expect to
      meet you 'ere!
      We've come all
      the way back
      from \col(3)'Olodrum\col(0)...
      \call(TX_3602)

  - name: TX_3602
    index: 0x02
    text: |-
      But we got stuck
      in this \col(3)Sea o'
      Storms\col(0) and can't
      get out!
      Har! Ye've got
      the \col(1)Zora's Scale\col(0)
      sea charm!
      Aye, that could
      calm this \col(3)Sea o'
      Storms\col(0)!
      'Ow about you
      give me that
      \col(1)Zora's Scale\col(0)!
        \opt()OK \opt()Sorry

  - name: TX_3603
    index: 0x03
    text: |-
      Thank'ee!
      Yer a good man!
      Ahoy, mateys!

  - name: TX_3604
    index: 0x04
    text: |-
      \call(TX_3603)
      We're off to
      \col(3)'Olodrum\col(0), the
      land o' seasons!

  - name: TX_3605
    index: 0x05
    text: |-
      \call(TX_3603)
      See the spirit
      o' a seafarin'
      man!

  - name: TX_3606
    index: 0x06
    text: |-
      Thank'ee! Now
      we can escape
      these seas! Take
      this as a sign
      o' me thanks!
      It's the jewel
      called the \col(1)Tokay
      Eyeball\col(0)! It's
      said to be the
      thing that opens
      the way to the
      \col(3)ancient tomb\col(0).
      I don't know if
      it's true or
      not, though.

  - name: TX_3607
    index: 0x07
    text: |-
      Aye, aye, sir!

  - name: TX_3608
    index: 0x08
    text: |-
      'Ow long have we
      been adrift?

  - name: TX_3609
    index: 0x09
    text: |-
      \col(3)Cap'n\col(0) isn't
      thinkin' about a
      thing.

  - name: TX_360a
    index: 0x0a
    text: |-
      Tales tell of
      giant ruins out
      east in the
      \col(3)Sea o' No
      Return\col(0).

  - name: TX_360b
    index: 0x0b
    text: |-
      If ye go to the
      ruins out east,
      ye can never
      return.

  - name: TX_360c
    index: 0x0c
    text: |-
      Ye've really
      'elped us out.
      Aye, we found
      that \col(1)Tokay
      Eyeball\col(0) on
      \col(3)Crescent Island\col(0).
      Maybe ye should
      'ead that way?\stop
      We're off, now!
      Ahoy, mateys!\stop
      Aye, aye, sir!

  - name: TX_360d
    index: 0x0d
    text: |-
      The eye socket
      is hollowed out,
      but what could
      go there..?

- group: 0x37
  data:
  - name: TX_3700
    index: 0x00
    text: |-
      You know, I rolled that pot into place myself. Tested it and everything, stood right there, nodded, thought \col(1)yep, that'll do it.\col(0) And you just... walked past it. Like it was nothing.

  - name: TX_3701
    index: 0x01
    text: >-
      H-hey! How did you get back here? I put a POT there!

  - name: TX_3702
    index: 0x02
    text: |-
      I don't even want to know how. Nobody's gotten back here uninvited before, not once, and I've been stocking this library for three years.

  - name: TX_3703
    index: 0x03
    text: |-
      ...You know what, fine. You clearly want something back here bad enough to out-stubborn a boulder. Here, take it. Least I can do is make sure you didn't sneak past a pot for nothing.

  - name: TX_3704
    index: 0x04
    text: >-
      Just don't tell anyone how you got it, and have a great rest of your randomizer run.

  - name: TX_3705
    index: 0x05
    text: >-
      ...Hang on. You've already got one of these.

  - name: TX_3706
    index: 0x06
    text: >-
      Course you do. Figures a rock wasn't gonna stop someone who's already got half of everything worth having.

  - name: TX_3707
    index: 0x07
    text: >-
      Here. Call it a toll for the rock. You didn't out-stubborn a boulder for nothing.

  - name: TX_3708
    index: 0x08
    text: >-
      That money should help you on your way. Now please scram before my manager fires me for giving money to people I don't know.

  - name: TX_3709
    index: 0x09
    text: >-
      ...Right. Already gave you the toll. I just don't want to be fired by my manager, so don't go expecting seconds.

  - name:
    - TX_370a
    - TX_370b
    - TX_370c
    - TX_370d
    - TX_370e
    - TX_370f
    index:
    - 0x0a
    - 0x0b
    - 0x0c
    - 0x0d
    - 0x0e
    - 0x0f
    text: |-
      Remember--it
      needs appraisal.

  - name: TX_3710
    index: 0x10
    text: |-
      I am \col(3)Adlar\col(0).\stop
      For fifty years,
      I was a palace
      advisor, but I
      have since been
      chased from the
      palace and am
      now retired. I
      have known the
      Queen since she
      was young. She
      always held the
      people foremost
      in her heart.
      But since she
      took that girl
      \col(3)Nayru\col(0) in, she
      has changed
      completely...
      She quit
      listening to my
      advice...
      It was that girl
      who suggested
      I be banished,
      but...

  - name: TX_3711
    index: 0x11
    text: |-
      Just who is this
      \col(3)Nayru\col(0)..?\stop
      I can only see
      her as a monster
      in human guise.\stop
      I wonder if the
      Queen is
      all right...

  - name: TX_3712
    index: 0x12
    text: |-
      I thought \col(3)Nayru\col(0)
      had gone, but
      now it seems
      something is
      wrong with the
      Queen. She gives
      me that same
      evil feeling
      \col(3)Nayru\col(0) used to.
      It's like the
      Queen is now
      the beast in
      human guise...\stop
      I hope the Queen
      is all right...

  - name: TX_3713
    index: 0x13
    text: |-
      The Queen is
      back to her kind
      old self. That's
      good and well,
      but she says
      she's going on
      an eye-opening
      journey to other
      lands.\stop
      ...I hope she'll
      be all right...

  - name: TX_3714
    index: 0x14
    text: |-
      I am \col(3)Plen\col(0), the
      mayor here in
      \col(3)Lynna City\col(0).\stop
      \col(3)Lynna\col(0) has a long
      history reaching
      back hundreds
      of years. Back
      then, it was
      \col(3)Lynna Village\col(0)--
      not a city.

  - name: TX_3715
    index: 0x15
    text: |-
      I am \col(3)Plen\col(0), the
      mayor here in
      \col(3)Lynna City\col(0).\stop
      Long ago, \col(3)Queen
      Ambi\col(0), who ruled
      these lands,
      suddenly changed
      into a cruel and
      heartless
      person.
      Our records say
      it was because a
      girl who served
      her was taken
      away by
      something.\stop
      I wonder... What
      really happened?

  - name: TX_3716
    index: 0x16
    text: |-
      Huh? It seems
      the Queen did
      not return to
      the palace.
      Maybe something
      happened at
      the tower.

- group: 0x38
  data:
  - name: TX_3800
    index: 0x00
    text: |-
      What's going on?
      My grandson has
      turned to stone!
      How??? Why???
      Wake up! Call me
      Gramma again...

  - name: TX_3801
    index: 0x01
    text: |-
      Seeing my
      healthy
      grandson keeps
      me healthy!

- group: 0x39
  data:
  - name: TX_3900
    index: 0x00
    text: |-
      The seed will show you the way.

  - name: TX_3901
    index: 0x01
    text: |-
      A cold day stays
      away while the
      crystals remain.

  - name: TX_3902
    index: 0x02
    text: >-
      This mystic shrine
      with each floor for a season,
      share rooms that assist your way.

  - name: TX_3903
    index: 0x03
    text: |-
      My guard is the color of \col(1)flora\col(0).

  - name:
    - TX_3904
    index:
    - 0x04
    text: |-
      My guard's \col(1)right\col(0)eousness is a shield.

  - name: TX_3905
    index: 0x05
    text: |-
      My guard is not of the others.
      He is neither \col(1)right\col(0)eous nor a \col(1)desireable color\col(0).

  - name: TX_3906
    index: 0x06
    text: |-
      My friends each desire a \col(1)guard\col(0).

  - name: TX_3907
    index: 0x07
    text: |-
      The door of this room, shared among seasons, will open by the orb.

  - name: TX_3908
    index: 0x08
    text: |-
      Even when inaccessible by stump, this room in winter still can be breached by other means.

  - name: TX_3909
    index: 0x09
    text: |-
      Beware deep
      waters.

  - name: TX_390a
    index: 0x0a
    text: |-
      Open your ears
      to the sound of
      a sword against
      the wall.

  - name: TX_390b
    index: 0x0b
    text: |-
      Test your luck.

  - name: TX_390c
    index: 0x0c
    text: |-
      Stone soldiers
      do not fear
      swords.

  - name: TX_390d
    index: 0x0d
    text: |-
      The four
      crystals tie
      it all together.

  - name: TX_390e
    index: 0x0e
    text: |-
      Truth glares at
      your back.

  - name: TX_390f
    index: 0x0f
    text: |-
      Greater speed
      gives greater
      distance.

  - name: TX_3910
    index: 0x10
    text: |-
      The internal
      flow floods with
      blue and recedes
      with red.

  - name: TX_3911
    index: 0x11
    text: |-
      Color reflects
      weakness.

  - name: TX_3912
    index: 0x12
    text: |-
      The Golden Isle
      is on the water.

  - name:
    - TX_3913
    - TX_3914
    - TX_3915
    - TX_3916
    - TX_3917
    - TX_3918
    - TX_3919
    - TX_391a
    - TX_391b
    - TX_391c
    - TX_391d
    index:
    - 0x13
    - 0x14
    - 0x15
    - 0x16
    - 0x17
    - 0x18
    - 0x19
    - 0x1a
    - 0x1b
    - 0x1c
    - 0x1d
    text: |-
      The legend of
      the mermaid has
      been handed down
      from past
      to present.

- group: 0x3d
  data:
  - name:
    - TX_3d00
    - TX_3d01
    - TX_3d02
    - TX_3d03
    - TX_3d04
    - TX_3d05
    - TX_3d0d
    index:
    - 0x00
    - 0x01
    - 0x02
    - 0x03
    - 0x04
    - 0x05
    - 0x0d
    text: >-
      \pos(2)Uhhn... \Link!\stop

      ...It's ended.

      Thank you, \Link.
      You halted the completion
      of the rites that would have
      revived \col(3)Ganon\col(0)!\stop

      Since they could not sacrifice me
      in their final rite, the powers
      of darkness could revive
      only a mindless, raging \col(3)Ganon\col(0).\stop

      Your power, wisdom and
      courage were able to prevent
      \col(3)Twinrova's\col(0) planned
      resurrection of \col(3)Ganon\col(0) again.\stop

      Now hope and peace can return
      to the hearts of the people once again.
      Thank you! You are a true hero!
      Let us return to the others!

      I'm really wanting some
      of that birthday cake!

  - name:
    - TX_3d06
    - TX_3d07
    - TX_3d08
    - TX_3d10
    - TX_3d11
    - TX_3d12
    - TX_3d14
    - TX_3d15
    index:
    - 0x06
    - 0x07
    - 0x08
    - 0x10
    - 0x11
    - 0x12
    - 0x14
    - 0x15
    text: |-
      \pos(0)\col(3)Zelda\col(0)! I am
      glad to see you
      return safely...
      \Link!
      You are all I
      expected! I
      always believed
      in you!

  - name:
    - TX_3d09
    - TX_3d13
    index:
    - 0x09
    - 0x13
    text: |-
      \pos(0)I knew you
      would find a
      way, \Link!\stop
      Let us dance
      together again!

  - name:
    - TX_3d0a
    - TX_3d0b
    index:
    - 0x0a
    - 0x0b
    text: |-
      \pos(0)Welcome back,
      \col(3)Zelda\col(0), and you,
      too, \Link.\stop
      It's all over,
      isn't it?

  - name:
    - TX_3d0c
    - TX_3d16
    index:
    - 0x0c
    - 0x16
    text: |-
      \pos(0)\Link...\stop
      The three \sym(0x57)
      on your left
      hand symbolize
      power, wisdom
      and courage--
      these are the
      mark of the hero
      who is fated to
      appear when
      peace crumbles
      in \col(3)Hyrule\col(0).\stop
      With the
      \col(1)Essences of
      Nature and Time\col(0)\stop
      and the courage
      you possess, you
      have fought back
      the powers of
      evil! The
      guidance of the
      Triforce has
      made you into
      this legendary
      hero! Thank you,
      \Link.

  - name: TX_3d0e
    index: 0x0e
    text: |-
      \pos(2)Oh, no!!!\stop
      The castle is
      crumbling now
      that the powers
      of shadow wane!\stop
      We must get
      out of here!

  - name: TX_3d0f
    index: 0x0f
    text: |-
      \pos(2)! ! !
      What do we do..?

- group: 0x41
  data:
  - name: TX_4100
    index: 0x00
    text: |-
      \pos(2)Let me ease your
      weariness. Close
      your eyes...

  - name:
    - TX_4101
    - TX_4102
    - TX_4103
    - TX_4104
    - TX_4105
    index:
    - 0x01
    - 0x02
    - 0x03
    - 0x04
    - 0x05
    text: |-
      \pos(2)Come see me
      whenever your
      quest has made
      you weary.

  - name: TX_4106
    index: 0x06
    text: |-
      Please listen,
      young one!
      You may not
      believe this,
      but I am the
      \col(3)Queen Fairy\col(0),
      guardian of this
      sea! The curse
      of an evil one
      named \col(3)Veran\col(0) has
      made me appear
      so!
      The magic of
      \col(1)Fairy Powder\col(0)
      can turn me
      back to normal.\stop
      \col(3)Veran\col(0) has
      poisoned the
      sea. Soon all
      living things in
      it will perish!\n
    null_terminator: False

  - name: TX_4107
    index: 0x07
    text: |-
      Please go find
      some \col(1)Fairy
      Powder\col(0)!

  - name: TX_4108
    index: 0x08
    text: |-
      You brought me
      \col(1)Fairy Powder\col(0)!
      Now I can return
      to normal!
      Sprinkle the
      \col(1)powder\col(0) on me!

  - name: TX_4109
    index: 0x09
    text: |-
      As thanks, I will create portal spots around the forest!

- group: 0x42
  data:
  - name: TX_4200
    index: 0x00
    text: |-
      I... I am called
      \col(3)\Child\col(0)...\stop
      ! ! ! ! ! !
      Oops! I spoke to
      a stranger!

  - name: TX_4201
    index: 0x01
    text: |-
      You're \Link?\stop
      I'm \col(3)\Child\col(0)!
      No way!

  - name: TX_4202
    index: 0x02
    text: |-
      Are you strong?
        \opt()Yes \opt()No

  - name: TX_4203
    index: 0x03
    text: |-
      I'll be strong,
      too, so I can
      protect my
      mom and dad!

  - name: TX_4204
    index: 0x04
    text: |-
      Huh???
      And it doesn't
      bother you?!?

  - name: TX_4205
    index: 0x05
    text: |-
      I can't wait to
      be a grownup.

- group: 0x43
  data:
  - name: TX_4300
    index: 0x00
    text: |-
      I am \col(3)Bipin\col(0), the
      expert arborist!
      I know plenty
      about trees.
      Now let me tell
      you somethin'!\stop
      \col(3)Blossom\col(0) and I
      just had our
      first child!
      Yes! We did!!!\stop
      Have a look!

  - name: TX_4301
    index: 0x01
    text: |-
      So, the name is
      decided!
      \col(3)\Child\col(0), huh?
      It's a fine
      name! I hope he
      grows to be a
      fine child!

  - name: TX_4302
    index: 0x02
    text: |-
      Hey, \Link!\stop
      My boy is ill,
      but still I have
      something to
      teach you.

  - name: TX_4303
    index: 0x03
    text: |-
      My boy is well,
      so I can rest!
      Today, I have
      more to teach!

  - name: TX_4304
    index: 0x04
    text: |-
      Hey, \Link!
      \col(3)\Child\col(0) grows
      by the day, and
      today, I have
      more to teach!

  - name: TX_4305
    index: 0x05
    text: |-
      \Link! It's
      been too long!
      I've moved to
      this city, too.
      It's nice to see
      a familiar face!

  - name: TX_4306
    index: 0x06
    text: |-
      Hey, \Link!
      \col(3)\Child\col(0) is
      doing well!
      And I can teach
      you everything
      about trees!

  - name: TX_4307
    index: 0x07
    text: |-
      Hey, \Link!\stop
      \col(3)\Child\col(0) is
      all grown up and
      off on his own!\n
    null_terminator: False

  - name: TX_4308
    index: 0x08
    text: |-
      I'll teach you
      everything
      about trees!

  - name: TX_4309
    index: 0x09
    text: |-
      The contents of
      a \col(1)Gasha Nut\col(0)
      depend on where
      the \col(1)seed\col(0) was
      planted. If you
      find a good
      spot, tell me!

  - name: TX_430a
    index: 0x0a
    text: |-
      Inside a \col(1)Gasha
      Nut\col(0)? More than
      anything, you
      find \col(1)Magic
      Rings\col(0), but
      sometimes you
      find Rupees
      or hearts.

  - name: TX_430b
    index: 0x0b
    text: |-
      I've heard
      that a \col(1)nut's\col(0)
      contents depend
      on the actions
      of the planter.
      The more he
      travels and the
      more beasts he
      slays, the
      better his
      nut will do!

  - name: TX_430c
    index: 0x0c
    text: |-
      Finding new
      places to plant
      \col(1)Gasha Seeds\col(0) and
      finding secret
      stairways seems
      to be good for
      \col(1)Gasha Nuts\col(0).

  - name: TX_430d
    index: 0x0d
    text: |-
      And helping
      those in need
      is good for
      \col(1)Gasha Nuts\col(0).

  - name: TX_430e
    index: 0x0e
    text: |-
      Finding spots to
      plant \col(1)Gasha
      Seeds\col(0) is hard.
      Dig holes, move
      rocks.

  - name: TX_430f
    index: 0x0f
    text: |-
      My experience
      holds that
      planting \col(1)Gasha
      Seeds\col(0) in strange
      spots produces
      more rare and
      unusual results!

  - name: TX_4310
    index: 0x10
    text: |-
      A traveler once
      told me the
      time it takes
      for a planted
      \col(1)Gasha Seed\col(0) to
      mature into a
      tree is related
      to how many
      monsters you
      slay. Could
      this be true?

  - name: TX_4311
    index: 0x11
    text: |-
      Darn \col(1)Gasha
      Seeds\col(0)!
      Sproutin'!
      Growin'! Makin'
      \col(1)nuts\col(0)!
      And all those
      new \col(1)nuts\col(0) got
      different stuff
      inside! Hah! Get
      rid of it for
      me!

  - name: TX_4312
    index: 0x12
    text: |-
      I know there's
      soil right by my
      house, but don't
      go plantin'
      \col(1)seeds\col(0) there!

  - name: TX_4313
    index: 0x13
    text: |-
      Huh? My name?
      It's \col(3)Pippin\col(0)!
      Don't forget it!

- group: 0x44
  data:
  - name: TX_4400
    index: 0x00
    text: |-
      I am \col(3)Blossom\col(0).\stop
      This is my first
      child--a healthy
      baby boy!
      But I am having
      trouble choosing
      a name. Can you
      help me think
      of one? What
      would you call
      him?

  - name:
    - TX_4401
    - TX_4402
    - TX_4403
    - TX_4404
    - TX_4405
    - TX_4406
    - TX_4407
    index:
    - 0x01
    - 0x02
    - 0x03
    - 0x04
    - 0x05
    - 0x06
    - 0x07
    text: |-
      You would name
      him \col(3)\Child\col(0)?
        \opt()Yes \opt()No

  - name: TX_4408
    index: 0x08
    text: |-
      It's a fine
      name! I shall
      call him so!
      He seems happy
      to have it.
      Come visit us
      anytime.

  - name: TX_4409
    index: 0x09
    text: |-
      I hope \col(3)\Child\col(0)
      will grow strong
      and healthy,
      like you.

  - name: TX_440a
    index: 0x0a
    text: |-
      Yes, perhaps you
      should give it
      more thought.

  - name: TX_440b
    index: 0x0b
    text: |-
      \col(3)\Child\col(0) looks a
      little strange.\stop
      I want to take
      him to a doctor,
      but we have no
      Rupees...
      Could you please
      lend us some?
        \opt()Yes \opt()No

  - name: TX_440c
    index: 0x0c
    text: |-
      Really? How much
      can you lend us?
       \opt()150 \opt()50
       \opt()10  \opt()1

  - name: TX_440d
    index: 0x0d
    text: |-
      Thank you,
      \Link!
      You are a true
      samaritan!

  - name: TX_440e
    index: 0x0e
    text: |-
      Thank you.
      This should be
      just enough.

  - name: TX_440f
    index: 0x0f
    text: |-
      Thanks...
      I'll have to do
      something about
      the rest...

  - name: TX_4410
    index: 0x10
    text: |-
      \Link! You
      are no rich man.
      Your sympathy
      will do fine.

  - name: TX_4411
    index: 0x11
    text: |-
      I understand...

  - name: TX_4412
    index: 0x12
    text: |-
      \col(3)\Child\col(0) has
      gotten better!
      Thank you!

  - name: TX_4413
    index: 0x13
    text: |-
      My baby never
      sleeps. How can
      I get him to
      sleep, \Link?
        \opt()Sing
        \opt()Play

  - name: TX_4414
    index: 0x14
    text: |-
      I like to sing!
      I'll try it!

  - name: TX_4415
    index: 0x15
    text: |-
      I see! If we
      play, he'll get
      all tired out.
      Thank you!

  - name: TX_4416
    index: 0x16
    text: |-
      Well? Isn't he a
      darling baby?

  - name: TX_4417
    index: 0x17
    text: |-
      See! \col(3)\Child\col(0)
      has grown!

  - name: TX_4418
    index: 0x18
    text: |-
      \Link!
      We meet again!\stop
      Do you remember
      naming our son,
      \col(3)\Child\col(0)?
      He's quite well!

  - name: TX_4419
    index: 0x19
    text: |-
      \col(3)\Child\col(0) is
      so hyperactive!\stop
      Were you a
      hyperactive
      child, \Link?
        \opt()Yes \opt()No

  - name: TX_441a
    index: 0x1a
    text: |-
      \col(3)\Child\col(0) is
      very shy.\stop
      What kind of
      child were you,
      \Link?\stop
      Energetic?
        \opt()Yes \opt()No

  - name: TX_441b
    index: 0x1b
    text: |-
      \col(3)\Child\col(0) is such
      a curious child.\stop
      What kind of
      child were you,
      \Link?\stop
      Energetic?
        \opt()Yes \opt()No

  - name: TX_441c
    index: 0x1c
    text: |-
      Oh? I bet you
      were quite a
      mischievous boy.

  - name: TX_441d
    index: 0x1d
    text: |-
      Quiet, perhaps?
        \opt()Yes \opt()No

  - name: TX_441e
    index: 0x1e
    text: |-
      Really? You must
      have been cute!

  - name: TX_441f
    index: 0x1f
    text: |-
      Were you weird?
        \opt()Yes \opt()No

  - name: TX_4420
    index: 0x20
    text: |-
      You were? I
      never would
      have guessed...

  - name: TX_4421
    index: 0x21
    text: |-
      I guess it's
      hard to sum
      it up in a word.

  - name: TX_4422
    index: 0x22
    text: |-
      \col(3)\Child\col(0) is
      so hyperactive!

  - name: TX_4423
    index: 0x23
    text: |-
      \col(3)\Child\col(0) is
      too shy.

  - name: TX_4424
    index: 0x24
    text: |-
      \col(3)\Child\col(0) is a
      strange child,
      but he'll be a
      man of great
      deeds!

  - name:
    - TX_4425
    - TX_4426
    index:
    - 0x25
    - 0x26
    text: |-
      \Link!\stop
      Do you remember
      naming our son,
      \col(3)\Child\col(0)?
      He's grown into
      a fine man!

  - name: TX_4427
    index: 0x27
    text: |-
      \Link!\stop
      Do you remember
      naming our son,
      \col(3)\Child\col(0)? He's
      a master
      arborist, too!

  - name: TX_4428
    index: 0x28
    text: |-
      \Link!\stop
      Do you remember
      naming our son,
      \col(3)\Child\col(0)?
      He's a famed
      musician now!

  - name: TX_4429
    index: 0x29
    text: |-
      \col(3)\Child\col(0)...
      He's grown up,
      but he idles
      his time away.\stop
      What am I to do?

  - name: TX_442a
    index: 0x2a
    text: |-
      \col(3)\Child\col(0), my
      son, heard of
      your deeds, and
      is now trying
      to become a
      hero himself.

  - name: TX_442b
    index: 0x2b
    text: |-
      That child has
      high hopes and
      big dreams!!!

  - name: TX_442c
    index: 0x2c
    text: |-
      \col(3)\Child\col(0) said
      he is writing a
      song about your
      deeds!

  - name: TX_442d
    index: 0x2d
    text: |-
      \col(3)\Child\col(0)...
      He's grown up,
      but he idles
      his time away.\stop
      What am I to do?

  - name: TX_442e
    index: 0x2e
    text: |-
      My son is now a
      great hero, too.

  - name: TX_442f
    index: 0x2f
    text: |-
      \col(3)\Child\col(0) has
      followed in
      \col(3)Bipin's\col(0)
      footsteps.
      We're so happy!

  - name: TX_4430
    index: 0x30
    text: |-
      Have you heard
      \col(3)\Child\col(0)'s
      songs? They're
      quite nice.

  - name: TX_4431
    index: 0x31
    text: |-
      Thank you! Now
      I can take him
      to the doctor.

  - name: TX_4432
    index: 0x32
    text: |-
      It looks like
      you don't have
      enough Rupees.

- group: 0x45
  data:
  - name:
    - TX_4500
    - TX_4501
    - TX_4502
    - TX_4503
    - TX_4504
    - TX_4505
    index:
    - 0x00
    - 0x01
    - 0x02
    - 0x03
    - 0x04
    - 0x05
    text: |-
      \sfx(0xc6)Thank you!

  - name: TX_4506
    index: 0x06
    text: |-
      \sfx(0xc6)Then be gone!

  - name: TX_4507
    index: 0x07
    text: |-
      \sfx(0xc6)You don't have
      enough Rupees!

  - name: TX_4508
    index: 0x08
