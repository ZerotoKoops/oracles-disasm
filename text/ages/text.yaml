- group: 0x31
  data:
  - name: TX_3100
    index: 0x00
    text: >-
      \sfx(0xc7)You found our humble cave.
      There's usually a lot more water in here.

  - name: TX_3101
    index: 0x01
    text: |-
      \sfx(0xc7)You did a good
      job finding my
      hiding place.

  - name: TX_3102
    index: 0x02
    text: >-
      \sfx(0xc7)How much longer do you
      think the water will be dried up?

  - name: TX_3103
    index: 0x03
    text: >-
      \sfx(0xc7)Water and rocks is what gives us life.
      I hope they never go away!

  - name: TX_3104
    index: 0x04
    text: >-
      \sfx(0xc7)I wonder if my friend will ever stop digging.
      He's a machine!

  - name: TX_3105
    index: 0x05
    text: >-
      \sfx(0xc7)I like to pass the time by watching my friend dig.

  - name: TX_3106
    index: 0x06
    text: |-
      \sfx(0xc7)Gorons have
      always taken
      care of their
      brothers, and
      they always
      will!

  - name: TX_3107
    index: 0x07
    text: >-
      \sfx(0xc7)Have you ever been in a brotherhood like ours?

  - name: TX_3108
    index: 0x08
    text: >-
      \sfx(0xc7)They say only the
      \col(1)Subrosians\col(0) rival us
      in dance moves.

  - name: TX_3109
    index: 0x09
    text: >-
      \sfx(0xc7)Have you seen any \col(1)Subrosians\col(0)?
      Say hello to them, and maybe they will let you \col(1)dance\col(0) with them!

  - name: TX_310a
    index: 0x0a
    text: >-
      \sfx(0xc7)Where did you come from?

  - name: TX_310b
    index: 0x0b
    text: >-
      \sfx(0xc7)We're thinking about opening more games,
      but don't want to be in infamy
      like the gorons from \col(1)Rolling Ridge\col(0).

  - name: TX_310c
    index: 0x0c
    text: >-
      \sfx(0xc7)The \col(3)Graceful
      Goron\col(0) here was bragging
      about how he found a
      beautiful \col(1)pearl\col(0).
      I'm so jealous.

  - name: TX_310d
    index: 0x0d
    text: |-
      \sfx(0xc7)I can dance
      carefree because
      the world is
      so peaceful!

  - name: TX_310e
    index: 0x0e
    text: >-
      \sfx(0xc7)Do you think there
      is anything beyond our cave?

  - name: TX_310f
    index: 0x0f
    text: |-
      \sfx(0xc7)The other day, I
      broke the record
      at Target Carts!

  - name: TX_3110
    index: 0x10
    text: |-
      \sfx(0xc7)Ever since that
      big pig--the
      \col(3)Great Moblin\col(0)--
      came, we haven't
      been able to
      grow the Gorons'
      famed \col(1)Bomb
      Flowers\col(0).

  - name: TX_3111
    index: 0x11
    text: |-
      \sfx(0xc7)Is the \col(3)Great
      Moblin\col(0) gone?
      Now we can grow
      \col(1)Bomb Flowers\col(0)
      without a care
      in the world!

  - name: TX_3112
    index: 0x12
    text: |-
      \sfx(0xc7)\col(1)Bomb Flowers\col(0)
      grow slowly over
      a long period of
      time.

  - name: TX_3113
    index: 0x13
    text: |-
      \sfx(0xc7)Some weird
      building
      suddenly
      appeared here on
      \col(3)Rolling Ridge\col(0)!\stop
      Some guy called
      the \col(3)Great Moblin\col(0)
      built it, but
      it's in our way!

  - name: TX_3114
    index: 0x14
    text: |-
      \sfx(0xc7)Did you destroy
      the \col(3)Great
      Moblin's Keep\col(0)?
      Thank you!\stop
      Now we can go
      see the Gorons
      who live on the
      eastern peak!

  - name: TX_3115
    index: 0x15
    text: |-
      \sfx(0xc7)I want to go get
      rid of the \col(3)Great
      Moblin\col(0), but I
      can't roll fast
      enough to get
      there...
      Long ago on top
      of this ridge,
      there was a tree
      that had seeds
      that made you go
      fast. Even a
      Goron could roll
      at great speeds!

  - name: TX_3116
    index: 0x16
    text: |-
      \sfx(0xc7)Hey! I just
      noticed the
      \col(3)Great Moblin\col(0) is
      gone from
      \col(3)Rolling Ridge\col(0). I
      never should
      have worried.

  - name: TX_3117
    index: 0x17
    text: |-
      \sfx(0xc7)We Gorons have
      many mystical
      items! If you
      get any, take
      good care of
      them.

  - name: TX_3118
    index: 0x18
    text: |-
      \sfx(0xc7)Are you hanging
      on tight to your
      \col(1)Brother Emblem\col(0)?
      You must take
      good care of it,
      no matter what.

  - name: TX_3119
    index: 0x19
    text: |-
      \sfx(0xc7)Hey, brother!
      Are you dancing
      well today, too?

  - name: TX_311a
    index: 0x1a
    text: |-
      \sfx(0xc7)You humans are
      looking stranger
      every day. What
      happened?

  - name: TX_311b
    index: 0x1b
    text: |-
      \sfx(0xc7)I'm gonna make
      this place more
      livable and fill
      it with Gorons!

  - name: TX_311c
    index: 0x1c
    text: |-
      \sfx(0xc7)There's a big
      waterfall here
      on \col(3)Rolling
      Ridge\col(0). You
      should see it at
      least once.

  - name: TX_311d
    index: 0x1d
    text: |-
      \sfx(0xc7)I've heard
      there's a cure
      for the Goron
      cold. It's
      called \col(1)Lava
      Soup\col(0). I'd like
      to try it once.

  - name: TX_311e
    index: 0x1e
    text: |-
      \sfx(0xc7)\col(3)Rolling Ridge\col(0) is
      in an uproar now
      with the \col(3)Great
      Moblin\col(0) here.

  - name: TX_311f
    index: 0x1f
    text: |-
      \sfx(0xc7)\col(3)Rolling Ridge\col(0) is
      back to its calm
      ways now that
      the \col(3)Great Moblin\col(0)
      is gone.

  - name: TX_3120
    index: 0x20
    text: |-
      \sfx(0xc7)There's said to
      be a Goron
      called \col(3)Biggoron\col(0)
      who's as big as
      a mountain, but
      he lives some-
      where other than
      \col(3)Rolling Ridge\col(0).
      I'd like to meet
      him.

  - name: TX_3121
    index: 0x21
    text: |-
      \sfx(0xc7)In places east
      of here, the
      Goron Dance is
      all the rage! If
      you can't dance
      well, you won't
      make friends.

  - name: TX_3122
    index: 0x22
    text: |-
      \sfx(0xc7)The Goron Dance!
      It's gonna be a
      world-wide hit!

  - name: TX_3123
    index: 0x23
    text: |-
      \sfx(0xc7)Gorons have
      always loved
      games and they
      always will! You
      gotta save time
      to have fun!

  - name: TX_3124
    index: 0x24
    text: |-
      \sfx(0xc7)The \col(3)Graceful
      Goron\col(0) dances in
      the back! He's
      so cool!

  - name: TX_3125
    index: 0x25
    text: |-
      \sfx(0xc7)The Goron Dance
      gives form to
      the passionate
      hearts of
      Gorons. I'm
      going to master
      it someday.

  - name: TX_3126
    index: 0x26
    text: |-
      \sfx(0xc7)I'm aiming to be
      the second
      generation
      \col(3)Graceful Goron\col(0)!

  - name: TX_3127
    index: 0x27
    text: |-
      \sfx(0xc7)Who are these
      hood-wearing
      folk? They've
      been asking all
      about the Goron
      Dance.

  - name: TX_3128
    index: 0x28
    text: |-
      \sfx(0xc7)I don't know who
      you are or where
      you're from, but
      thank you for
      getting rid of
      the \col(3)Great
      Moblin\col(0). That
      wretch was
      keeping us from
      growing \col(1)Bomb
      Flowers\col(0).
      Now we can grow
      \col(1)Bomb Flowers\col(0)
      without any
      worries! Take
      one as a sign
      of our thanks.

  - name: TX_3129
    index: 0x29
    text: |-
      \sfx(0xc7)Now that I think
      about it, long
      ago a young boy
      saved the Goron
      Elder...
      Maybe you can be
      like that boy!
      We won't get
      pushed around
      the next time a
      guy like the
      \col(3)Great Moblin\col(0)
      comes around!
      Thanks!

  - name:
    - TX_312a
    - TX_312b
    - TX_312c
    - TX_312d
    - TX_312e
    - TX_312f
    - TX_3130
    index:
    - 0x2a
    - 0x2b
    - 0x2c
    - 0x2d
    - 0x2e
    - 0x2f
    - 0x30
    text: |-
      \sfx(0xc7)Oh! You're that
      boy from the
      other day! Who'd
      have thought I'd
      see you here!\stop
      I'm thinking up
      \col(1)secrets\col(0) for us
      Gorons. Do you
      know any?
        \opt()Yes \opt()No

  - name: TX_3131
    index: 0x31
    text: |-
      \sfx(0xc7)Oh. Oh, well.

  - name: TX_3132
    index: 0x32
    text: |-
      \sfx(0xc7)Hey! That's a
      great one!\stop
      From now on,
      that \col(1)secret\col(0) will
      live in the
      hearts of all
      Gorons! In
      thanks, I'll
      give you the
      great \col(1)Biggoron's
      Sword\col(0)!
      However!!!
      I must test you
      to see if you
      can use this
      \col(1)sword\col(0), OK?
        \opt()OK \opt()I'll pass

  - name: TX_3133
    index: 0x33
    text: |-
      \sfx(0xc7)You have to,
      right?

  - name: TX_3134
    index: 0x34
    text: |-
      Huh? You don't
      need \col(1)Biggoron's
      Sword\col(0)?

  - name: TX_3135
    index: 0x35
    text: |-
      Here's the test:
      Use \col(1)Biggoron's
      Sword\col(0) to hit the
      targets! Do you
      know the rules?
        \opt()Yes \opt()No

  - name: TX_3136
    index: 0x36
    text: |-
      Then let me
      explain.\stop
      Use your \col(1)sword\col(0)
      to hit the balls
      at the targets.
      Try to get as
      many points as
      you can. You'll
      get 10 balls.
      The targets are:
      Fairy  100 pts
      Blue    30 pts
      Red    -10 pts
      Imp    -50 pts
      Got it?
        \opt()Yes \opt()No

  - name: TX_3137
    index: 0x37
    text: |-
      OK! If you can
      get at least
      300 points, that
      \col(1)sword\col(0) is yours.
      Ready? Begin!

  - name: TX_3138
    index: 0x38
    text: |-
      \sfx(0xc7)Hmm... Maybe you
      were too quick.
      Wanna try again?
         \opt()Yes \opt()No

  - name: TX_3139
    index: 0x39
    text: |-
      Come back after
      you practice.

  - name: TX_313a
    index: 0x3a
    text: |-
      \sfx(0xc7)Well done!
      As promised,
      \col(1)Biggoron's Sword\col(0)
      is yours!

  - name: TX_313b
    index: 0x3b
    text: |-
      \sfx(0xc7)I'll teach you
      the \col(1)secret\col(0) to
      using \col(1)Biggoron's\col(1)
      Sword\col(0) in\x20
      \col(3)Labrynna\col(0), too!\stop
      \secret1\stop
      Come back if you
      forget the
      \col(1)secret\col(0)!

  - name: TX_313c
    index: 0x3c
    text: |-
      \sfx(0xc7)Did you come to
      take my test?
        \opt()Yes  \opt()No

  - name: TX_313d
    index: 0x3d
    text: |-
      What? You don't
      need the feared
      \col(1)Biggoron's
      Sword\col(0)?

  - name: TX_313e
    index: 0x3e
    text: |-
      \sfx(0xc7)Here's the
      \col(1)secret\col(0) to using
      \col(1)Biggoron's Sword\col(0)
      in \col(3)Labrynna\col(0),
      too:\stop
      \secret1\stop
      Don't forget it!

  - name: TX_313f
    index: 0x3f
    text: |-
      \sfx(0xc7)That was too
      early!

  - name: TX_3140
    index: 0x40
    text: |-
      \sfx(0xc7)Too late! You're
      off tempo!

  - name: TX_3141
    index: 0x41
