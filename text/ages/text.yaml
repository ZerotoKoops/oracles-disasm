  - name: TX_303d
    index: 0x3d
    text: |-
      Ring Fortunes\stop
      Through a \col(3)Ring
      Fortune\col(0) you and
      a friend each
      get a \col(1)ring\col(0) as
      a sign of your
      friendship when
      you and a friend
      use a Game Link
      cable to link
      two Game Boy
      Color systems.\stop
      Talk to \col(3)Blue
      Snake\col(0) after
      connecting your
      Game Boy
      systems to link.\stop
      After checking
      your \col(3)fortune\col(0),
      he'll give you
      each a \col(1)ring\col(0) that
      suits your
      friendship.\stop
         --Warning--\x20\x20
      You cannot do
      it alone.\stop
      You must do it
      with a Game Pak
      a friend has
      played.\stop
      Read others?
        \opt()Read \opt()Don't

