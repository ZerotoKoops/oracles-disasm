      \sfx(0xc6)You already
      have it!

  - name:
    - TX_4509
    - TX_450a
    index:
    - 0x09
    - 0x0a
    text: |-
      \sfx(0xc6)Buy something!
      A Shield for
      \num1 Rupees?
        \opt()OK \opt()No thanks

  - name:
    - TX_450b
    - TX_450c
    index:
    - 0x0b
    - 0x0c
    text: |-
      \sfx(0xc6)Greetings!
      Here's a deal!
      10 Ember Seeds
      for 20 Rupees!
        \opt()OK \opt()No thanks

  - name: TX_450d
    index: 0x0d
    text: |-
      \sfx(0xc6)Greetings!
      Here's a deal!
      10 Bombs for
      30 Rupees!
        \opt()OK \opt()No thanks

  - name: TX_450e
    index: 0x0e
    text: |-
      \sfx(0xc6)I surrender!
      In return, I
      offer my advice!
      To get to the
      old man's house
      out of the
      deeper woods, you must keep traveling north!
      \sfx(0xc6)

      ...weather?
      I think it must get progressively warmer each step!\stop
      And please say hello to my brother in the \col(1)Jiku Cliffs\col(0)!
      He may have more information for you!

  - name: TX_450f
    index: 0x0f
    text: |-
      \sfx(0xc6)I surrender!
      In return, I
      offer my advice!
      To get to the crazed salesman's house out of the deeper woods,
      you must travel east, south, north, then west!
      \sfx(0xc6)
      Oh, and the season must start its coldest and progress naturally!


- group: 0x46
  data:
  - name: TX_4600
    index: 0x00
    text: |-
      I, \col(3)\Child\col(0), am
      writing a song
      to praise the
      great hero,
      \Link!

  - name: TX_4601
    index: 0x01
    text: |-
      My song is
      almost finished!\stop
      Say, which is
      more important,
      love or courage?
        \opt()Love \opt()Courage

  - name: TX_4602
    index: 0x02
    text: |-
      My song is
      almost complete!\stop
      I think you'll
      like it.

  - name: TX_4603
    index: 0x03
    text: |-
      Finally! My song
      is now finished!\stop
      Will you listen?
        \opt()Yes \opt()No

  - name: TX_4604
    index: 0x04
    text: |-
      How was it?

  - name: TX_4605
    index: 0x05
    text: |-
      Really..?
      Come listen
      anytime!

- group: 0x47
  data:
  - name: TX_4700
    index: 0x00
    text: |-
      I am called
      \col(3)\Child\col(0). They
      say I was named
      by a great man.
      Isn't it a cool
      name?

  - name: TX_4701
    index: 0x01
    text: |-
      Where have you
      been, \Link?
      Do you remember
      me?\stop
      It's \col(3)\Child\col(0)!\stop
      Mom and Dad are
      doing well, too!

  - name: TX_4702
    index: 0x02
    text: |-
      Do you have
      a girlfriend?
        \opt()Yes \opt()No

  - name: TX_4703
    index: 0x03
    text: |-
      ...Actually,
      I have someone
      I like, too, but
      don't tell!

  - name: TX_4704
    index: 0x04
    text: |-
      ...I guess you
      aren't ready.

  - name: TX_4705
    index: 0x05
    text: |-
      I can't wait to
      grow up!

- group: 0x48
  data:
  - name: TX_4800
    index: 0x00
    text: |-
      I, \col(3)\Child\col(0),
      have decided to
      take the same
      tree-lined path
      as my father!

  - name: TX_4801
    index: 0x01
    text: |-
      Someday I shall
      fill the world
      with my trees!\stop
      I know!
      You can help me!
      Here!!!

  - name: TX_4802
    index: 0x02
    text: |-
      With this, you
      can add to the
      greenery, too!

  - name: TX_4803
    index: 0x03
    text: |-
      Someday, I shall
      fill the world
      with my trees!

  - name: TX_4804
    index: 0x04
    text: |-
      You can ask me
      anything about
      trees.

  - name:
    - TX_4805
    - TX_4806
    index:
    - 0x05
    - 0x06
    text: |-
      Most enemies
      stop moving when
      you hit them
      with \col(1)Pegasus
      Seeds\col(0), but not
      strong ones.

  - name: TX_4807
    index: 0x07
    text: |-
      \col(1)Mystery Seeds\col(0)
      are amazing!\stop
      They can take
      the shock out
      of electrical
      beasts.

  - name: TX_4808
    index: 0x08
    text: |-
      I must dig holes
      to plant trees,
      but sometimes, I
      find huge
      Rupees!

  - name:
    - TX_4809
    - TX_480a
    index:
    - 0x09
    - 0x0a
    text: |-
      Have you heard
      of \col(1)Gale Seeds\col(0)?\stop
      They usually
      bring up a
      twister, but you
      can use them
      to blow enemies
      far away, too!

  - name: TX_480b
    index: 0x0b
    text: |-
      Most monsters
      stop moving when
      you hit them
      with \col(1)Pegasus
      Seeds\col(0), but not
      strong ones.

  - name: TX_480c
    index: 0x0c
    text: |-
      \col(1)Mystery Seeds\col(0)
      are amazing!\stop
      They can take
      the shock out
      of electrical
      beasts.

- group: 0x49
  data:
  - name: TX_4900
    index: 0x00
    text: |-
      My name is
      \col(3)\Child\col(0).
      Isn't it groovy?

  - name: TX_4901
    index: 0x01
    text: |-
      Hey! \Link!\stop
      Remember me?
      It's \col(3)\Child\col(0)!
      All right!
      We meet again!

  - name: TX_4902
    index: 0x02
    text: |-
      Which was first,
      the chicken or
      the egg?
        \opt()Chicken \opt()Egg

  - name: TX_4903
    index: 0x03
    text: |-
      Hmm...
      Then how did
      that chicken
      hatch?

  - name: TX_4904
    index: 0x04
    text: |-
      Hmm...
      Then who laid
      that egg?

  - name: TX_4905
    index: 0x05
    text: |-
      I can't wait
      to grow up!

- group: 0x4a
  data:
  - name: TX_4a00
    index: 0x00
    text: |-
      My name is
      \col(3)\Child\col(0).
      I am training
      every day to
      be a hero like
      you, \Link!

  - name: TX_4a01
    index: 0x01
    text: |-
      Someday I will
      travel the lands
      and save the
      world's peoples,
      like my hero,
      \Link!\stop
      So can you give
      me some advice?\stop
      What will make
      me mightier?
      Training daily?
        \opt()Yes \opt()No

  - name: TX_4a02
    index: 0x02
    text: |-
      Natural talent?
        \opt()Yes \opt()No

  - name: TX_4a03
    index: 0x03
    text: |-
      A caring heart?
        \opt()Yes \opt()No

  - name: TX_4a04
    index: 0x04
    text: |-
      Hmm... It's
      hard, isn't it?

  - name: TX_4a05
    index: 0x05
    text: |-
      I see! I have
      learned a lot!

  - name: TX_4a06
    index: 0x06
    text: |-
      With your help,
      I shall be a
      great hero!

  - name: TX_4a07
    index: 0x07
    text: |-
      Here! I give you
      this in thanks!

  - name: TX_4a08
    index: 0x08
    text: |-
      I will continue
      my training!!!

- group: 0x4b
  data:
  - name: TX_4b00
    index: 0x00
    text: |-
      My name is
      \col(3)\Child\col(0)!
      Isn't it a cool
      name?
      Yeah, dude!

  - name: TX_4b01
    index: 0x01
    text: |-
      I'm gonna save
      my money and
      go out into the
      world!\stop
      So can you make
      a contribution?
        \opt()Yes \opt()No

  - name: TX_4b02
    index: 0x02
    text: |-
      How much can
      you contribute?
       \opt()100 \opt()50
       \opt()10  \opt()0

  - name: TX_4b03
    index: 0x03
    text: |-
      You're stingy,
      dude.

  - name: TX_4b04
    index: 0x04
    text: |-
      Thanks, dude!
      I'll never
      forget this!

  - name: TX_4b05
    index: 0x05
    text: |-
      That's it, dude?
      ...Uh, thanks!!!

  - name: TX_4b06
    index: 0x06
    text: |-
      It's better than
      nothin'! Thanks!

  - name: TX_4b07
    index: 0x07
    text: |-
      You're stingy,
      dude! Later!

  - name: TX_4b08
    index: 0x08
    text: |-
      I can't buy
      anything, dude!
      Words are worth
      more!

  - name: TX_4b09
    index: 0x09
    text: |-
      I wonder what's
      happenin' out
      there in the
      world...

  - name: TX_4b0a
    index: 0x0a
    text: |-
      \Link,
      what's up?
      I've been out
      in the world
      building
      character!
      Yeah, dude!\stop
      Since you gave
      me a donation,
      here!!!

  - name: TX_4b0b
    index: 0x0b
    text: |-
      Dude, from now
      on we're buds!

- group: 0x4d
  data:
  - name: TX_4d00
    index: 0x00
    text: |-
      Aren't you
      \Link? I knew
      we'd meet. How'd
      you like to hear
      a useful tip?
        \opt()OK \opt()No thanks

  - name: TX_4d01
    index: 0x01
    text: |-
      Have you no
      desire?

  - name: TX_4d02
    index: 0x02
    text: |-
      You know the
      \col(3)Clock Shop\col(0) in
      \col(3)Holodrum's\col(0) \col(3)Horon
      Village\col(0), right?
      Dig around in
      back of it. A
      friend of mine
      is there. Tell
      my friend this
      \col(1)secret\col(0) I'm about
      to tell you.
      Understand?
        \opt()Yes \opt()No

  - name: TX_4d03
    index: 0x03
    text: |-
      Remember this:\stop
      \secret1\stop
      Got it?
        \opt()Yes \opt()No

  - name: TX_4d04
    index: 0x04
    text: |-
      That's it.

  - name: TX_4d05
    index: 0x05
    text: |-
      Hello there! Do
      you believe what
      you see? If you
      do, I'll teach
      you something!
      Do you?
        \opt()Yes \opt()No

  - name: TX_4d06
    index: 0x06
    text: |-
      Suit yourself.

  - name: TX_4d07
    index: 0x07
    text: |-
      In \col(3)Holodrum's\col(0)
      graveyard, there
      is but one grave
      with no flowers.
      If you tell the
      one inside the
      grave the \col(1)secret\col(0)
      I am about to
      tell you,
      something good
      will happen,
      understand?
        \opt()Yes \opt()No

  - name: TX_4d08
    index: 0x08
    text: |-
      The \col(1)secret\col(0) is:\stop
      \secret1\stop
      Got it?
        \opt()Yes \opt()No

  - name: TX_4d09
    index: 0x09
    text: |-
      Good luck!

  - name: TX_4d0a
    index: 0x0a
    text: |-
      Oh! A stranger
      has spoken to
      me! I must teach
      you something
      good! Will you
      listen?
        \opt()Yes \opt()No

  - name: TX_4d0b
    index: 0x0b
    text: |-
      Well, I won't
      make you.

  - name: TX_4d0c
    index: 0x0c
    text: |-
      My brother lives
      in the cave near
      the three peaks
      of the \col(3)Subrosian
      Volcanoes\col(0) in
      \col(3)Holodrum's\col(0) land
      of Subrosia.
      If you tell him
      my \col(1)secret\col(0), he'll
      give you
      something good!
      OK?
        \opt()OK \opt()Once more

  - name: TX_4d0d
    index: 0x0d
    text: |-
      Here goes!\stop
      \secret1\stop
      You got that?
        \opt()Yes \opt()No

  - name: TX_4d0e
    index: 0x0e
    text: |-
      Say hi to my
      brother!

  - name: TX_4d0f
    index: 0x0f
    text: |-
      Say, aren't you
      a pupil of the
      master diver in
      \col(3)Holodrum's\col(0)
