    - 0x4e
    - 0x4f
    text: |-
      \sfx(0xc7)You gotta have
      both rhythm and
      passion!

  - name: TX_2450
    index: 0x50
    text: |-
      \sfx(0xc7)I love dancing!
      It's like every
      cell in your
      body comes
      alive!

  - name: TX_2451
    index: 0x51
    text: |-
      \sfx(0xc7)We Gorons will
      find our own
      dance someday.

  - name: TX_2452
    index: 0x52
    text: |-
      \sfx(0xc7)I want to spread
      this dance
      around the
      world! Dance
      is the world's
      common language!

  - name: TX_2453
    index: 0x53
    text: |-
      \sfx(0xc7)Did you know?\stop
      Passion flows
      from inside the
      body when you
      let the rhythm
      take control!

  - name: TX_2454
    index: 0x54
    text: |-
      \sfx(0xc7)My grandpa
      told me this:\stop
      \call(TX_2444)\stop
      It's good
      advice.

  - name: TX_2455
    index: 0x55
    text: |-
      \sfx(0xc7)Dance is like
      both sport and
      art. You do
      exercise and you
      express your
      feelings.

  - name:
    - TX_2456
    - TX_2457
    - TX_2458
    - TX_2459
    - TX_245a
    - TX_245b
    - TX_245c
    - TX_245d
    - TX_245e
    - TX_245f
    index:
    - 0x56
    - 0x57
    - 0x58
    - 0x59
    - 0x5a
    - 0x5b
    - 0x5c
    - 0x5d
    - 0x5e
    - 0x5f
    text: |-
      \sfx(0xc7)You gotta have
      both rhythm and
      passion!

  - name: TX_2460
    index: 0x60
    text: |-
      The Goron Dance
      reminds me
      Subrosia's
      bubbling lava!

  - name: TX_2461
    index: 0x61
    text: |-
      I'm going to
      create a
      Subrosian Dance!
      I'll open a new
      page in
      Subrosian
      culture!

  - name: TX_2462
    index: 0x62
    text: |-
      Your body learns
      by just dancing!
      Only youth can
      push the limits
      of endurance!
      Only hot steel
      can be tempered!

  - name: TX_2463
    index: 0x63
    text: |-
      These Gorons
      have artistic
      sense! We must
      develop our own
      sense, too!

  - name: TX_2464
    index: 0x64
    text: |-
      This Goron Dance
      has hot lava-
      like passion!

  - name: TX_2465
    index: 0x65
    text: |-
      The Goron Dance
      is at the
      cutting edge of
      the dance scene!

  - name:
    - TX_2466
    - TX_2467
    - TX_2468
    - TX_2469
    - TX_246a
    - TX_246b
    - TX_246c
    - TX_246d
    - TX_246e
    - TX_246f
    index:
    - 0x66
    - 0x67
    - 0x68
    - 0x69
    - 0x6a
    - 0x6b
    - 0x6c
    - 0x6d
    - 0x6e
    - 0x6f
    text: |-
      Dancing like
      this is great
      fun! It really
      gives meaning to
      life!

  - name: TX_2470
    index: 0x70
    text: |-
      \pos(1)\sfx(0xc7)Huh?\stop
      I was diggin' a
      new tunnel and
      I ended up here!

  - name: TX_2471
    index: 0x71
    text: |-
      \pos(1)\sfx(0xc7)Hey!!!\stop
      What are you
      doin' here?
      Don't you know?
      Games are the
      new fad on
      \col(3)Rolling Ridge\col(0)!
      You should check
      them out, too!

  - name: TX_2472
    index: 0x72
    text: |-
      \sfx(0xc7)Finding treasure
      is so hard!
      Will you let me
      hang on to 20
      \col(1)Ember Seeds\col(0) and
      20 \col(1)Bombs\col(0)?\stop
      If I'm lucky and
      find treasure,
      I'll give you
      half.
      How about it?
        \opt()Yes \opt()No

  - name: TX_2473
    index: 0x73
    text: |-
      \sfx(0xc7)No..? Come back
      if you change
      your mind.

  - name: TX_2474
    index: 0x74
    text: |-
      \sfx(0xc7)Huh?
      Don't lie. Keep
      better track of
      how much stuff
      you have.

  - name: TX_2475
    index: 0x75
    text: |-
      \sfx(0xc7)Leave it to me!
      I'll find some
      treasure. Check
      back with me
      after a while!

  - name: TX_2476
    index: 0x76
    text: |-
      \sfx(0xc7)I'll be waiting!
      I'm sure there's
      treasure here!

  - name: TX_2477
    index: 0x77
    text: |-
      \sfx(0xc7)Thanks to you,
      I found some
      treasure!
      I've got two
      chests, so take
      your pick.
        \opt()Left  \opt()Right

  - name: TX_2478
    index: 0x78
    text: |-
      \sfx(0xc7)Tell me if you
      think you've
      found some
      buried treasure!

  - name: TX_2479
    index: 0x79
    text: |-
      \sfx(0xc7)It's terrible!
      The Goron Elder
      has been buried
      alive under
      some rocks!
      What do we do?

  - name: TX_247a
    index: 0x7a
    text: |-
      \sfx(0xc7)It's wonderful!
      The Goron Elder
      was unharmed!

  - name: TX_247b
    index: 0x7b
    text: |-
      \sfx(0xc7)The Elder is
      buried alive!
      But Gorons alone
      can't dig him
      out! If we had
      the legendary
      \col(1)Bomb Flower\col(0), we
      could blast the
      rocks away...

  - name: TX_247c
    index: 0x7c
    text: |-
      \sfx(0xc7)The Elder caused
      such a fuss!

  - name: TX_247d
    index: 0x7d
    text: |-
      \sfx(0xc7)Help! Hurry!\stop
      The Elder will
      die if we don't
      hurry! If only
      we had a \col(1)Bomb
      Flower\col(0)...

  - name: TX_247e
    index: 0x7e
    text: |-
      \sfx(0xc7)Hey!\stop
      Is that one of
      the legendary
      \col(1)Bomb Flowers\col(0)?
      You can't fool
      me! That's the
      unmistakable
      smell of a \col(1)Bomb
      Flower\col(0)!\stop
      Please!
      Let me have that
      \col(1)Bomb Flower\col(0)!
        \opt()OK \opt()No way

  - name: TX_247f
    index: 0x7f
    text: |-
      \sfx(0xc7)Without that
      \col(1)Bomb Flower\col(0), the
      Elder will die.
      Please let me
      have it!
        \opt()OK \opt()No way

  - name: TX_2480
    index: 0x80
    text: |-
      \sfx(0xc7)Thank you!
      Now we can save
      the Elder!

  - name: TX_2481
    index: 0x81
    text: |-
      \sfx(0xc7)I'm so relieved
      the Elder is OK.

  - name: TX_2482
    index: 0x82
    text: |-
      \sfx(0xc7)Did something
      happen?

  - name: TX_2483
    index: 0x83
    text: |-
      \sfx(0xc7)What's going on?
      I heard a loud
      noise...

  - name: TX_2484
    index: 0x84
    text: |-
      \sfx(0xc7)I guess the
      Goron Elder is
      buried under a
      pile of rocks. I
      hope someone can
      save him.

  - name: TX_2485
    index: 0x85
    text: |-
      \sfx(0xc7)They found a way
      to save the
      Elder. Now we
      can continue
      digging that new
      tunnel!

  - name: TX_2486
    index: 0x86
    text: |-
      \sfx(0xc7)This is the home
      of the Gorons.

  - name: TX_2487
    index: 0x87
    text: |-
      \pos(2)\sfx(0xc7)Huh?
      What's wrong,
      brothers?
      Were you worried
      about me?
      Ah ha ha ha ha!
      A rock that size
      can't hurt me!
      Ah ha ha ha ha!

  - name: TX_2488
    index: 0x88
    text: |-
      \sfx(0xc7)Did you bring us
      the \col(1)Bomb Flower\col(0)?
      Sorry to
      trouble you.\stop
      This is the
      shiny \col(1)key\col(0) I
      found on
      Northern Peak.
      I never found
      the keyhole, so
      I'll give this
      to you.

  - name:
    - TX_2489
    - TX_248a
    - TX_248b
    - TX_248c
    - TX_248d
    - TX_248e
    - TX_248f
    index:
    - 0x89
    - 0x8a
    - 0x8b
    - 0x8c
    - 0x8d
    - 0x8e
    - 0x8f
    text: |-
      \sfx(0xc7)We shall take
      good care of the
      \col(1)Bomb Flowers\col(0) you
      brought us. We
      shall fill the
      peaks with them!

  - name: TX_2490
    index: 0x90
    text: |-
      \sfx(0xc7)I sit here to
      protect the
      peace on
      \col(3)Rolling Ridge\col(0).

  - name: TX_2491
    index: 0x91
    text: |-
      \sfx(0xc7)Do you have a
      passionate
      heart? Only
      proven Goron
      brothers may
      pass. Be off!

  - name:
    - TX_2492
    - TX_249e
    index:
    - 0x92
    - 0x9e
    text: |-
      \sfx(0xc7)Huh?!?
      That's a \col(1)Brother
      Emblem\col(0)! You
      understand the
      passion of a
      Goron's heart!
      You may pass!

  - name: TX_2493
    index: 0x93
    text: |-
      \sfx(0xc7)I know it's
      abrupt, but can
      you help me,
      brother?\n
    null_terminator: False

  - name: TX_2494
    index: 0x94
    text: |-
      \sfx(0xc7)Protecting
      \col(3)Rolling Ridge\col(0)
      has given my
      life meaning.
      I need an
      heirloom that
      will teach my
      descendants to
      value life...
      It'd be great if
      you could bring
      me something
      unique.

  - name: TX_2495
    index: 0x95
    text: |-
      \sfx(0xc7)Yeah...
      A \col(1)vase\col(0) would
      be great!

  - name: TX_2496
    index: 0x96
    text: |-
      \sfx(0xc7)Whoaaa!
      That \col(1)vase\col(0)! What
      a fine \col(1)Goron
      Vase\col(0)! Please!
      Let me have
      that vase!
      I'll trade you
      some \col(1)Goronade\col(0)
      for it!
        \opt()OK \opt()No thanks

  - name: TX_2497
    index: 0x97
    text: |-
      \sfx(0xc7)Oh... Come back
      if you change
      your mind.

  - name: TX_2498
    index: 0x98
    text: |-
      \sfx(0xc7)Are you ready to
      give me that
      \col(1)Goron Vase\col(0)?
        \opt()Yes \opt()No

  - name:
    - TX_2499
    - TX_24a5
    index:
    - 0x99
    - 0xa5
    text: |-
      \sfx(0xc7)Thank you! This
      is great! As
      promised--here!

  - name: TX_249a
    index: 0x9a
    text: |-
      \sfx(0xc7)I'm going to
      treasure this
      \col(1)vase\col(0)!

  - name: TX_249b
    index: 0x9b
    text: |-
      \sfx(0xc7)I'm going to
      treasure the
      \col(1)Goron Vase\col(0)!

  - name: TX_249c
    index: 0x9c
    text: |-
      \sfx(0xc7)For generations,
      my ancestors
      have sat here
      guarding the
      peace on
      \col(3)Rolling Ridge\col(0).

  - name: TX_249d
    index: 0x9d
    text: |-
      \sfx(0xc7)Do you have a
      passionate
      heart? Since
      long ago, only
      proven Goron
      brothers have
      been allowed
      to pass here.
      Be off!!!

  - name: TX_249f
    index: 0x9f
    text: |-
      \sfx(0xc7)I know it's
      abrupt, but can
      you help me,
      brother?\n
    null_terminator: False

  - name: TX_24a0
    index: 0xa0
    text: |-
      \sfx(0xc7)For generations,
      my ancestors
      have sat here
      guarding the
      peace on
      \col(3)Rolling Ridge\col(0).
      I can't leave,
      but I'm so
      hungry I could
      starve...
      Can you give me
      some food...

  - name: TX_24a1
    index: 0xa1
    text: |-
      \sfx(0xc7)\col(1)Rock Sirloin\col(0),
      \col(1)Rock Brisket\col(0)...
      Anything!

  - name: TX_24a2
    index: 0xa2
    text: |-
      \sfx(0xc7)Whoaaa!
      You have prime
      \col(1)Rock Brisket\col(0)!\stop
      Please! Let me
      have that \col(1)Rock
      Brisket\col(0)!
      I'll trade my
      ancestors' \col(1)Goron
      Vase\col(0) for it!
        \opt()OK \opt()No thanks

  - name: TX_24a3
    index: 0xa3
    text: |-
      \sfx(0xc7)I'm so hungry I
      could starve.
      I'd love some
      \col(1)Rock Brisket\col(0)...

  - name: TX_24a4
    index: 0xa4
    text: |-
      \sfx(0xc7)Are you ready
      to give me that
      \col(1)Rock Brisket\col(0)?
        \opt()Yes \opt()No

  - name: TX_24a6
    index: 0xa6
    text: |-
      \sfx(0xc7)Ohhh! This
      \col(1)Rock Brisket\col(0) is
      so delicious!
      Thank you!

  - name: TX_24a7
    index: 0xa7
    text: |-
      \sfx(0xc7)If you get more
      food, let me
      have it!

  - name: TX_24a8
    index: 0xa8
    text: |-
      \sfx(0xc7)Welcome to
      Target Carts!
      Fire your \col(1)Seed
      Shooter\col(0) while
      riding in a
      cart. If you hit
      enough targets,
      you win a prize!
      Up to 3 misses
      wins 20 Rupees.
      Want to try? It
      costs 10 Rupees.
        \opt()Yes \opt()No

  - name: TX_24a9
    index: 0xa9
    text: |-
      \sfx(0xc7)Oh... Come
      back anytime!

  - name: TX_24aa
    index: 0xaa
    text: |-
      \sfx(0xc7)Huh? You don't
      have enough
      Rupees! Save up
      and come back!

  - name: TX_24ab
    index: 0xab
    text: |-
      \sfx(0xc7)OK! Let's get
      you started!

  - name: TX_24ac
    index: 0xac
    text: |-
      \sfx(0xc7)The prize this
      time is...this!

  - name: TX_24ad
    index: 0xad
    text: |-
      \sfx(0xc7)Ready? Go!

  - name: TX_24ae
    index: 0xae
    text: |-
      \sfx(0xc7)Welcome to
      Target Carts.
      To play, talk to
      that Goron!

  - name: TX_24af
    index: 0xaf
    text: |-
      \sfx(0xc7)That's it! You
      hit \col(4)\num1\col(0) of 12!

  - name: TX_24b0
    index: 0xb0
    text: |-
      \sfx(0xc7)Perfect!
      Nice shootin'!
      You win a prize!

  - name: TX_24b1
    index: 0xb1
    text: |-
      \sfx(0xc7)Oh, that was
      almost perfect.
      But you still
      get 20 Rupees!

  - name: TX_24b2
    index: 0xb2
    text: |-
      \sfx(0xc7)Too bad...
      Try again later.

  - name: TX_24b3
    index: 0xb3
    text: |-
      \sfx(0xc7)Ready to try
      again?
        \opt()Yes \opt()No

  - name: TX_24b4
    index: 0xb4
    text: |-
      \sfx(0xc7)Oh... But do
      try again later!

  - name: TX_24b5
    index: 0xb5
    text: |-
      \pos(2)\sfx(0xc7)Haaa...\stop
      I've worked so
      many late nights
      lately, I don't
      feel up to
      playing games.
      And I dug up a
      great prize,
      too. Oh, well...

  - name: TX_24b6
    index: 0xb6
    text: |-
      \pos(2)I need something
      energizing that
      can wake me up.

  - name: TX_24b7
    index: 0xb7
    text: |-
      \pos(2)\sfx(0xc7)That's \col(1)Goronade\col(0)!\stop
      One drink of
      that charges
      you up! Will you
      let me have it?
        \opt()Yes \opt()No

  - name: TX_24b8
    index: 0xb8
    text: |-
      \pos(2)\sfx(0xc7)No..? Oh...
      Haa... I'm just
      so tired lately!

  - name: TX_24b9
    index: 0xb9
    text: |-
      \pos(2)\sfx(0xc7)I'm wide awake
      now! Thanks!
      I'm gonna open
      up shop! Want to
      give my game a
      try?
      The first game
      is on the house.
      Want to try?
        \opt()Yes \opt()No

  - name: TX_24ba
    index: 0xba
    text: |-
      \pos(2)\sfx(0xc7)What? You don't?
      Next time it's
      10 Rupees.

  - name: TX_24bb
    index: 0xbb
    text: |-
      \pos(2)\sfx(0xc7)Of course!
      Want to hear the
      rules?
        \opt()No \opt()Yes

  - name: TX_24bc
    index: 0xbc
    text: |-
      \pos(2)\sfx(0xc7)This time, the
      prize is...this!

  - name: TX_24bd
    index: 0xbd
    text: |-
      \pos(2)\sfx(0xc7)When the game
      begins, try to
      dodge or throw
      the \col(1)Bombs\col(0) that
      start falling
      all around. See
      how long you
      can last!
      You'll get a
      wonderful prize
      if you last
      through it all.
      But if you get
      hit even once,
      you fail! OK?
        \opt()Yes \opt()No

  - name: TX_24be
    index: 0xbe
    text: |-
      \pos(2)\sfx(0xc7)Are you ready?

  - name: TX_24bf
    index: 0xbf
    text: |-
      \pos(2)\sfx(0xc7)Did you come to
      play? It costs
      10 Rupees.
      Wanna try?
        \opt()Yes \opt()No

  - name: TX_24c0
    index: 0xc0
    text: |-
      \pos(2)\sfx(0xc7)You don't? Come
      play anytime.

  - name: TX_24c1
    index: 0xc1
    text: |-
      \pos(2)\sfx(0xc7)You don't have
      enough Rupees!

  - name: TX_24c2
    index: 0xc2
    text: |-
      \pos(2)\sfx(0xc7)Wanna try again
      for 10 Rupees?
        \opt()Yes \opt()No

  - name: TX_24c3
    index: 0xc3
    text: |-
      \pos(2)\sfx(0xc7)Amazing!
      Take your prize!

  - name: TX_24c4
    index: 0xc4
    text: |-
      \sfx(0xc7)Don't tell
      anyone, but I'm
      friends with the
      famous \col(3)Graceful
      Goron\col(0). Really!

  - name: TX_24c5
    index: 0xc5
    text: |-
      \sfx(0xc7)Did you talk to
      the \col(3)Graceful
      Goron\col(0)?

  - name: TX_24c6
    index: 0xc6
    text: |-
      \sfx(0xc7)Hey!!!\stop
      That \col(1)key\col(0) looks
      like the \col(1)Mermaid
      Key\col(0) the \col(3)Graceful
      Goron\col(0) has.

  - name: TX_24c7
    index: 0xc7
    text: |-
      \sfx(0xc7)You want the
      \col(3)Graceful Goron's\col(0)
      \col(1)key\col(0), too? Aren't
      you greedy...

  - name: TX_24c8
    index: 0xc8
    text: |-
      \sfx(0xc7)Look. I don't
      know if it will
      work, but if you
      give me your
      \col(1)Lava Juice\col(0), I'll
      introduce you to
      the \col(3)Graceful
      Goron\col(0)!
      So? Can I have
      the \col(1)Lava Juice\col(0)?
        \opt()Yes \opt()No

  - name: TX_24c9
    index: 0xc9
    text: |-
      \sfx(0xc7)OK. Take this
      \col(1)Letter of
      Introduction\col(0) to
      the \col(3)Graceful
      Goron\col(0)!

  - name: TX_24ca
    index: 0xca
    text: |-
      \sfx(0xc7)If you show that
      to the \col(3)Graceful
      Goron\col(0), he'll
      understand.

  - name: TX_24cb
    index: 0xcb
    text: |-
      \sfx(0xc7)Really...
      Well, whatever!

  - name: TX_24cc
    index: 0xcc
    text: |-
      \sfx(0xc7)I hope the
      \col(3)Graceful Goron\col(0)
      gives you his
      \col(1)key\col(0)!

  - name: TX_24cd
    index: 0xcd
    text: |-
      \sfx(0xc7)What did the
      \col(3)Graceful Goron\col(0)
      have..?
      Some kind of
      mermaid-shaped
      thing... Aww...
      I forget!

  - name: TX_24ce
    index: 0xce
    text: |-
      \sfx(0xc7)The \col(3)Graceful
      Goron\col(0) drinks
      \col(1)Lava Juice\col(0) every
      day to get
      energy to
      dance. I want
      some, too!

  - name: TX_24cf
    index: 0xcf
    text: |-
      \sfx(0xc7)Welcome to
      Goron Gallery!
      This game was
      popular in
      \col(3)Lynna Village\col(0).
      Wanna try? It
      costs 20 Rupees.
        \opt()OK \opt()No thanks

  - name: TX_24d0
    index: 0xd0
    text: |-
      \sfx(0xc7)Really? Well,
      come again.

  - name: TX_24d1
    index: 0xd1
    text: |-
      \sfx(0xc7)Do you need to
      hear the rules?
        \opt()No \opt()Yes

  - name: TX_24d2
    index: 0xd2
    text: |-
      \sfx(0xc7)You don't have
      enough Rupees!

  - name: TX_24d3
    index: 0xd3
    text: |-
      \sfx(0xc7)Hit the balls
      into the targets
      with your sword:
      Fairies 100 pts
      Blue   30 pts
      Red    -10 pts
      Imps   -50 pts
      Strike   -50 pts
      You'll hit ten
      balls, and your
      prize depends
      on your total
      score. Got it?
        \opt()Yes \opt()No

  - name: TX_24d4
    index: 0xd4
    text: |-
      \sfx(0xc7)This is Goron
      Gallery! Our
      game was a big
      hit in \col(3)Lynna
      Village\col(0)! Right
      now, we're
      offering \col(1)Lava
      Juice\col(0) to one
      player with an
      excellent score!
      Want to try? It
      costs 20 Rupees.
        \opt()OK \opt()No thanks

  - name: TX_24d5
    index: 0xd5
    text: |-
      \sfx(0xc7)If you don't,
      someone else
      will get the
      \col(1)Lava Juice\col(0)!

  - name: TX_24d6
    index: 0xd6
    text: |-
      \sfx(0xc7)OK! Let's get
      started.
      Good luck!

  - name: TX_24d7
    index: 0xd7
    text: |-
      \sfx(0xc7)You got \num1 pts!

  - name: TX_24d8
    index: 0xd8
    text: |-
      \sfx(0xc7)Amazing!
      You win the
      \col(1)Lava Juice\col(0)!!!

  - name: TX_24d9
    index: 0xd9
    text: |-
      \sfx(0xc7)Too bad! Less
      than 100 pts
      doesn't win a
      prize.

  - name: TX_24da
    index: 0xda
    text: |-
      \sfx(0xc7)400 pts or more
      wins a
      \col(1)Boomerang\col(0).

  - name: TX_24db
    index: 0xdb
    text: |-
      \sfx(0xc7)300 pts or more
      wins a
      \col(1)Gasha Seed\col(0)!

  - name: TX_24dc
    index: 0xdc
    text: |-
      \sfx(0xc7)200 pts or more
      wins \col(1)20 Bombs\col(0)!

  - name: TX_24dd
    index: 0xdd
    text: |-
      \sfx(0xc7)100 points or
      more wins
      \col(1)30 Rupees\col(0)!

  - name: TX_24de
    index: 0xde
    text: |-
      \sfx(0xc7)There's no prize
      for less than
      100 pts...

  - name: TX_24df
    index: 0xdf
    text: |-
      \sfx(0xc7)Want to try
      again? It costs
      only 20 Rupees!
        \opt()OK \opt()No thanks

  - name: TX_24e0
    index: 0xe0
    text: |-
      \sfx(0xc7)Amazing!

  - name: TX_24e1
    index: 0xe1
    text: |-
      \sfx(0xc7)Ooh! You were
      hit. Too bad...

  - name: TX_24e2
    index: 0xe2
    text: |-
      \sfx(0xc7)The Elder is
      traveling around
      \col(3)Rolling Ridge\col(0)
      planting
      \col(1)Bomb Flowers\col(0)!

  - name: TX_24e3
    index: 0xe3
    text: |-
      \sfx(0xc7)The Elder is so
      full of energy.
      I should follow
      his example.

  - name: TX_24e4
    index: 0xe4
    text: |-
      \sfx(0xc7)I'm going to
      plant \col(1)Bomb
      Flowers\col(0) all over
      \col(3)Rolling Ridge\col(0)!

  - name: TX_24e5
    index: 0xe5
    text: |-
      \sfx(0xc7)The Elder sure
      is energetic...
      I can't keep up.

- group: 0x25
  data:
  - name: TX_2500
    index: 0x00
    text: |-
      There's a weird
      guy by the sea!
      He just floats
      in the air...
      I wonder what
      he's like!

  - name: TX_2501
    index: 0x01
    text: |-
      The tower seems
      to be getting
      taller...
      Is it just me?

  - name: TX_2502
    index: 0x02
    text: |-
      The tower IS
      getting taller!
      It's freaky!

  - name: TX_2503
    index: 0x03
    text: |-
      Look! Look! See
      how tall the
      tower got!

  - name: TX_2504
    index: 0x04
    text: |-
      Do towers just
      get taller on
      their own?

  - name:
    - TX_2505
    - TX_2506
    - TX_2507
    - TX_2508
    - TX_2509
    - TX_250a
    - TX_250b
    - TX_250c
    - TX_250d
    - TX_250e
    - TX_250f
    index:
    - 0x05
    - 0x06
    - 0x07
    - 0x08
    - 0x09
    - 0x0a
    - 0x0b
    - 0x0c
    - 0x0d
    - 0x0e
    - 0x0f
    text: |-
      I'm going to the
      tower to play
      again today!

  - name: TX_2510
    index: 0x10
    text: |-
      Is Zelda busy now?

  - name: TX_2511
    index: 0x11
    text: |-
      No way! It's too
      scary! It's
      pitch black
      inside that
      grave beneath
      the tree!

  - name: TX_2512
    index: 0x12
    text: |-
      Besides...

  - name: TX_2513
    index: 0x13
    text: |-
      It might come
      out...

  - name: TX_2514
    index: 0x14
    text: |-
      ...The ghost.

  - name: TX_2515
    index: 0x15
    text: |-
      \pos(2)Who are you..?
      Well...
      Welcome...
      to the darkness
      of my troubles.\stop
      I'm so
      depressed...
      I want to laugh
      until I forget
      everything. Then
      I'd be happy.
      Hah.............\stop
      ................\stop
      Tell him the \col(0x84)\item(0x08)
      \col(1)Funny Joke\col(0)?
        \opt()Yes \opt()No

  - name: TX_2516
    index: 0x16
    text: |-
      \pos(2)Huh...\stop
      What's that..?\stop
      Hah.............\stop
      ................\stop
      Oh...\stop
      That's so funny,\stop
      I forgot to
      laugh.\stop
      Thanks...\stop
      Thanks to you,
      I can be as
      depressed as I
      want to be...
      You can take
      any book you
      want from that
      bookshelf...

  - name: TX_2517
    index: 0x17
    text: |-
      \pos(2)Hah... Only the
      darkness can
      ease my heart.
      I guess laughing
      my troubles away
      is just a dream
      deferred...

  - name: TX_2518
    index: 0x18
    text: |-
      \pos(2)That's enough...
      Like a bird I
      once saw, fly
      off somewhere.

  - name: TX_2519
    index: 0x19
    text: |-
      Heh heh! I can
      already read!
      "The Fairy Queen
      Who Keeps the
      Sea Clean"\stop
      That's my
      favorite story.

  - name: TX_251a
    index: 0x1a
    text: |-
      Reading is fun,
      even if I don't
      understand it!

  - name: TX_251b
    index: 0x1b
    text: |-
      \pos(2)Wahhh! My dad
      turned to stone!

  - name: TX_251c
    index: 0x1c
    text: |-
      Playing too much
      may have tired
      me out, but I do
      like being able
      to move!

  - name: TX_251d
    index: 0x1d
    text: |-
      OK! Faster this
      time! I'll throw
      it, so catch it,
      Dad!!!

  - name: TX_251e
    index: 0x1e
    text: |-
      Didn't I get
      better, Dad?
      We can practice
      together every
      day from now on!

- group: 0x26
  data:
  - name: TX_2600
    index: 0x00
    text: |-
      Lately folk have
      been vanishin'
      and turnin' to
      stone without
      warnin'. What's
      happenin'?

  - name: TX_2601
    index: 0x01
    text: |-
      Is it me, or is
      that tower
      gettin' bigger?

  - name: TX_2602
    index: 0x02
    text: |-
      Hahh... I get
      tired so easily
      nowadays. Am I
      gettin' old?

  - name: TX_2603
    index: 0x03
    text: |-
      That tower is
      surely bigger,
      and the town is
      all run amuck.
      My body's not
      feelin' right
      neither. I guess
      bad things do
      come in spades.

  - name: TX_2604
    index: 0x04
    text: |-
      My legs feel as
      heavy as stone.
      I can't move the
      way I'd like...
      I'm sick of all
      this bad stuff.

  - name: TX_2605
    index: 0x05
    text: |-
      My bones feel
      so light lately!
      I won't let any
      whippersnappers
      pass me by!

  - name: TX_2606
    index: 0x06
    text: |-
      I'm lookin' at
      this cave
      thinkin' there's
      treasure inside,
      but I can't get
      in with this
      rock here. If
      I could just
      blast it away...

- group: 0x27
  data:
  - name: TX_2700
    index: 0x00
    text: |-
      I am \col(3)Rafton\col(0).
      My dream is to
      make fine rafts
      that can sail
      the seas!

  - name: TX_2701
    index: 0x01
    text: |-
      If I only had
      rope that won't
      decay in water,
      I could make
      my raft. I just
      can't find any.\stop
      There's a fellow
      named \col(3)Cheval\col(0)
      on the east edge
      of town who is
      working on such
      rope, but I
      don't think he's
      done yet.

  - name: TX_2702
    index: 0x02
    text: |-
      Hey! That's it!

  - name: TX_2703
    index: 0x03
    text: |-
      With that \col(1)Cheval
      Rope\col(0), I could
      finish my raft!
      Let me have
      that \col(1)rope\col(0),
      please!
         \opt()OK \opt()Sorry

  - name: TX_2704
    index: 0x04
    text: |-
      I guess it can't
      be helped.

  - name: TX_2705
    index: 0x05
    text: |-
      Thank you!
      Tell you what,
      you can be the
      first to ride my
      raft when it's
      done. But you'll
      need a \col(1)chart\col(0) if
      you want to go
      out to sea.
      Going without
      a \col(1)chart\col(0) is an
      invitation to
      disaster.\n
    null_terminator: False

  - name: TX_2706
    index: 0x06
    text: |-
      I'll have the
      raft ready by
      the time you get
      a \col(1)chart\col(0).

  - name: TX_2707
    index: 0x07
    text: |-
      Hey! What took
      so long? My raft
      is ready! Come
      over here!

  - name: TX_2708
    index: 0x08
    text: |-
      Shove off from
      over there.
      The raft awaits!\n
    null_terminator: False

  - name: TX_2709
    index: 0x09
    text: |-
      Climb on top and
      press \col(0x84)\item(0x00)\col(0) to
      move!

  - name: TX_270a
    index: 0x0a
    text: |-
      I'll have a raft
      ready for you
      anytime you need
      a ride!
      \jump(TX_2709)
    null_terminator: False

  - name: TX_270b
    index: 0x0b
    text: |-
      I am \col(3)Cheval\col(0).\stop
      I am researching
      items for use in
      water.

  - name: TX_270c
    index: 0x0c
    text: |-
      \call(TX_270b)
      Before I die, I
      want to finish
      my work on
      flippers for
      swimming and
      rope that won't
      decay in water.
      I hope to aid
      all the people
      of the world
      by inventing
      such things!

  - name:
    - TX_270d
    - TX_270e
    - TX_270f
    index:
    - 0x0d
    - 0x0e
    - 0x0f
    text: |-
      \call(TX_270b)
      Somehow, seeing
      you gives me
      hope for my
      research.

  - name: TX_2710
    index: 0x10
    text: |-
      Hey! How goes
      the rafting? I'm
      thinking of
      entering a raft
      race, but I
      haven't been
      able to find a
      decent \col(1)oar\col(0) to
      race with.

  - name: TX_2711
    index: 0x11
    text: |-
      Give him the \col(0x84)\item(0x0a)
      \col(1)Magic Oar\col(0)?
        \opt()Yes \opt()No

  - name: TX_2712
    index: 0x12
    text: |-
      Whoa! That \col(0x84)\item(0x0a)
      \col(1)Oar\col(0)! It looks
      like a toy...
      But I like it!
      Thanks! In
      exchange...
      I know!
      How's this?
      Lazily playing
      guitar while
      gazing at the
      moon is so nice.

  - name: TX_2713
    index: 0x13
    text: |-
      I guess I have
      to row by hand.

  - name: TX_2714
    index: 0x14
    text: |-
      Hey! Are you
      workin' hard?

  - name: TX_2715
    index: 0x15
    text: |-
      Welcome! This is
      \col(3)Eyeglass Isle
      Library\col(0). Long
      ago, \col(1)Fairy
      Powder\col(0) was kept
      in this very
      library.\stop
      However, at some
      point in the
      past, someone
      took it away,
      and now none
      remains.

  - name: TX_2716
    index: 0x16
    text: |-
      Welcome! This is
      \col(3)Eyeglass Isle
      Library\col(0). Please
      feel free to
      browse our
      collection, but
      please be quiet
      for the benefit
      of others.

- group: 0x28
  data:
  - name: TX_2800
    index: 0x00
    text: |-
      \pos(1)\Link!!!
      You fool!

  - name: TX_2801
    index: 0x01
    text: |-
      \pos(2)As we guessed,
      saving \col(3)Nayru\col(0) was
      for naught!\stop
      \col(3)Ambi's\col(0) age is
      filled with
      cries of sorrow!
      \col(3)Veran\col(0) has
      extended the
      Dark Realm's
      reach, giving us
      what we seek--
      echoing cries of
      sorrow! Spread,
      darkness!
      Spread, sorrow!

  - name: TX_2802
    index: 0x02
    text: |-
      \pos(2)Oh ho ho ho!
      \Link,
      \Link!
      Don't forget us!

  - name: TX_2803
    index: 0x03
    text: |-
      \pos(2)Nice to see you
      after so long,
      \Link!
      We are \col(3)Twinrova\col(0),
      Gerudo witches!

  - name: TX_2804
    index: 0x04
    text: |-
      \pos(2)You were quite
      busy back in
      \col(3)Holodrum\col(0)!
      Eee hee hee hee!

  - name: TX_2805
    index: 0x05
    text: |-
      \pos(2)You seem pleased
      to have rescued
      \col(3)Nayru\col(0), but
      \col(3)Ambi's\col(0) age is
      already filled
      with cries of
      sorrow!

  - name: TX_2806
    index: 0x06
    text: |-
      \pos(2)By extending the
      reach of the
      Dark Realm,
      \col(3)Veran\col(0) has spread
      sorrow across
      the land. Soon,
      the Flame of
      Sorrow will
      ignite!
      Ho ho ho ho ho!

  - name: TX_2807
    index: 0x07
    text: |-
      \pos(2)Now only one
      flame remains...
      When the three
      flames burn in
      the darkness...
      The Evil King
      shall return!
      Oh ho ho ho ho!

  - name: TX_2808
    index: 0x08
    text: |-
      \pos(2)Eee hee hee hee!
      Since you seem
      so relaxed, I've
      come with news!
      The \col(3)Black Tower\col(0)
      has already
      reached the
      heavens!!!
      Oh ho ho ho ho!

  - name: TX_2809
    index: 0x09
    text: |-
      \pos(0)Eee hee hee hee!
      You're too late,
      \Link!
      The \col(3)Black Tower\col(0)
      has already
      reached the
      heavens!
      Oh ho ho ho ho!

  - name: TX_280a
    index: 0x0a
    text: |-
      \pos(0)Eee hee hee hee!
      Your might alone
      can't stop this!
      Oh ho ho ho ho!

  - name: TX_280b
    index: 0x0b
    text: |-
      \pos(3)Eee hee hee hee!
      \Link!
      Don't think it
      ends here!

  - name: TX_280c
    index: 0x0c
    text: |-
      \pos(3)Behold, \col(3)Veran\col(0)!
      The troubles you
      caused have
      filled the land
      with cries of
      sorrow! It has
      given birth to
      the Flame of
      Sorrow, which
      burns brightly!\stop
      When this flame
      brightens the
      darkness, our
      wish will be
      granted!
      Oh ho ho ho ho!

  - name:
    - TX_280d
    - TX_280e
    - TX_280f
    - TX_281b
    index:
    - 0x0d
    - 0x0e
    - 0x0f
    - 0x1b
    text: |-
      Eee hee hee hee!\stop
      \Link,
      \Link...
      Your struggles
      seem fruitless!
      Behold! Time has
      been disrupted
      in \col(3)Labrynna\col(4)!
      The people have
      lost all joy and
      are filled with
      sorrow!
      Oh ho ho ho ho!

  - name: TX_2810
    index: 0x10
    text: |-
      \pos(0)What a waste!
      You're too late!

  - name: TX_2811
    index: 0x11
    text: |-
      \pos(0)Give up,
      \Link!
      Don't you know
      all your efforts
      are for naught!

  - name: TX_2812
    index: 0x12
    text: |-
      \pos(0)We are the
      Gerudo witches,
      \col(3)Twinrova\col(0)!

  - name:
    - TX_2813
    - TX_2816
    index:
    - 0x13
    - 0x16
    text: |-
      \pos(0)This world is
      ours to
      manipulate! No
      matter how much
      you struggle,
      the Dark Rites
      will begin soon!

  - name:
    - TX_2814
    - TX_2818
    index:
    - 0x14
    - 0x18
    text: |-
      \pos(0)Remember our
      name as if it
      were sorrow!
      The name of
      \col(3)Twinrova\col(0)!
      Oh ho ho ho ho!

  - name: TX_2815
    index: 0x15
    text: |-
      \pos(0)Eee hee hee hee!
      \Link,
      \Link!
      Your struggles
      seem fruitless!

  - name: TX_2817
    index: 0x17
    text: |-
      \pos(0)And these lasses
      are mere bugs--
      bugs before a
      fire!
      Oh ho ho ho ho!

  - name: TX_2819
    index: 0x19
    text: |-
      \pos(0)The Evil King's
      revival begins!
      Oh ho ho ho ho!

  - name: TX_281a
    index: 0x1a
    text: |-
      \pos(0)Oh ho ho ho!\stop
      \col(3)Onox\col(0), General of
      Darkness!
      \col(3)Twinrova\col(0) will
      not let your
      death go to
      waste! Behold,
      \col(3)Onox\col(0)!\stop
      The troubles you
      caused now burn
      in the Flame of
      Destruction!
      When the Flames
      of Sorrow and
      Despair burst
      into flame,\stop
      we will offer up
      the sacrifice,
      and the dark
      rites of the
      Gerudo will be
      complete!\stop
      Then the Evil
      King shall
      return!

  - name: TX_281c
    index: 0x1c
    text: |-
      \pos(3)The Flames of
      Sorrow and
      Destruction burn
      brightly! Only
      the Flame of
      Despair remains!
      Eee hee hee hee!

  - name: TX_281d
    index: 0x1d
    text: |-
      \pos(3)When the three
      flames are lit,
      we will offer
      the sacrifice
      and complete the
      Dark Rites. Then
      the Evil King
      shall return!

  - name: TX_281e
    index: 0x1e
    text: |-
      \pos(3)Oh ho ho ho ho!

  - name: TX_281f
    index: 0x1f
    text: |-
      \pos(1)Oh ho ho ho!\stop
      Wandering about?
      Foolish
      Princess!

  - name: TX_2820
    index: 0x20
    text: |-
      \pos(1)Eee hee hee hee!
      We've found you,
      \col(3)Princess Zelda\col(0)!

  - name: TX_2821
    index: 0x21
    text: |-
      \pos(1)Hope for the
      people?
      We'll snuff it
      out!

  - name: TX_2822
    index: 0x22
    text: |-
      \pos(1)And you shall
      light the Flame
      of Despair!
      Eee hee hee hee!

  - name: TX_2823
    index: 0x23
    text: |-
      The sacrifice is
      in our grasp...

  - name: TX_2824
    index: 0x24
    text: |-
      When \col(3)Zelda\col(0), the
      people's hope,
      vanishes, this
      land will be
      stricken with
      despair.

  - name: TX_2825
    index: 0x25
    text: |-
      It is time!

  - name: TX_2826
    index: 0x26
    text: |-
      Ho ho ho ho ho!\stop
      The long-awaited
      Flame of Despair
      finally burns!

  - name: TX_2827
    index: 0x27
    text: |-
      The Flames of
      Sorrow and
      Destruction have
      been lit by
      \col(3)Veran\col(0) and \col(3)Knox\col(0)!
      Now the loss of
      \col(3)Zelda\col(0) fills all
      with despair!\stop
      Oh, Flames of
      Sorrow, Despair
      and Destruction,
      burn with the
      dark powers our
      disasters have
      wrought!

  - name: TX_2828
    index: 0x28
    text: |-
      Eee hee hee hee!
      He comes...
      Come now, to the
      three flames!
      Come from the
      darkest depths!\stop
      Come, \col(3)Ganon\col(0),
      Evil King!!!

  - name: TX_2829
    index: 0x29
    text: |-
      \pos(3)Eee hee hee hee!
      The time comes!
      Already the
      Flame of
      Sorrow is lit!

- group: 0x29
  data:

  - name: TX_2900
    index: 0x00
    text: >-
      Grandma says I should wait here
      before she gets back.

      She's going to see the Princess!

  - name: TX_2901
    index: 0x01
    text: >-
      Grandma sometimes has to go home to rest.

      She's sick all the time.

      I just wish I could bring some medicine to her!

  - name: TX_2902
    index: 0x02
    text: >-
      Grandma never lets me venture down south of the \col(1)cliffs\col(0).
      What's there that she wouldn't want me to see?

      Maybe it's more fun east of town!

  - name: TX_2903
    index: 0x03
    text: >-
      Waah! Too many monsters!!
      Grandma, save me!

      It went \col(1)west\col(0) so
      I ran this way!

  - name: TX_2904
    index: 0x04
    text: >-
      Grandma told me you saved the day!

      Thank you!

  - name:
    - TX_2905
    - TX_2906
    - TX_2907
    - TX_2908
    - TX_2909
    - TX_290a
    - TX_290b
    - TX_290c
    - TX_290d
    - TX_290e
    - TX_290f
    index:
    - 0x05
    - 0x06
    - 0x07
    - 0x08
    - 0x09
    - 0x0a
    - 0x0b
    - 0x0c
    - 0x0d
    - 0x0e
    - 0x0f
    text: |-
      Ask \col(3)Troy\col(0) about
      animals and
      monsters!
      ...Not that I
      don't know...
      Seriously!

  - name: TX_2910
    index: 0x10
    text: |-
      Deep in the
      woods are
      magical \col(1)seeds\col(0)
      and an owl
      statue. When the
      \col(1)seeds\col(0) are placed
      on the statue,
      it moves! The
      first time I saw
      it, it startled
      me, but I now
      find it amusing!
      But I'm not
      supposed to go
      into the woods,
      so don't tell
      the adults!

  - name: TX_2911
    index: 0x11
    text: |-
      Shut up! It's no
      good if you get
      scared!

- group: 0x2a
  data:
  - name: TX_2a00
    index: 0x00
    text: >-
      Room is secure!!\stop
      Oh, hi \Link!

      Glad to see you here!
      Hey, did you want to spar later?

      Nayru told me to keep busy by helping keep watch.
      But it looks like I don't have to stay!

  - name: TX_2a01
    index: 0x01
    text: >-
      I've been southwest to the Revinna Quarry,
      but I think the Daichi Plains are more my style!

      So many monsters to fight!\stop

      \jump(TX_2a07)
    null_terminator: False

  - name: TX_2a02
    index: 0x02
    text: >-
      I'm trying to find a book on sparring!

      I asked the librarian,
      but he said that book was
      checked out ages ago...

      I hope to take that fiend by my blade and
      ram him through!\stop

      \jump(TX_2a07)
    null_terminator: False

  - name: TX_2a03
    index: 0x03
    text: >-
      This fiend is undefeatable!

      I tried swiping my sword against him,
      but he just ignored me!

      UNBELIEVABLE!\stop
      
      \jump(TX_2a07)
    null_terminator: False

  - name: TX_2a04
    index: 0x04
    text: >-
      I tried to find poor Zelda in here,
      but nothing!

      Some of the villagers said the \col(1)beast\col(0)
      actually went across the river
      here, but all I found was
      a \col(1)dead tree\col(0).

      Where could they be?

  - name: TX_2a05
    index: 0x05
    text: >-
      \Link, you did it!\stop
      I think \col(3)Nayru\col(0) and I
      will need to take another
      vacation after the party is over.

  - name: TX_2a06
    index: 0x06
    text: |-
      \col(3)NAYRU\col(0)!!!

  - name:
    - TX_2a07
    - TX_2a08
    - TX_2a09
    index:
    - 0x07
    - 0x08
    - 0x09
    text: |-
      Also, \Link, did you notice that some enemies
      drop \col(1)swords\col(0) or \col(1)shields\col(0) when defeated?

      I noticed that although they
      are \col(1)stronger\col(0), but they \col(3)do not last\col(0)!

  - name: TX_2a0a
    index: 0x0a
    text: |-
      \pos(2)Well, if it
      isn't \Link!

  - name: TX_2a0b
    index: 0x0b
    text: |-
      Dawdling about,
      as usual. What
      are you doing?
      Huh? You need an
      \col(1)Island Chart\col(0)?
      I've heard that
      weird guy has
      \col(1)sea charts\col(0) to
      the secret isle.
      Do what you
      want! I'm too
      busy trying to
      save \col(3)Nayru\col(0) to
      help you!
      See ya!

  - name: TX_2a0c
    index: 0x0c
    text: |-
      \col(3)Nayru\col(0)!!!

  - name: TX_2a0d
    index: 0x0d
    text: |-
      Is it you? Is
      it really \col(3)Nayru\col(0)?

  - name: TX_2a0e
    index: 0x0e
    text: |-
      Sorry, \Link.
      I was the one
      running around
      while you did
      the saving...\stop
      But know this:
      I'll be the one
      to stop \col(3)Veran\col(0)!!!
      I won't leave
      the people of
      the past to her
      evil deeds!
      Forgetting about
      \col(3)Veran\col(0) now would
      be foolish. If
      we do, she'll
      just come for
      \col(3)Nayru\col(0) again!

  - name: TX_2a0f
    index: 0x0f
    text: |-
      What was that???\stop
      I can't take
      this! \Link!
      I'm going back
      to \col(3)Ambi's\col(0) age
      first! May fate
      bring us back
      together! Bye!

  - name: TX_2a10
    index: 0x10
    text: |-
      What was that?
      Those hags...
      What are they
      trying to do?\stop
      I can't take
      this! \Link!
      I'm going back
      to \col(3)Ambi's\col(0) age
      first!
      May fate bring
      us back
      together! Bye!

  - name: TX_2a11
    index: 0x11
    text: |-
      \pos(0)You really beat
      \col(3)Veran\col(0), didn't
      you? Nice work,
      \Link! You're
      amazing!
      ...Huh? \col(3)Queen
      Ambi\col(0)? She saw
      you get shut in
      and turned and
      ran.

  - name: TX_2a12
    index: 0x12
    text: |-
      \pos(2)What? Are you
      gonna take on
      \col(3)Ralph\col(0)?

  - name: TX_2a13
    index: 0x13
    text: |-
      Don't startle me
      like that! I
      thought \col(3)Veran's\col(0)
      tricks had
      gotten you!

  - name: TX_2a14
    index: 0x14
    text: |-
      \Link! My
      respect for you
      has grown. I
      thought it was
      over when you
      got locked in
      the tower.
      I never thought
      you'd outdo me!

  - name: TX_2a15
    index: 0x15
    text: |-
      And you, \col(3)Queen
      Ambi\col(0)! \col(3)Veran\col(0) is
      gone, so now
      you can be my
      great, great,
      great, great,
      great, great...\stop
      grandmother!
      A queen! I'm
      so proud!

  - name: TX_2a16
    index: 0x16
    text: |-
      \Link! Don't
      startle me!
      You also heard
      the guard on the
      palace was down
      and came to save
      \col(3)Nayru\col(0)?
      If anyone is
      gonna save her,
      it's me! I won't
      let you beat me
      to it!

  - name: TX_2a17
    index: 0x17
    text: |-
      But it's no good
      entering from
      the front door.\stop
      I know! There
      should be a
      hidden entrance
      in the palace
      garden! I'll
      sneak in through
      there!

  - name: TX_2a18
    index: 0x18
    text: |-
      What? "Why do I
      know about the
      hidden passage
      on my first
      trip here?"\stop
      Never mind!!!
      I'm coming,
      \col(3)Nayru\col(0)!!!

  - name: TX_2a19
    index: 0x19
    text: |-
      So, \Link,
      you finally made
      it! I came to
      destroy \col(3)Veran\col(0)!
      \col(3)Veran\col(0) has taken
      control of \col(3)Queen
      Ambi\col(0), right?
      Then to beat
      \col(3)Veran\col(0)...
      I must defeat...
      \col(3)Queen Ambi\col(0)...
      Umm... Well...
      \col(3)Queen Ambi\col(0)!
      \col(3)Veran\col(0)! I'll
      destroy the both
      of you!
      Then the people
      of this age, and
      of our age, will
      have peace...
      ...But what...
      will happen to
      me..?\stop
      Umm...
      \Link...
      Don't forget me.
      I mean, I think
      of you...as a
      friend...
      OK! I'm going!
      \col(3)Ralph\col(0) can do it!
      Goodbye,
      \Link!

  - name: TX_2a1a
    index: 0x1a
    text: |-
      Hey, \Link!
      What are you
      doing here? I
      came to find an
      old hermit who's
      studying \col(1)tunes\col(0)
      on this
      mountain. I
      don't know where
      he is, but I bet
      he can offer a
      clue that will
      help save \col(3)Nayru\col(0).\stop
      I'll find him!
      Bye!

  - name: TX_2a1b
    index: 0x1b
    text: |-
      You trickster!\stop
      Fine! If I slay
      you, I vanish!
      Maybe it is
      terrifying...
      But if I must, I
      must. To do
      nothing and live
      just isn't me.
      Then it means
      nothing! I will
      destroy you! To
      protect the
      people of this
      age, and to
      protect \col(3)Nayru\col(0)!!!

  - name: TX_2a1c
    index: 0x1c
    text: |-
      That voice...
      \Link...
      I...couldn't do
      it... Heh heh.
      Don't I look
      the fool...\n
    null_terminator: False

  - name: TX_2a1d
    index: 0x1d
    text: |-
      \col(3)Na-Nayru\col(0)...

  - name: TX_2a1e
    index: 0x1e
    text: |-
      The \col(3)Maku Tree\col(0)?
      This is more
      of \col(3)Veran's\col(0) work!\stop
      \Link! You made
      it! \col(3)Veran\col(0) just
      leapt through
      this \col(3)Time
      Portal\col(0)! If we go
      back in time, we
      should be able
      to save \col(3)Nayru\col(0)
      and the \col(3)Maku
      Tree\col(0)! I'm
      coming, \col(3)Nayru\col(0)!

  - name: TX_2a1f
    index: 0x1f
    text: |-
      \pos(0)\Link! You
      did it! Even I
      thought it was
      over this time,
      but \col(3)Nayru\col(0) was
      there. She can't
      always remain
      helpless!
      I'm going to
      train so I'll be
      able to protect
      \col(3)Nayru\col(0) on my own!

  - name: TX_2a20
    index: 0x20
    text: |-
      Hey, \Link!\stop
      Are you looking
      for something,
      or what? Huh?
      \col(3)Cheval Rope\col(0)?
      I know that
      name. Yeah! I've
      seen a grave in
      our own time
      that has that
      name on it.\stop
      But I don't have
      time to chat!
      I'm busy!
      See ya!

  - name: TX_2a21
    index: 0x21
    text: |-
      Hey, \Link!
      How are you?
      I'm training
      everyday! I have
      to be strong
      enough to guard
      \col(3)Nayru\col(0) on my own!
      My skills have
      really improved!
      Shall we
      practice next
      time? Since
      you're here, we
      should go hear
      \col(3)Nayru\col(0) sing!

  - name: TX_2a22
    index: 0x22
    text: |-
      Don't worry,
      \col(3)Nayru\col(0)! I'm here.
      I'll chase away
      any beast that
      comes near you!
      Sorry, \Link,
      but I doubt
      we'll need you.

  - name: TX_2a23
    index: 0x23
    text: |-
      Leave this to me
      and my granny!
      You go take care
      of \col(3)Twinrova\col(0)!

- group: 0x2c
  data:
  - name: TX_2c00
    index: 0x00
    text: |-
      \pos(2)I am \col(3)Mooskey\col(0). My great great grandfather researched time. After many years of researching his studies, I'm one step away from recreating the \col(1)tune\col(0) he mastered ages ago.
      The \col(1)tune\col(0) lets one move forward in time, but it seems I've hit a roadblock.\n
    null_terminator: False

  - name: TX_2c01
    index: 0x01
    text: |-
      \pos(2)"Echoes produce
      waves..."
      What could it
      mean?

  - name: TX_2c02
    index: 0x02
    text: |-
      \pos(2)That's the
      \col(1)Tune of Echoes\col(0)!
      That's the tone
      my research
      lacked! It has
      answered my
      remaining
      questions! Now
      I can finish
      my tune!

  - name: TX_2c03
    index: 0x03
    text: |-
      Ye of many
      tunes, I grant
      you a new \col(1)tune\col(0)!
      Time flows on
      when you play
      the \col(1)Tune of
      Currents\col(0)! When
      you play this
      \col(1)tune\col(0), you'll
      immediately
      drift back to
      your own time!\stop
      If you are in a
      place from which
      you cannot reach
      your own time,
      you'll return to
      the past.

  - name: TX_2c04
    index: 0x04
    text: |-
      \pos(2)The currents of
      time run deep...

  - name: TX_2c05
    index: 0x05
    text: |-
      \pos(2)My hearing isn't
      what it used to
      be...

  - name: TX_2c06
    index: 0x06
    text: |-
      Hoh hoh! I am
      \col(3)Troy\col(0).\stop
      I am a dedicated
      and hardworking
      biologist. I've
      come to \col(3)Rolling
      Ridge\col(0) to study
      the Gorons and
      their games. Did
      you need me?
        \opt()Yes \opt()No

  - name:
    - TX_2c07
    - TX_2c0f
    index:
    - 0x07
    - 0x0f
    text: |-
      You don't seem
      very promising.

  - name: TX_2c08
    index: 0x08
    text: |-
      Interesting...
      My student is
      studying hard in
      \col(3)Holodrum\col(0). Thank
      you for updating
      me. Let me offer
      you something
      in return...
      But not for
      free! If you
      score high
      enough in that
      game, you can
      have a gift, OK?
        \opt()OK \opt()No thanks

  - name: TX_2c09
    index: 0x09
    text: |-
      Are you already
      senile?

  - name: TX_2c0a
    index: 0x0a
    text: |-
      Target Carts is
      a game in which
      you shoot your
      \col(1)Seed Shooter\col(0)
      at targets while
      riding in a
      cart. You can
      have my gift if
      you hit every
      target. Got it?
        \opt()Yes \opt()No

  - name: TX_2c0b
    index: 0x0b
    text: |-
      Come talk to me
      after you've hit
      all the targets.
      If you don't
      talk to me right
      away, I might
      forget.

  - name: TX_2c0c
    index: 0x0c
    text: |-
      Oh! Well done!
      You can now have
      your reward!

  - name: TX_2c0d
    index: 0x0d
    text: |-
      I'll teach you
      the \col(1)secret\col(0) to
      using \col(1)Bombchu\col(0) in
      \col(3)Holodrum\col(0), too.\stop
      \secret1\stop
      Come back if you
      forget the
      \col(1)secret\col(0).

  - name: TX_2c0e
    index: 0x0e
    text: |-
      Are you ready
      to play?
        \opt()Yes \opt()No

  - name: TX_2c10
    index: 0x10
    text: |-
      Giving up?

  - name: TX_2c11
    index: 0x11
    text: |-
      Hoh hoh! I am
      \col(3)Troy\col(0)! In my
      younger days, I
      traveled the
      world and saw
      many animals.
      Even at my age,
      I'm quite
      dedicated! You
      show promise if
      you've come to
      hear me speak.\n
    null_terminator: False

  - name: TX_2c12
    index: 0x12
    text: |-
      Just between us,
      I have seen
      \call(0xff)

  - name: TX_2c13
    index: 0x13
    text: |-
      an animal called
      \col(3)Ricky\col(0) that can
      jump small holes
      and cliffs by
      just moving
      toward them!

  - name: TX_2c14
    index: 0x14
    text: |-
      an animal called
      \col(3)Ricky\col(0) that can
      unleash powerful
      punches that
      sometimes cause
      whirlwinds!

  - name: TX_2c15
    index: 0x15
    text: |-
      an animal called
      \col(3)Dimitri\col(0) that
      eats many
      things--even
      monsters!

  - name: TX_2c16
    index: 0x16
    text: |-
      an animal called
      \col(3)Dimitri\col(0) that
      swims very well.
      It swims up
      even mighty
      currents with
      great ease!

  - name: TX_2c17
    index: 0x17
    text: |-
      an animal called
      \col(3)Dimitri\col(0) that can
      be lifted,
      carried and even
      thrown about!

  - name: TX_2c18
    index: 0x18
    text: |-
      an animal called
      \col(3)Moosh\col(0) that can
      hover in the air
      for short spans
      of time!

  - name: TX_2c19
    index: 0x19
    text: |-
      an animal called
      \col(3)Moosh\col(0) that can
      save up energy
      as it floats and
      then pound the
      ground with
      great force!

  - name:
    - TX_2c1a
    - TX_2c1b
    index:
    - 0x1a
    - 0x1b
    text: |-
      certain kinds of
      \col(3)Deku Scrubs\col(0) that
      actually engage
      in business!
      They're called
      \col(3)Business Scrubs\col(0)!

  - name: TX_2c1c
    index: 0x1c
    text: |-
      a monster called
      a \col(3)Whisp\col(0) that
      jinxes you when
      you touch it.
      You can't take
      your \col(1)sword\col(0) out
      when it happens!
      How frightful!

  - name:
    - TX_2c1d
    - TX_2c1e
    - TX_2c1f
    - TX_2c20
    - TX_2c21
    - TX_2c22
    index:
    - 0x1d
    - 0x1e
    - 0x1f
    - 0x20
    - 0x21
    - 0x22
    text: |-
      a terrifying
      monster that
      eats \col(1)shields\col(0)!
      How frightful!

- group: 0x2d
  data:
  - name: TX_2d00
    index: 0x00
    text: |-
      Oww... I was
      injured by a
      rock that shot
      out in the
      eruption...
      If you want the
      \col(1)Tuni Nut\col(0), go
      see my brother
      across town.

  - name: TX_2d01
    index: 0x01
    text: |-
      We must do
      something about
      the eruptions!

  - name: TX_2d02
    index: 0x02
    text: |-
      The closer the
      \col(3)Black Tower\col(0) gets
      to completion,
      the stranger
      this city gets.
      When the \col(1)Tuni
      Nut\col(0) broke, the
      city fell out of
      balance, and the
      volcano started
      erupting.\n
    null_terminator: False

  - name: TX_2d03
    index: 0x03
    text: |-
      I want to take
      the \col(1)Tuni Nut\col(0) to
      \col(3)Patch's\col(0) place...\stop
      But I can't
      leave the city
      alone. This is
      \col(3)Symmetry City\col(0)!
      Left and right
      have to be in
      perfect balance!\stop
      My brother is
      too hurt to
      move, so I can't
      move either.
      If one brother
      goes somewhere,
      the balance
      between left
      and right will
      be lost. But
      someone has to
      go...

  - name: TX_2d04
    index: 0x04
    text: |-
      Hey! You can
      ignore the rules
      and leave the
      city! Can you
      take the \col(1)Tuni
      Nut\col(0) to \col(3)Patch\col(0)?
        \opt()Yes \opt()No

  - name: TX_2d05
    index: 0x05
    text: |-
      Really? Thank
      you! I'll leave
      this to you!\n
    null_terminator: False

  - name: TX_2d06
    index: 0x06
    text: |-
      \col(3)Patch\col(0) lives at
      the top of
      \col(3)Restoration Wall\col(0)
      to the south!
      After you get
      the \col(1)Tuni Nut\col(0)
      fixed, take it
      to the house in
      the middle of
      the city and
      place it on the
      pedestal.

  - name: TX_2d07
    index: 0x07
    text: |-
      I just thought
      I'd ask...

  - name: TX_2d08
    index: 0x08
    text: |-
      \col(3)Patch\col(0) lives at
      the top of
      \col(3)Restoration
      Wall\col(0).
      Thanks a lot!

  - name: TX_2d09
    index: 0x09
    text: |-
      Hey! The \col(1)Tuni
      Nut\col(0) is fixed!
      Go place it on
      the pedestal in
      the Middle
      House!

  - name: TX_2d0a
    index: 0x0a
    text: |-
      Balance has
      returned to the
      city! Thank you!

  - name: TX_2d0b
    index: 0x0b
    text: |-
      Dang! If only
      \col(3)Patch\col(0) would come
      at times like
      this.

  - name:
    - TX_2d0c
    - TX_2d0d
    - TX_2d0e
    - TX_2d0f
    index:
    - 0x0c
    - 0x0d
    - 0x0e
    - 0x0f
    text: |-
      What a mess...
      Do I have to
      be smaller?

  - name: TX_2d10
    index: 0x10
    text: |-
      Help! Help!
      The \col(1)Tuni Nut\col(0) is
      broken! What?
      Will you listen
      to my problem?
        \opt()Yes \opt()No

  - name: TX_2d11
    index: 0x11
    text: |-
      The closer the
      \col(3)Black Tower\col(0) gets
      to completion,
      the stranger
      this city gets.
      When the \col(1)Tuni
      Nut\col(0) broke, the
      city fell out of
      balance, and the
      volcano started
      erupting. The
      \col(1)Tuni Nut\col(0) is the
      city's symbol.
      We dutifully
      worshipped this
      nut. The rules
      of \col(3)Symmetry City\col(0)
      require that
      left and right
      be in perfect
      balance! But the
      \col(1)Tuni Nut\col(0) at the
      center of the
      city is broken!
      \col(3)Symmetry City\col(0) is
      all out of
      balance. If we
      don't get the
      \col(1)Tuni Nut\col(0) fixed
      and put back,
      \col(3)Symmetry City\col(0)
      will be
      destroyed by
      the eruptions.
      Do you
      understand?
        \opt()Yes \opt()No

  - name: TX_2d12
    index: 0x12
    text: |-
      I've given the
      broken \col(1)Tuni Nut\col(0)
      to my husband,
      but he can't
      climb
      \col(3)Restoration
      Wall\col(0).

  - name: TX_2d13
    index: 0x13
    text: |-
      What? Why not?

  - name: TX_2d14
    index: 0x14
    text: |-
      Weren't you
      listening? Then
      I'll explain it
      again!
      \jump(TX_2d11)
    null_terminator: False

  - name: TX_2d15
    index: 0x15
    text: |-
      A guru named
      \col(3)Patch\col(0) lives at
      the top of
      \col(3)Restoration
      Wall\col(0). I think he
      can fix the
      broken \col(1)Tuni Nut\col(0),
      but I could
      never climb that
      wall.

  - name: TX_2d16
    index: 0x16
    text: |-
      That's the \col(1)Tuni
      Nut\col(0), but it's
      broken right
      now. Take it to
      \col(3)Patch\col(0), the
      repair guru.

  - name: TX_2d17
    index: 0x17
    text: |-
      The \col(1)Tuni Nut\col(0) is
      fixed! Can you
      place it on that
      pedestal?

  - name: TX_2d18
    index: 0x18
    text: |-
      Now the volcano
      should calm
      down! I have to
      get that cave
      cleaned!

  - name:
    - TX_2d19
    - TX_2d1a
    - TX_2d1b
    - TX_2d1c
    - TX_2d1d
    - TX_2d1e
    - TX_2d1f
    index:
    - 0x19
    - 0x1a
    - 0x1b
    - 0x1c
    - 0x1d
    - 0x1e
    - 0x1f
    text: |-
      Welcome to
      \col(3)Symmetry City\col(0)!
      Perfect balance
      is the law of
      the land!

  - name: TX_2d20
    index: 0x20
    text: |-
      Sometimes I hear
      music flowing
      down from the
      mountaintop,
      but I wonder
      why.

  - name: TX_2d21
    index: 0x21
    text: |-
      Huh? The cave
      entrance? It was
      covered by lava
      from the volcano
      long ago! Maybe
      if the volcano
      calms down, you
      may be able to
      get in.

  - name: TX_2d22
    index: 0x22
    text: |-
      Having something
      in the middle
      feels so right!

  - name: TX_2d23
    index: 0x23
    text: |-
      What a mess...
      Do I have to be
      bigger?

  - name: TX_2d24
    index: 0x24
    text: |-
      Welcome to
      \col(3)Symmetry City\col(0)!
      Did you need
      something?
        \opt()Yes \opt()No

  - name: TX_2d25
    index: 0x25
    text: |-
      It's nice to not
      need anything,
      isn't it?

  - name: TX_2d26
    index: 0x26
    text: |-
      Amazing! I
      didn't know that
      others knew the
      strengths of
      \col(3)symmetry\col(0)!
      Thank you for
      telling me! In
      thanks, I'll
      increase the
      number of \col(1)rings\col(0)
      you can carry!

  - name: TX_2d27
    index: 0x27
    text: |-
      So, what do you
      really want?

  - name: TX_2d28
    index: 0x28
    text: |-
      Let me see your
      \col(1)Ring Box\col(0) for a
      second!
      ................
      A nut for a
      jar of tuna!

  - name: TX_2d29
    index: 0x29
    text: |-
      Here you go!

  - name: TX_2d2a
    index: 0x2a
    text: |-
      Hey! You don't
      have a \col(1)Ring Box\col(0).
      OK, you can have
      my \col(1)box\col(0)!

  - name: TX_2d2b
    index: 0x2b
    text: |-
      I'll teach you
      the \col(1)secret\col(0) for
      carrying many
      \col(1)rings\col(0) in
      \col(3)Holodrum\col(0), too!\stop
      \secret1\stop
      Come back if you
      forget it.

  - name: TX_2d2c
    index: 0x2c
    text: |-
      This volcano had
      a secret cave in
      it, but that's a
      secret.

  - name: TX_2d2d
    index: 0x2d
    text: |-
      Having something
      in the middle
      feels so right!

- group: 0x2e
  data:
  - name: TX_2e00
    index: 0x00
    text: |-
      Hit targets, win
      fabulous prizes!
      350 pts & up:
              Ring
      250 - 349 pts:
        Gasha Seed
      150 - 249 pts:
         30 Rupees
      50 - 149 pts:
           1 Heart
      Under 50 pts...
           Nothing\stop
      Good luck!

  - name: TX_2e01
    index: 0x01
    text: |-
      You need 2 gifts to beat ganon and start the party.\stop
      You need 8 slates in order to beat the Temple of The Tokay boss.

  - name: TX_2e02
    index: 0x02
    text: |-
      \up Town of Kinomi
      \right Daichi Plain

  - name: TX_2e03
    index: 0x03
    text: |-
      Bring the \col(03)four\col(00) seasons together
      and gather the \col(01)seeds\col(00) to continue your quest.

  - name: TX_2e04
    index: 0x04
    text: |-
      \left Town of
          Kinomi

  - name: TX_2e05
    index: 0x05
    text: |-
      \left Portal to Temple of Seasons

  - name: TX_2e06
    index: 0x06
    text: |-
      \right Return to
            Kinomi

  - name: TX_2e07
    index: 0x07
    text: |-
      \up Ruptured Mine

  - name: TX_2e08
    index: 0x08
    text: |-
      Warning!
      Danger ahead!!
      \up Ruptured Mine

      \down Springwater
            Crag

  - name: TX_2e09
    index: 0x09
    text: |-
      \right Deeper Woods

      Six spirits guard this wood.
      Watch your back.

  - name: TX_2e0a
    index: 0x0a
    text: |-
      \up Daichi Plain

      \left To Hedge
        Maze
      Warning! Peril!
      If snowy, a sword will help!

  - name: TX_2e0b
    index: 0x0b
    text: |-
      \left Lost Labyrinth Entrance

  - name: TX_2e0c
    index: 0x0c
    text: |-
      \up Danger ahead!

      \right Town of
          Kinomi

      \down Jiku Cliffs

  - name: TX_2e0d
    index: 0x0d
    text: |-
      \left Forever Falls

  - name: TX_2e0e
    index: 0x0e
    text: |-
      \right Spirit's
          Grotto

  - name: TX_2e0f
    index: 0x0f
    text: |-
      \down Revinna's
          Quarry

      Beware of
          monsters!

  - name: TX_2e10
    index: 0x10
    text: |-
      \down Tokay Desert

      Beware of
          quicksand!

  - name: TX_2e11
    index: 0x11
    text: |-
      Slingshots:
      Sold at
        Kinomi Store!

  - name: TX_2e12
    index: 0x12
    text: |-
      Do not throw
      anything into
      the water.

  - name: TX_2e13
    index: 0x13
    text: |-
      \up Syrup's House

      If you don't have a key, don't come in!

      Seeking:
          Mushrooms.

      \right Jiku Cliffs

  - name: TX_2e14
    index: 0x14
    text: |-
      \left
      Shrine of Summer\stop
      A floor to each season. Even your \col(1)rod\col(0) will need to visit that season to be called on a \col(1)stump\col(0)!

  - name: TX_2e15
    index: 0x15
    text: |-
      \left
      Shrine of Autumn\stop
      One switch does not take effect until the season to follow!

  - name: TX_2e16
    index: 0x16
    text: |-
      \left
      Shrine of Winter\stop
      The north winter stump has been cursed with a magical barrier!

  - name: TX_2e17
    index: 0x17
    text: |-
      \left
      Shrine of Spring\stop
      Your \col(1)gales\col(0) can travel to any \col(1)tree\col(0) you've encountered.

  - name: TX_2e18
    index: 0x18
    text: |-
      \right Come right in!

      \left Bomb Fairy
          Spring

  - name: TX_2e19
    index: 0x19
    text: |-
      \right Return to
         Daichi Plain\stop
      Warning!!
         No return!

  - name: TX_2e1a
    index: 0x1a
    text: |-
      Warning! Old Labyrinth Entrance!
      Sealed for safety!

  - name: TX_2e1b
    index: 0x1b
    text: >-
      \col(3)Gifts of Kinomi\col(0)

      A hack by \col(1)ZerotoKoops\col(0).\stop
      Special thanks for \col(1)Stewmat\col(0)
      for helping me finish this hack!
      It has been in development for many years,
      and I'm so happy it's finally released for
      our growing community to enjoy.\stop
      Additionally thanks to \col(1)Kaip\col(0) for
      assistance on graphics when \col(1)Gamma\col(0) and I were new to hacking.\stop
      Original idea for the hack conceived by \col(1)ZerotoKoops\col(0) and \col(1)Gamma\col(0).\stop
      
      Finally, thank you all for playing my hack!
      If you have any feedback, please share it on the Wind Fishes' Breeze discord!
      And if this has made you interested in making your own romhack,
      please join the discord if you haven't already!

      Go outside to enjoy the party!
      
      Enter the villa to save and reset the game. \heart

  - name: TX_2e1c
    index: 0x1c
    text: |-
      Goron Cave\stop
      It's a secret to everybody!

  - name: TX_2e1d
    index: 0x1d
    text: |-
      Off to Holodrum!
       Bipin & Blossom

  - name: TX_2e1e
    index: 0x1e
    text: |-
      \left Lynna Village

  - name: TX_2e1f
    index: 0x1f
    text: |-
      Welcome to
      Zora Village!

  - name: TX_2e20
    index: 0x20
    text: |-
      I shall entrust
      my invention
      only to one with
      both might and
      light feet.
        Cheval

  - name: TX_2e21
    index: 0x21
    text: |-
      Warning!!!\stop
      Raj the guard lacks the fortitude to withstand a \col(1)watchful gaze\col(0).\stop
      \col(1)Do not attack\col(0) him for your safety!

  - name: TX_2e22
    index: 0x22
    text: |-
      A \col(1)red companion\col(0) will pave your path forward.

  - name: TX_2e23
    index: 0x23
    text: >-
      Although your path starts here,
      in \col(1)darkness\col(0) you shall seek the right way.

  - name: TX_2e24
    index: 0x24
    text: >-
      A \col(1)red companion\col(0) lies in this room.\stop

      It can do many fantastic things!\stop

      Toss it or drop it,
      and it will reform as long as you are not underneath it!\stop

      Toss it on buttons, push it into holes, and see what happens!
  - name: TX_2e25
    index: 0x25
    text: |- 
      I hope you are enjoying the randomizer so far. Please report any 
      bugs at the Wind Fishes' Breeze discord server if you saw any.

- group: 0x2f
  data:
  - name: TX_2f00
    index: 0x00
    text: |-
      One with no
      wings is no
      match for me!

  - name: TX_2f01
    index: 0x01
    text: |-
      \pos(1)My mighty sword
      and mighty
      shield shall
      crush you!

  - name: TX_2f02
    index: 0x02
    text: |-
      NO!\stop
      My mighty sword
      is broken...
      You'll pay for
      this!!!

  - name: TX_2f03
    index: 0x03
    text: |-
      \pos(2)As long as I'm
      underground,
      your attacks
      don't scare me!

  - name: TX_2f04
    index: 0x04
    text: |-
      \pos(2)So, \Link!\stop
      You've finally
      reached the
      altar! Bother!
      We can't have
      you scampering
      about up here!
      So we've dragged
      you in here.

  - name:
    - TX_2f05
    - TX_2f06
    - TX_2f07
    - TX_2f08
    index:
    - 0x05
    - 0x06
    - 0x07
    - 0x08
    text: |-
      \pos(2)The Flames of
      Sorrow,
      Destruction and
      Despair burn
      brightly. The
      return of the
      Evil King \col(3)Ganon\col(0)
      approaches. The
      Holy Sacrifice,
      \col(3)Zelda\col(0), is all
      that remains!
      When we call
      \col(3)Ganon's\col(0) spirit
      into the vessel,
      it will be done!\stop
      You can't stop
      us! Prepare to
      meet your doom!

  - name: TX_2f09
    index: 0x09
    text: |-
      \pos(2)Oh hoh hoh!
      I did not think
      you would get
      so far...

  - name: TX_2f0a
    index: 0x0a
    text: |-
      \pos(2)But I shall not
      fall like \col(3)Gleeok\col(0)
      and \col(3)Smog\col(0)! See
      my true power!

  - name: TX_2f0b
    index: 0x0b
    text: |-
      \pos(2)We'll sacrifice
      you so the Evil
      King can return!

  - name: TX_2f0c
    index: 0x0c
    text: |-
      \pos(2)Hoh hoh! \col(3)Ganon's\col(0)
      return was but
      a step away!
      \Link!
      It is not over!
      Our rites have
      failed, but by
      sacrificing this
      body, \col(3)Ganon\col(0)
      will return!

  - name: TX_2f0d
    index: 0x0d
    text: |-
      \pos(2)Gwoh hoh hoh!
      Gwah hah hah...
      Destroy...all...
      Kill ALL!!!

  - name: TX_2f0e
    index: 0x0e
    text: |-
      \pos(2)Gwoh hoh hoh!
      I am the Evil
      King, \col(3)Ganon\col(0)...

  - name: TX_2f0f
    index: 0x0f
    text: |-
      \pos(2)Gwoh hoh hoh!

  - name:
    - TX_2f10
    - TX_2f11
    - TX_2f12
    index:
    - 0x10
    - 0x11
    - 0x12
    text: |-
      \pos(2)I am \col(3)Vire\col(0),
      \col(3)Twinrova's\col(0) loyal
      henchman! I
      heard someone
      was trying to
      stop \col(3)Twinrova\col(0),
      so I came here.
      But it's just some kid!\stop
      Fine! I can
      handle you!

  - name: TX_2f13
    index: 0x13
    text: |-
      \pos(2)I'm amazed
      you've come so
      far. I thought
      you a harmless
      turtle, but I
      miscalculated.
      ...At any rate,
      I'll finish this
      soon!!!

  - name: TX_2f14
    index: 0x14
    text: |-
      \slow()OUCH! Pesky kid!
      Take this!

  - name: TX_2f15
    index: 0x15
    text: |-
      \slow()Bully! That's
      it! I'm serious!

  - name: TX_2f16
    index: 0x16
    text: |-
      \slow()Fine! Goodbye!

  - name: TX_2f17
    index: 0x17
    text: |-
      \slow()OUCH..!\stop
      No matter!\stop
      You thought you could pass, but only the \col(1)hands\col(0) know the secret!

  - name: TX_2f18
    index: 0x18
    text: |-
      \slow()Im...impossible!
      Not once, but
      twice! \col(3)Twinrova\col(0)...
      \col(3)Onox\col(0)...
      I'm sorry...
      Goodbye!

  - name: TX_2f19
    index: 0x19
    text: |-
      \pos(2)Who enters my
      fine keep so
      impertinently?\stop
      Hah! I got it!
      You've come to
      steal the \col(1)Bomb
      Flowers\col(0) I'm
      collecting,
      haven't you?
      It won't happen,
      you pilfering
      thief! Don't
      think I'll let
      you out alive!

  - name: TX_2f1a
    index: 0x1a
    text: |-
      \pos(2)Hey! You're that
      meddling boy!
      Well, this time
      things won't go
      the way they did
      in \col(3)Holodrum\col(0)!
      I've gone to
      great trouble
      using the \col(1)Bomb
      Flowers\col(0) I stole
      from the Gorons!
      Taste my \col(1)Bombs\col(0)!
      C'mon, fool!

  - name:
    - TX_2f1b
    - TX_2f1c
    - TX_2f1d
    index:
    - 0x1b
    - 0x1c
    - 0x1d
    text: |-
      \pos(0)Noooooo!
      It can't be!
      Why meeeeeee?!?

  - name: TX_2f1e
    index: 0x1e
    text: |-
      3 Large,
      2 Regular.

  - name: TX_2f1f
    index: 0x1f
    text: |-
      I want a nice
      tropical
      vacation.

  - name: TX_2f20
    index: 0x20
    text: |-
      Feel my cold,
      steely gaze!!!

  - name: TX_2f21
    index: 0x21
    text: |-
      Huh? Did I say
      that?

  - name: TX_2f22
    index: 0x22
    text: |-
      Really? I mean,
      I knew that!

  - name: TX_2f23
    index: 0x23
    text: |-
      I wish I could
      go to a tropical
      southern island.

  - name: TX_2f24
    index: 0x24
    text: |-
      I want to ride
      a plane.
      Anywhere's fine.

  - name: TX_2f25
    index: 0x25
    text: |-
      I'm so sleepy.

  - name: TX_2f26
    index: 0x26
    text: |-
      \pos(2)It's time for
      our little game!
      I break apart.
      If you can
      force me back
      together and
      blow me away,
      it ends!
      But before you
      do, I shall
      take a bit of
      your soul!!!
      Now begin!

  - name: TX_2f27
    index: 0x27
    text: |-
      A turtle works
      faster than you!\stop
      You're too late!
      \Link...
      You did me a
      favor in
      \col(3)Holodrum\col(0)!
      I've taken the
      princess you're
      looking for!
      If you think
      you can save
      her, try!
      Gar har har har!

  - name: TX_2f28
    index: 0x28
    text: |-
      \pos(2)If you can dodge
      my attacks and
      make it up here,
      you can have
      your precious
      princess back!
      But it'll never
      happen!
      Gar har har har!

  - name: TX_2f29
    index: 0x29
    text: |-
      Ahh! Don't think
      this is over!
      Gar har har har!
      Goodbye!

  - name: TX_2f2a
    index: 0x2a
    text: |-
      \slow()Not bad! But as
      long as I am in
      \col(3)Nayru's\col(0) body,
      you cannot harm
      me, which means
      I'm invincible!
      Hah hah hah hah!

  - name: TX_2f2b
    index: 0x2b
    text: |-
      Hya hya hya!\stop
      You cannot see
      who I am, for I
      am your shadow!

- group: 0x30
  data:
  - name: TX_3000
    index: 0x00
    text: |-
      Do come in!\stop
      I am \col(3)Vasu\col(0), the
      jeweler. Is this
      your first time?
      Then let me
      explain jewelry.
      \jump(TX_303a)
    null_terminator: False

  - name: TX_3001
    index: 0x01
    text: |-
      Carrying a \col(1)ring\col(0)
      does nothing.
      Don't forget
      to open the
      Item Screen
      and wear it.

  - name: TX_3002
    index: 0x02
    text: |-
      I've appraised
      all your rings!

  - name: TX_3003
    index: 0x03
    text: |-
      Do come in!
      Welcome to
      \col(3)Vasu\col(0) Jewelers.\stop
      What can I do?\stop
       \opt()Appraise \opt()List
       \opt()Quit

  - name: TX_3004
    index: 0x04
    text: |-
      Which one shall
      I appraise?

  - name: TX_3005
    index: 0x05
    text: |-
      It's 20 Rupees!
       \opt()Appraise \opt()Quit

  - name: TX_3006
    index: 0x06
    text: |-
      You don't have
      enough. Sorry.

  - name: TX_3007
    index: 0x07
    text: |-
      You have this
      one already,
      so I'll buy it
      for 30 Rupees.

  - name: TX_3008
    index: 0x08
    text: |-
      \col(1)Rings\col(0) do nothing
      unless worn!

  - name: TX_3009
    index: 0x09
    text: |-
      I am \col(3)Red Snake\col(0).\stop
      And you want to
      ask about \col(1)rings\col(0)?
          \opt()Yes \opt()No

  - name: TX_300a
    index: 0x0a
    text: |-
      Appraisal or
      Ring Boxes...
      Which one?
      \opt()Appraisal \opt()Box

  - name: TX_300b
    index: 0x0b
    text: |-
      There are many
      magical \col(1)rings\col(0) in
      this land, but
      just finding one
      does not give
      you its powers.\stop
      Until a \col(1)ring\col(0) has
      been appraised
      and its power
      understood, it
      cannot be used.\stop
      \col(3)Vasu\col(0) does
      appraisals. Once
      appraised, pick
      from the List
      the ones you
      want in your
      \col(1)Ring Box\col(0).\stop
      And remember to
      wear the \col(1)ring\col(0)
      you will use.
      That is all.\stop
      \jump(TX_3016)That is all.\stop
      \jump(TX_3016)
    null_terminator: False

  - name: TX_300c
    index: 0x0c
    text: |-
      To carry
      appraised \col(1)rings\col(0),
      you must have
      a \col(1)Ring Box\col(0).\stop
      Pick your \col(1)rings\col(0)
      from the List
      and put them
      in your \col(1)box\col(0).\stop
      Then you can
      open the Item
      Screen at any
      time to wear a
      \col(1)ring\col(0).\stop
      Give it a try.\stop
      \jump(TX_3016)
    null_terminator: False

  - name: TX_300d
    index: 0x0d
    text: |-
      Take your pick.\stop
        \opt()Fortune
        \opt()Link

  - name: TX_300e
    index: 0x0e
    text: |-
      Fine...\stop
      Use a Game Link
      cable to connect
      to another
      Game Boy Color.\stop
      Now check to
      see if your
      friend is ready.\stop
      OK! Now for
      your \col(3)fortune\col(0)!\stop
      On "Start," I'll
      go see your
      friend. On
      "Ready," you
      both choose.
      Ready  \opt()Start!

  - name: TX_300f
    index: 0x0f
    text: |-
      I got stuck
      along the way.
      Is your cable
      connected?
      Please check it,
      then try again!

  - name: TX_3010
    index: 0x10
    text: |-
      Come back
      anytime.

  - name: TX_3011
    index: 0x11
    text: |-
      Appraise this?
        \opt()Yes \opt()No

  - name: TX_3012
    index: 0x12
    text: |-
      No! You can't
      leave until I
      appraise it!

  - name: TX_3013
    index: 0x13
    text: |-
      I'll appraise it
      for free this
      time, but after
      this, it will be
      20 Rupees per
      \col(1)ring\col(0). If you get
      two of the same
      \col(1)ring\col(0), I'll buy
      one for
      30 Rupees.\stop
      Now, the List!
      Appraised \col(1)rings\col(0)
      get added to the
      List. When you
      want a \col(1)ring\col(0),
      move it from
      your List to
      your \col(1)box\col(0).
      Talk to me to
      see your List.
      Let's take a
      peek at it now.

  - name: TX_3014
    index: 0x14
    text: |-
      Oh! All your
      \col(1)rings\col(0) have been
      appraised.

  - name: TX_3015
    index: 0x15
    text: |-
      Oh! You don't
      have any \col(1)rings\col(0)
      in your List!

  - name: TX_3016
    index: 0x16
    text: |-
      Do you want
      to hear more?
         \opt()Yes \opt()No

  - name: TX_3017
    index: 0x17
    text: |-
      That's what that
      \col(1)ring\col(0) is. I'll
      add it to your
      List!

  - name: TX_3018
    index: 0x18
    text: |-
      I am \col(3)Red Snake\col(0)!
      I am keeper of
      \col(1)ring secrets\col(0)!
      Make a choice!\stop
      \opt()Say \opt()Ask \col(1)secret\col(0)
             \opt()Quit

  - name: TX_3019
    index: 0x19
    text: |-
      "All About
      Ring Secrets"
        \opt()Read \opt()Don't

  - name: TX_301a
    index: 0x1a
    text: |-
      If you save the
      \col(1)secret\col(0) the \col(3)Red
      Snake\col(0) told you
      in an Oracle of
      Seasons game you
      played, and tell
      it to the \col(3)Red
      Snake\col(0) here,\stop
      you can bring
      \col(1)rings\col(0) found in
      your Oracle of
      Seasons game
      here. In the
      same way, you
      can take \col(1)rings\col(0)
      from here to
      your Oracle of
      Seasons here.\stop
      Good news!\stop
      With a Game Link
      cable and two
      Game Boy Color
      systems, you can
      bring \col(1)rings\col(0) here
      without saving
      your \col(1)secret\col(0)!\stop
        -NOTE!!-
      If you haven't
      finished your
      quest or used a
      \col(1)secret\col(0) to visit
      \col(3)Labrynna\col(0), your
      \col(1)ring secret\col(0) will
      not work.

  - name: TX_301b
    index: 0x1b
    text: |-
      Oh, really?
      \jump(TX_3010)
    null_terminator: False

  - name: TX_301c
    index: 0x1c
    text: |-
      Hmm... I see!
      I call this the
      \call(0xfd)!

  - name: TX_301d
    index: 0x1d
    text: |-
      Listen well!\stop
      \secret1
      \secret2\stop
      Listen again?
        \opt()Yes \opt()No

  - name: TX_301e
    index: 0x1e
    text: |-
      I don't know
      that \col(1)secret\col(0).
      Come back after
      listening again
      to the \col(1)secret\col(0)
      you heard in
      Oracle of Ages.

  - name: TX_301f
    index: 0x1f
    text: |-
      I am \col(3)Blue Snake\col(0).\stop
      I give \col(3)ring
      fortunes\col(0).
      Would you like a
      \col(3)ring fortune\col(0)?
        \opt()Yes \opt()No

  - name: TX_3020
    index: 0x20
    text: |-
      "Ring Link
      Basics"
        \opt()Read \opt()Don't

  - name: TX_3021
    index: 0x21
    text: |-
      How can you do
      a friendship
      fortune by
      yourself?
      Try it with a
      friend.

  - name:
    - TX_3022
    - TX_3023
    index:
    - 0x22
    - 0x23
    text: |-
      Your \col(3)fortune\col(0) is
      finished. The
      \col(1)ring\col(0) represents
      your friendship.
      Do not be angry,
      no matter what.

  - name: TX_3024
    index: 0x24
    text: |-
      I am \col(3)Blue Snake\col(0).\stop
      I manage the
      Game Link cable.
      What shall I do?\stop
        \opt()Fortune
        \opt()Link  \opt()Quit

  - name: TX_3025
    index: 0x25
    text: |-
      Pick a topic.\stop
        \opt()Fortune
        \opt()Link  \opt()Quit

  - name: TX_3026
    index: 0x26
    text: |-
      About Ring Links\stop
      With a Game Link
      cable and two
      Game Boy Color
      systems, you can
      bring \col(1)rings\col(0) you
      found in an
      Oracle of
      Seasons game to
      \col(3)Labrynna\col(0) without
      saving your
      \col(1)secret\col(0).\stop
      Insert your
      Oracle of
      Seasons Game
      Pak into another
      Game Boy Color,
      insert a Game
      Link cable and
      turn the power
      ON, but don't
      press any
      buttons.\stop
      Play Oracle of
      Ages, talk to
      \col(3)Blue Snake\col(0) and
      choose "Link" to
      bring Oracle of
      Seasons \col(1)rings\col(0)
      here.\stop
      In the same way,
      you can take
      \col(1)rings\col(0) found here
      to your Oracle
      of Seasons game.\stop
        --NOTE!!!--
      If you haven't
      finished this
      quest before or
      come by \col(1)secret\col(0)
      to \col(3)Labrynna\col(0),
      you cannot \col(1)link\col(0).\stop
      Read more?
        \opt()Yes \opt()No

  - name: TX_3027
    index: 0x27
    text: |-
      Hmm... OK.
      I have brought
      your \col(1)rings\col(0) from
      \col(3)Holodrum\col(0), so
      see \col(3)Vasu\col(0) to
      check your List.

  - name: TX_3028
    index: 0x28
    text: |-
      OK.\stop
      Link your Game
      Boy Color to the
      other. Insert a
      Game Pak into
      the other Game
      Boy Color and
      turn the power
      ON, but wait
      before pressing
      any buttons.
      When everything
      is ready, choose
      "Begin!"
          \opt()Start!

