- group: 0x0a
  data:
  - name: TX_0a00
    index: 0x00
    text: |-
      No one comes back here to tell me when my watch is over.

  - name: TX_0a01
    index: 0x01
    text: |-
      Give him the \col(0x84)\item(0x03)
      \col(1)Wood Clock\col(0)?
        \opt()Yes \opt()No

  - name: TX_0a02
    index: 0x02
    text: |-
      Huh? What's that?
      Hold on...

  - name: TX_0a03
    index: 0x03
    text: |-
      I might have the perfect trade for you!

  - name: TX_0a04
    index: 0x04
    text: |-
      Here, this might be something you'd like.

  - name: TX_0a05
    index: 0x05
    text: |-
      Thanks again! Now I won't ever stay longer than I have to!

  - name: TX_0a06
    index: 0x06
    text: |-
      \sfx(0xb6)What was that?
      My nose stings!
      That was stinky!\stop
      ...?!?
      Stinky?!?\stop
      That smell! It
      cleared up my
      nose! Thanks!
      That \col(0x84)\item(0x03) \col(1)bag\col(0) did
      it! I need it!
      It's unbearable!
      I'll trade you
      something really
      good for it!

  - name: TX_0a07
    index: 0x07
    text: |-
      \sfx(0xb6)Oops! I'm out of
      dinner fixings!
      Oh, well.

  - name: TX_0a08
    index: 0x08
    text: |-
      Guess I'm working overtime again...

  - name: TX_0a09
    index: 0x09
    text: |-
      I wish I had a way to tell time so I can leave.

  - name: TX_0a0a
    index: 0x0a
    text: |-
      \sfx(0xb6)I found this
      by the sea. It
      was next to a
      Tokay with no
      tail. Hey! You
      don't have a
      tail, either.\stop
      ...Ohh.
      Is this...\stop
      Um, take this.
      I... I don't
      need it.

  - name: TX_0a0b
    index: 0x0b
    text: |-
      \sfx(0xb6)Hey! You're the
      one who I...\stop
      Um, I'm glad you
      came. I was
      thinking maybe
      I should hide--
      I mean maybe I
      should go give
      this back to
      you. Here!

  - name: TX_0a0c
    index: 0x0c
    text: |-
      \sfx(0xb6)That's all I
      picked up, but
      maybe other
      Tokay took
      stuff, too. But
      maybe not. Maybe
      you should look
      around.

  - name: TX_0a0d
    index: 0x0d
    text: |-
      \sfx(0xb6)I'm hungry!

  - name: TX_0a0e
    index: 0x0e
    text: |-
      \sfx(0xb6)Ohhh-woahhh!!!

  - name: TX_0a0f
    index: 0x0f
    text: |-
      \sfx(0xb6)Leave me alone!\stop
      I, I don't know
      ...nothing?
      I mean, I'm
      innocent!
      I don't know
      whose \col(1)Shovel\col(0)
      it is!

  - name: TX_0a10
    index: 0x10
    text: |-
      \sfx(0xb6)Welcome to the
      Wild Tokay, the
      game room for
      all fit Tokay!
      Today's prize
      is...this!!!

