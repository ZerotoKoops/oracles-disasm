  - name:
    - TX_5500
    - TX_5506
    index:
    - 0x00
    - 0x06
    text: |-
      Welcome,
      \Link.
      I am \col(3)Farore\col(0),
      \col(1)Oracle of
      Secrets\col(0). This
      is the \col(3)Hall of
      Secrets\col(0), where
      your \col(1)secrets\col(0)
      take form.

  - name: TX_5501
    index: 0x01
    text: |-
      \call(TX_5500)
      At times and
      places, you will
      hear powerful
      \col(1)secrets\col(0).
      At those times,
      come see me.
      I can give
      shape and form
      to your \col(1)secrets\col(0)!

  - name: TX_5502
    index: 0x02
    text: |-
      \call(TX_5500)
      Do you know any
      \col(1)secrets\col(0)?
        \opt()Yes \opt()No

  - name: TX_5503
    index: 0x03
    text: |-
      Then come back
      after you have
      heard some.

  - name: TX_5504
    index: 0x04
    text: |-
      I, too, know
      this \col(1)secret\col(0).

  - name: TX_5505
    index: 0x05
    text: |-
      Come back
      anytime.

  - name: TX_5507
    index: 0x07
    text: |-
      I can give shape
      to powerful
      \col(1)secrets\col(0) that
      I remember.\stop
      Do you know the
      \col(1)secret\col(0) to moving
      through time?
        \opt()Yes \opt()No

  - name: TX_5508
    index: 0x08
    text: |-
      Really? Come
      back anytime
      after you learn
      some \col(1)secrets\col(0).

  - name: TX_5509
    index: 0x09
    text: |-
      Your \col(1)secrets\col(0)
      have called
      forth new power!
      Come again
      anytime.

