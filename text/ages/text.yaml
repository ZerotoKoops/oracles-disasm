      finds dark power
      in the past. All
      will go dark!
      \Link! You must
      stop \col(3)Veran\col(0) and
      save \col(3)Nayru\col(0)!\stop
      Must I say it
      again?
        \opt()Yes \opt()No

  - name: TX_054b
    index: 0x4b
    text: |-
      \pos(2)I don't recall,
      but I think you
      need the eight
      \col(1)Essences of Time\col(0)
      hidden in
      \col(3)Labrynna\col(0) to beat
      \col(3)Veran\col(0)!\stop
