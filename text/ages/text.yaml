    text: |-
      \call(TX_3034)\stop
      You have saved
      the world! You
      are a true hero!
      \jump(TX_3035)
    null_terminator: False

  - name: TX_303a
    index: 0x3a
    text: |-
      \col(1)Rings\col(0) made from
      \col(1)Mystical Seeds\col(0)
      have very
      mystical powers.
      If you wear one,
      its mystical
      power will be
      passed to you.
      But you must
      keep it in your
      \col(1)Ring Box\col(0).
      The mystical
      power will
      gradually weaken
      and you won't
      be able to use
      it. Understood?
        \opt()Yes \opt()No

