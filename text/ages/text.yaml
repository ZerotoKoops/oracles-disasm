- group: 0x01
  data:
  - name: TX_0100
    index: 0x00
    text: |-
      \pos(2)HELLLLP!!!

  - name: TX_0101
    index: 0x01
    text: |-
      That was
      frightening!\stop
      I was suddenly
      attacked...
      Thank you,
      traveler.
      What is your
      name?\stop
      \Link, is it?\stop
      I see a \sym(0x57) on the
      back of your
      left hand. That
      is the sign of a
      \col(3)Hyrulean\col(0) hero!
      That must be why
      the beasts fled.\stop
      I am \col(3)Impa\col(0), nurse
      to \col(3)Hyrule's\col(0)
      \col(3)Princess Zelda\col(0).

  - name: TX_0102
    index: 0x02
    text: |-
      \call(TX_0101)
      I am looking for
      a singer named
      \col(3)Nayru\col(0).\stop
      Will you help me
      look, \Link?
      I'd feel safer
      with you nearby.

  - name: TX_0103
    index: 0x03
    text: |-
      \call(TX_0101)
      \col(3)Zelda\col(0) asked me
      to find a singer
      named \col(3)Nayru\col(0).\stop
      Will you help me
      look, \Link?
      I'd feel safer
      with you nearby.

  - name: TX_0104
    index: 0x04
    text: |-
      Oh! That's it!

  - name: TX_0105
    index: 0x05
    text: |-
      This rock with
      the \sym(0x57) is a sign!

  - name: TX_0106
    index: 0x06
    text: |-
      Could you move
      this rock for
      me, \Link?

  - name: TX_0107
    index: 0x07
    text: |-
      I'll... um...
      I'll just...

  - name: TX_0108
    index: 0x08
    text: |-
      I can't do it...

  - name: TX_0109
    index: 0x09
    text: |-
      Thank you...
      Now let's go.

  - name: TX_010a
    index: 0x0a
    text: |-
      Where are you
      going!?!
      \jump(TX_010c)
    null_terminator: False

  - name: TX_010b
    index: 0x0b
    text: |-
      What are you
      doing?\n
    null_terminator: False

  - name:
    - TX_010c
    - TX_010d
    - TX_010e
    - TX_010f
    index:
    - 0x0c
    - 0x0d
    - 0x0e
    - 0x0f
    text: |-
      Hurry up and
      move this!

  - name: TX_0110
    index: 0x10
    text: |-
      Oh! \Link!
      You saved me!
      To think I was
      possessed!

  - name: TX_0111
    index: 0x11
    text: |-
      ............\stop
      That \col(3)Veran\col(0) lady
      is frightening.
      I was forced to
      do her will, in
      spite of myself.

  - name: TX_0112
    index: 0x12
    text: |-
      Shadows were
      surrounding the
      Oracle of Ages,
      so I came hoping
      to take her to
      \col(3)Hyrule\col(0). I had no
      idea this would
      happen...
      \jump(TX_0111)
    null_terminator: False

  - name: TX_0113
    index: 0x13
    text: |-
      I have failed
      \col(3)Zelda\col(0)...
      \col(3)Zelda\col(0)...\stop
      She sensed an
      evil shadow
      drawing near
      \col(3)Nayru\col(0) and asked
      me to bring her
      to \col(3)Hyrule\col(0)
      We should not
      have forgotten
      you, the hero of
      \col(3)Holodrum\col(0).\stop
      Look what has
      happened now...
      \jump(TX_0111)
    null_terminator: False

  - name: TX_0114
    index: 0x14
    text: |-
      \col(3)Veran\col(0) said she'd
      go back in time.
      She must be
      planning to use
      \col(3)Nayru's\col(0) power to
      launch some sort
      of plan in the
      past. \col(3)Labrynna\col(0)
      already feels
      the effects.\stop
      If it's true, we
      must stop her...
      Uhh! My limbs
      feel so heavy
      after what \col(3)Veran\col(0)
      did. I can't
      move them
      very easily.\stop
      \Link...
      If the \sym(0x57) on your
      left hand is
      real, then you
      may be the hero
      who will save
      this world.
      Please help us!

  - name: TX_0115
    index: 0x15
    text: |-
      \call(TX_0114)\stop
      Ah, yes! \col(3)Zelda\col(0)
      entrusted this
      sword to me.
      You may use it.

  - name: TX_0116
    index: 0x16
    text: |-
      \call(TX_0118)\stop
      Ah, yes! \col(1)Zelda\col(0)
      entrusted this
      \col(3)shield\col(0) to me.
      Please use it.

  - name: TX_0117
    index: 0x17
    text: |-
      \Link,
      can you go meet
      the \col(3)Maku Tree\col(0) in
      \col(3)Lynna Village\col(0)?\stop
      The \col(3)Maku Tree\col(0) is
      the guardian of
      \col(3)Labrynna\col(0). Surely
      she can help.
      \col(3)Nayru's House\col(0) is
      in the woods
      east of here.
      I'll be there.

  - name:
    - TX_0118
    - TX_0119
    - TX_011a
    - TX_011b
    - TX_011c
    - TX_011d
    - TX_011e
    - TX_011f
    index:
    - 0x18
    - 0x19
    - 0x1a
    - 0x1b
    - 0x1c
    - 0x1d
    - 0x1e
    - 0x1f
    text: |-
      \col(3)Veran\col(0) said she'd
      go back in time.
      She must hope
      to use \col(3)Nayru's\col(0)
      powers to launch
      some plan in the
      past. \col(3)Labrynna\col(0)
      already feels
      the effects.\stop
      \Link...
      First \col(3)Holodrum\col(0),
      now \col(3)Labrynna\col(0)
      faces its doom.
      I am sorry to
      ask so much...
      But we can rely
      on no other!
      Please!
      Save \col(3)Nayru\col(0)!

  - name: TX_0120
    index: 0x20
    text: |-
      Come see me if you need a refill!

  - name: TX_0121
    index: 0x21
    text: |-
      Could there be
      a hidden room
      somewhere? I
      have felt drafts
      from above...

  - name: TX_0122
    index: 0x22
    text: |-
      Hurry! You must
      save \col(3)Nayru\col(0)!
      The world is
      falling apart!

  - name: TX_0123
    index: 0x23
    text: |-
      Saving \col(3)Nayru\col(0)
      doesn't seem to
      have ended it...
      Leave this to
      me. You go back
      in time and put
      a stop to
      \col(3)Veran's\col(0) plans!

  - name: TX_0124
    index: 0x24
    text: |-
      \Link!!!
      Wait!

  - name: TX_0125
    index: 0x25
    text: |-
      \pos(2)\Link, I was
      researching the
      past and found
      something awful!
      \col(3)Ralph\col(0) is a
      descendant of
      \col(3)Queen Ambi\col(0)!
      Do you know
      what this means?\stop
      \col(3)Ralph\col(0) lives now
      because \col(3)Ambi\col(0)
      lived in the
      past. If \col(3)Ambi\col(0) is
      slain, \col(3)Ralph\col(0)
      will never
      exist!\stop
      I came to try
      to stop \col(3)Ralph\col(0),
      but I couldn't!

  - name: TX_0126
    index: 0x26
    text: |-
      \pos(2)You're the only
      one who can save
      \col(3)Ralph\col(0), and all
      of us, \Link!

  - name: TX_0127
    index: 0x27
    text: |-
      \Link!
      Great timing!
      This bird just
      told me that
      \col(3)Zelda\col(0) is on her
      way to \col(3)Lynna
      Village\col(0)!
      So I came to
      meet her, but...\stop
      Oh, what a mess!
      A red monster
      appeared right
      before my eyes
      and carried
      \col(3)Zelda\col(0) off!
      It flew toward
      the tower...
      What am I
      to do?
      \Link, \col(3)Zelda\col(0)
      is a symbol of
      hope for the
      world! If
      anything happens
      to her, all hope
      will be lost!\stop
      You must save
      \col(3)Zelda\col(0)!
      Please,
      \Link, you
      must find a way
      to save \col(3)Zelda\col(0)!

  - name: TX_0128
    index: 0x28
    text: |-
      \col(3)Zelda\col(0)!!!
      You're safe! I
      was so worried.
      Why did you come
      alone to such a
      dangerous place?

  - name: TX_0129
    index: 0x29
    text: |-
      \col(3)Zelda\col(0) must be at
      the top of this
      tower! Please,
      \Link, you
      must find a way
      to save her!

  - name: TX_012a
    index: 0x2a
    text: |-
      \Link has taken
      it, so there's
      nothing to fear,
      right, \col(3)Zelda\col(0)?
      For now, we must
      hide in \col(3)Nayru's
      House\col(0) and await
      word from
      \Link.\stop
      \Link...
      You were headed
      to the mountains
      in the north-
      west? I heard
      there's a trail
      west of here.
      Be careful.

  - name: TX_012b
    index: 0x2b
    text: |-
      What will happen
      to the
      villagers?

  - name: TX_012c
    index: 0x2c
    text: |-
      \col(3)Zelda's\col(0) antics
      frighten me so.
      \Link,
      please save
      \col(3)Nayru\col(0)!

  - name: TX_012d
    index: 0x2d
    text: |-
      Saving \col(3)Nayru\col(0)
      doesn't seem to
      have to been
      enough. Please,
      \Link! We're
      counting on you!

  - name: TX_012e
    index: 0x2e
    text: |-
      If \col(3)Zelda\col(0) were
      here, everything
      would be fine!

  - name: TX_012f
    index: 0x2f
    text: |-
      Ahhh! \col(3)Zelda\col(0) has
      been kidnapped!
      What are we to
      do now? You must
      do something,
      \Link!

  - name: TX_0130
    index: 0x30
    text: |-
      \Link!
      It's terrible!\x20

  - name: TX_0131
    index: 0x31
    text: |-
      \col(3)Zelda\col(0)!
      Oh, \col(3)Zelda\col(0)!
      Listen--just as
      the petrified
      townsfolk began
      to get better,
      \col(3)Zelda\col(0) and I
      cheered up a
      boy who was.
      crying. Then
      suddenly
      lightning...

  - name: TX_0132
    index: 0x32
    text: |-
      I was worried
      about \col(3)Nayru\col(0)
      being alone, so
      I came along.

