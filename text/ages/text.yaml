    index: 0x14
    text: |-
      Want to hear
      the rules?
        \opt()No \opt()Yes

  - name: TX_0a15
    index: 0x15
    text: |-
      Then let's get
      started!

  - name: TX_0a16
    index: 0x16
    text: |-
      Ready?\stop
      Go!

  - name: TX_0a17
    index: 0x17
    text: |-
      Too bad!

  - name: TX_0a18
    index: 0x18
    text: |-
      Congratulations!\stop
      Take the prize!

  - name: TX_0a19
    index: 0x19
    text: |-
      It's 10 Rupees
      to try again!
        \opt()OK \opt()No thanks

  - name: TX_0a1a
    index: 0x1a
    text: |-
      I see...
      Come again.

  - name: TX_0a1b
    index: 0x1b
    text: |-
      You don't have
      enough Rupees!

  - name: TX_0a1c
    index: 0x1c
    text: |-
      \sfx(0xb6)This is the Wild
      Tokay, game room
      for all healthy
      Tokay. You can't
      play if you
      can't lift meat.

  - name: TX_0a1d
    index: 0x1d
    text: |-
      \sfx(0xb6)This huge fish
      washed ashore!
      It looks fresh
      and tasty!

  - name: TX_0a1e
    index: 0x1e
    text: |-
      \sfx(0xb6)Red fish has a
      very exciting
      flavor.

  - name: TX_0a1f
    index: 0x1f
    text: |-
      \sfx(0xb6)We found this
      red fish. We're
      dying to savor
      its exciting
      flavor.

  - name: TX_0a20
    index: 0x20
    text: |-
      \sfx(0xb6)Hey! What are
      those red \col(1)seeds\col(0)
      you have? \col(1)Ember
      Seeds\col(0)? What an
      exciting name!\n
    null_terminator: False

  - name: TX_0a21
    index: 0x21
    text: |-
      Will you trade
      \col(1)Ember Seeds\col(0) for
      our fish?
        \opt()Sure \opt()No way

  - name: TX_0a22
    index: 0x22
    text: |-
      \sfx(0xb6)Then I guess
      this red fish
      will have to do.

  - name: TX_0a23
    index: 0x23
    text: |-
      \sfx(0xb6)It's a deal!
      I can't wait to
      taste it!

  - name: TX_0a24
    index: 0x24
    text: |-
      \sfx(0xb6)Crack!
      Munch, munch!
      ................\stop
      !!!

  - name: TX_0a25
    index: 0x25
    text: |-
      \sfx(0xb6)HOT!!! HOT!!!

  - name: TX_0a26
    index: 0x26
    text: |-
      Pass meat to
      each Tokay that
      runs by on the
      left and right.
      If you give meat
      to each one, you
      win! If you skip
      even one, you
      fail.
      Understand?
        \opt()Yes \opt()No

  - name: TX_0a27
    index: 0x27
    text: |-
      \pos(2)\sfx(0xb6)First give me
      my \col(1)hoop\col(0) back.
      Then you get
      your \col(1)Shovel\col(0).
        \opt()OK \opt()Not yet

  - name: TX_0a28
    index: 0x28
    text: |-
      \pos(2)Then here's
      yours.

  - name: TX_0a29
    index: 0x29
    text: |-
      \pos(2)Then I'll keep
      yours.

  - name: TX_0a2a
    index: 0x2a
    text: |-
      \sfx(0xb6)I found that
      \col(1)feather\col(0). You can
      have it for 10
      \col(1)Mystery Seeds\col(0).

  - name: TX_0a2b
    index: 0x2b
    text: |-
      \pos(2)\call(TX_0a2a)\stop
      10 \col(1)Mystery Seeds\col(0)
        \opt()Trade \opt()Don't

  - name: TX_0a2c
    index: 0x2c
    text: |-
      \pos(2)\call(TX_0a2a)\stop
      You don't have
      \col(1)Mystery Seeds\col(0)?
      Then I'll trade
      you for your
      \col(1)Shovel\col(0).
        \opt()Trade \opt()Don't

  - name: TX_0a2d
    index: 0x2d
    text: |-
      \pos(2)Fine.

  - name: TX_0a2e
    index: 0x2e
    text: |-
      \pos(2)You don't have
      enough \col(1)seeds\col(0)!

  - name: TX_0a2f
    index: 0x2f
    text: |-
      \pos(2)Come back if you
      want to trade.

  - name: TX_0a30
    index: 0x30
    text: |-
      \pos(2)\sfx(0xb6)First give me my
      \col(1)feather\col(0) back.
      Then you get
      your \col(1)Shovel\col(0).
        \opt()OK \opt()Not yet

  - name: TX_0a31
    index: 0x31
    text: |-
      \pos(2)\sfx(0xb6)That's the \col(1)hoop\col(0)
      I found. I'll
      trade it for
      10 \col(1)Scent Seeds\col(0).

  - name: TX_0a32
    index: 0x32
    text: |-
      \pos(2)\call(TX_0a31)\stop\n
    null_terminator: False

  - name: TX_0a3c
    index: 0x3c
    text: |-
      10 \col(1)Scent Seeds\col(0)
        \opt()Trade \opt()Don't

  - name: TX_0a33
    index: 0x33
    text: |-
      \pos(2)\call(TX_0a31)\stop
      You don't have
      \col(1)Scent Seeds\col(0)?
      Then I'll trade
      you for your
      \col(1)Shovel\col(0).
        \opt()Trade \opt()Don't

  - name: TX_0a34
    index: 0x34
    text: |-
      \pos(2)You don't have
      enough \col(1)seeds\col(0)!

  - name: TX_0a35
    index: 0x35
    text: |-
      \pos(2)\sfx(0xb6)I'll give you
      your \col(1)Shovel\col(0) back
      if you give me
      my \col(1)hoop\col(0) back.
        \opt()OK \opt()Not yet

  - name: TX_0a36
    index: 0x36
    text: |-
      \pos(2)\sfx(0xb6)I'll give you
      your \col(1)Shovel\col(0) back
      if you give me
      my \col(1)feather\col(0) back.
        \opt()OK \opt()Not yet

  - name: TX_0a37
    index: 0x37
    text: |-
      \pos(2)\sfx(0xb6)If you want
      something, we
      can trade.

  - name: TX_0a38
    index: 0x38
    text: |-
      \pos(2)\sfx(0xb6)I have nothing
      left to trade.

  - name: TX_0a39
    index: 0x39
    text: |-
      \pos(2)\sfx(0xb6)I found this
      \col(1)strange board\col(0) by
      the coast.
      \jump(TX_0a3c)
    null_terminator: False

  - name: TX_0a3a
    index: 0x3a
    text: |-
      \pos(2)You already have
      one.\stop
      I can't let you
      have another.

  - name: TX_0a3b
    index: 0x3b
    text: |-
      You've got all
      your items!!!

  - name:
    - TX_0a3d
    - TX_0a3e
    - TX_0a3f
    - TX_0a40
    index:
    - 0x3d
    - 0x3e
    - 0x3f
    - 0x40
    text: |-
      \sfx(0xb6)Today, I saw there was a \col(1)strange pattern\col(0) on the floor in our \col(1)Temple\col(0)!\stop
      \sfx(0xb6)It reminded me of the \col(3)gravestones\col(0) just northwest of our desert.\stop
      \sfx(0xb6)What could it mean?

  - name: TX_0a41
    index: 0x41
    text: |-
      \sfx(0xb6)Hey! Is that a
      \col(1)Scent Seedling\col(0)?
      Let's plant it!

  - name: TX_0a42
    index: 0x42
    text: |-
      ...Huh?
      What's wrong?
      It's not like
      it's gonna get
      big right away.
      It takes a long,
      long time for a
      \col(1)seed\col(0) to become
      a tree. Don't
      worry.\n
    null_terminator: False

  - name: TX_0a43
    index: 0x43
    text: |-
      I'll take care
      of it, so come
      back after a
      long, long time.

  - name: TX_0a44
    index: 0x44
    text: |-
      \sfx(0xb6)After a long,
      long time, there
      will be a grand
      \col(1)Scent Tree\col(0) here.

  - name: TX_0a45
    index: 0x45
    text: |-
      \sfx(0xb6)This is the
      Wild Tokay
      Museum. Did you
      need something?
        \opt()Yes \opt()No

  - name: TX_0a46
    index: 0x46
    text: |-
      \sfx(0xb6)Then enjoy
      the exhibit.

  - name: TX_0a47
    index: 0x47
    text: |-
      \sfx(0xb6)Hey! That's the
      legendary Wild
      Tokay \col(1)secret\col(0)!
      Now I want to
      bring back the
      Wild Tokay! Can
      you help?
        \opt()Sure \opt()No way

  - name: TX_0a48
    index: 0x48
    text: |-
      \sfx(0xb6)I don't
      understand...

  - name: TX_0a49
    index: 0x49
    text: |-
      \sfx(0xb6)Come back if you
      feel up to it.

  - name: TX_0a4a
    index: 0x4a
    text: |-
      \sfx(0xb6)The Wild Tokay
      was a legendary
      ceremony here on
      \col(3)Crescent Island\col(0).
      Do you know
      the rules?
        \opt()Yes \opt()No

  - name: TX_0a4b
    index: 0x4b
    text: |-
      Hand meat to
      each Tokay that
      runs by on the
      left or right.
      If you give meat
      to all of them,
      you win, but if
      you miss even
      one, you fail.
      Understand?
        \opt()Yes \opt()No

  - name: TX_0a4c
    index: 0x4c
    text: |-
      Then let's get
      started! If you
      do well, you'll
      get this!

  - name: TX_0a4d
    index: 0x4d
    text: |-
      Too bad.
      Well, want to
      try again?
        \opt()Yes \opt()No

  - name:
    - TX_0a4e
    - TX_0a52
    index:
    - 0x4e
    - 0x52
    text: |-
      Come back
      anytime!

  - name: TX_0a4f
    index: 0x4f
    text: |-
      You did it!
      You cleared the
      Wild Tokay!
      Here! Take this!

  - name: TX_0a50
    index: 0x50
    text: |-
      \sfx(0xb6)I'll teach you
      the \col(1)secret\col(0) to
      carrying more
      \col(1)Bombs\col(0) in
      \col(3)Holodrum\col(0), too.\stop
      \secret1\stop
      Come back if you
      forget!

  - name:
    - TX_0a51
    - TX_0a53
    - TX_0a54
    - TX_0a55
    - TX_0a56
    - TX_0a57
    - TX_0a58
    - TX_0a59
    - TX_0a5a
    - TX_0a5b
    - TX_0a5c
    - TX_0a5d
    - TX_0a5e
    - TX_0a5f
    index:
    - 0x51
    - 0x53
    - 0x54
    - 0x55
    - 0x56
    - 0x57
    - 0x58
    - 0x59
    - 0x5a
    - 0x5b
    - 0x5c
    - 0x5d
    - 0x5e
    - 0x5f
    text: |-
      \sfx(0xb6)Want to play
      the Wild Tokay?
        \opt()Yes \opt()No

  - name: TX_0a60
    index: 0x60
    text: |-
      \sfx(0xb6)All of us
      \col(1)Tokay\col(0) keep an
      entrance to our
      sacred \col(1)Temple\col(0) in our homes to pray.

  - name: TX_0a61
    index: 0x61
    text: |-
      \sfx(0xb6)The \col(1)chief\col(0) lives just north of here.\stop
      \sfx(0xb6)Do you have business with him?

  - name: TX_0a62
    index: 0x62
    text: |-
      \sfx(0xb6)Some say our \col(1)Temple\col(0) used to be a mine abandoned long ago.\stop
      \sfx(0xb6)How ridiculous!


  - name: TX_0a63
    index: 0x63
    text: |-
      \sfx(0xb6)Our \col(1)Temple\col(0)
      is a labyrinth below our feet.
      Only the chief knows what's beyond the stairs we use to pray.

  - name: TX_0a64
    index: 0x64
    text: |-
      \sfx(0xb6)One, two, three!
      Is that a lot?
      I need to learn
      my numbers...\stop
      \sfx(0xb6)I heard from the chief there are a lot of sacred \col(1)relics\col(0) hidden around the desert and in our \col(1)Temple\col(0).
      But why go to the trouble of finding them?

  - name: TX_0a65
    index: 0x65
    text: |-
      \sfx(0xb6)Hello! I am the chief of the Tokay in this small desert.\stop
      \sfx(0xb6)There's a
      winding maze
      beneath this
      desert, known as our \col(1)Temple\col(0).\stop
      You have my permission to explore down there, but please do not disturb any tokays if you see them!

  - name: TX_0a66
    index: 0x66
    text: |-
      \sfx(0xb6)It's said that
      long ago, a
      Tokay with no
      tail ventured into the \col(1)Temple\col(0), climbed the sacred stairs and created our desert with only his two hands!\stop
      \sfx(0xb6)I don't believe all the folklore, but I would like to meet this legendary figure.

  - name: TX_0a67
    index: 0x67
    text: |-
      \sfx(0xb6)Our \col(1)Temple\col(0) has \col(3)five rooms\col(0) with a \col(1)strange pattern\col(0) on the floor.\stop
      \sfx(0xb6)The \col(1)Temple\col(0) is trying to tell us something!\stop
      \sfx(0xb6)What? Um... I'm not sure!

  - name: TX_0a68
    index: 0x68
    text: |-
      \sfx(0xb6)I found this
      \col(1)scrap wood\col(0) by
      the sea. It's
      weird. I've been
      waiting here a
      long time, but
      the owner hasn't
      come to claim
      it.
      Umm, I guess you
      can have it.
      I've been
      polishing it for
      many years, so
      it's very shiny.

  - name: TX_0a69
    index: 0x69
    text: |-
      \sfx(0xb6)If you meet the
      one who dropped
      it, you don't
      need to mention
      me! I don't need
      any thanks.

  - name: TX_0a6a
    index: 0x6a
    text: |-
      \sfx(0xb6)Hey! You!
      Listen to me!
      Beware of going down into the \col(1)Temple\col(0)!
      Talk to the chief first!

  - name: TX_0a6b
    index: 0x6b
    text: |-
      \sfx(0xb6)Beware of going down into the \col(1)Temple\col(0)!
      Talk to the chief first!

  - name: TX_0a6c
    index: 0x6c
    text: |-
      \sfx(0xb6)I don't know what these \col(3)statues\col(0) are used for, but they are all over the desert.


- group: 0x0b
  data:
  - name: TX_0b00
    index: 0x00
    text: |-
      \pos(0)Boo hoo!
      This room is as
      dark as my soul!
      I'll never be
      able to pass on
      like this...

  - name: TX_0b01
    index: 0x01
    text: |-
      \pos(2)Ahhh, the
      warm glow of
      this torch lifts
      my spirits.
      Thank you for
      lighting it!
      I don't have
      much to offer
      you, but please
      take this.

  - name: TX_0b02
    index: 0x02
    text: |-
      \pos(0)Look me up
      if you're ever
      in the spirit
      world!
      Bye-bye!

  - name: TX_0b03
    index: 0x03
    text: |-
      This isn't good!\stop
      I want to
      deliver the mail
      on time, but I
      can't do it if I
      don't know the
      time!

  - name: TX_0b04
    index: 0x04
    text: |-
      Show him the \col(0x84)\item(0x01)
      \col(1)Poe Clock\col(0)?
        \opt()Yes \opt()No

  - name: TX_0b05
    index: 0x05
    text: |-
      Hmm? Tick, tock?
      That tells time!
      Are you giving
      me this clock?
      Don't say a
      word! Of course
      you will! What a
      big help!
      Here's your
      reward. Now I'm
      off to work. I'm
      a workaholic!

  - name: TX_0b06
    index: 0x06
    text: |-
      Why you...
      Sheesh!!!

  - name: TX_0b07
    index: 0x07
    text: |-
      Dearie, do you have any medicine?
      My bones are frail and I need to visit the market.

  - name: TX_0b08
    index: 0x08
    text: |-
      Give her the \col(0x84)\item(0x02)
      \col(1)Life Potion\col(0)?
        \opt()Yes \opt()No

  - name: TX_0b09
    index: 0x09
    text: |-
      Oh, happy days! Thanks, dearie!

  - name: TX_0b0a
    index: 0x0a
    text: |-
      Well, that's too bad.

  - name: TX_0b0b
    index: 0x0b
    text: |-
      Hmm...

  - name: TX_0b0c
    index: 0x0c
    text: |-
      Oh! Take this, please.\sym(0x1c)

  - name: TX_0b0d
    index: 0x0d
    text: |-
      Hello, sir, I specialize in rare oddities.

  - name: TX_0b0e
    index: 0x0e
    text: |-
      PLEASE! BUY SOMETHING!

  - name: TX_0b0f
    index: 0x0f
    text: |-
      Pardon me. I
      just thought
      you were looking.\stop
      I have a couple of swords that you might be interested in, adventurer.
      Both could substantially upgrade your strength.

  - name: TX_0b10
    index: 0x10
    text: |-
      Which \col(1)sword\col(0) would you like to buy?
        \opt()\col(1)Noble\col(0) \opt()\col(3)Great\col(0)
        \opt()Neither

  - name: TX_0b11
    index: 0x11
    text: |-
      \pos(2)What's this?
      You already have that sword? Then would you like to take a look at the other one I have?
      \opt()\col(3)Sure\col(0)
      \opt()No Thanks

  - name: TX_0b12
    index: 0x12
    text: |-
      \pos(2)That one looks about twice as powerful as your old wooden sword,
      but it looks like it can only take about \col(1)20 hits\col(0) before breaking without any buffs.\stop
      Would you like to buy it for \col(3)80 rupees\col(0)?
      \opt()Yes \opt()No

  - name: TX_0b13
    index: 0x13
    text: |-
      \pos(2)This sword is the mighty blade of old, powerful enough to seal the darkness.
      I snatched it from an worn pedestal, and the blade seems it could take \col(1)100 hits\col(0) without any buffs.
      Buy it for \col(3)400 rupees\col(0)?
      \opt()Yes \opt()No

  - name: TX_0b14
    index: 0x14
    text: |-
      \pos(2)How greedy!
      How mean! Away with you!

  - name: TX_0b15
    index: 0x15
    text: |-
      \pos(2)What are you still doing here? You already have my strongest sword!

  - name: TX_0b16
    index: 0x16
    text: |-
      \pos(2)Are you trying to cheat me? You don't have enough rupees!

  - name: TX_0b17
    index: 0x17
    text: |-
      ARGH!! What are you doing here?
      I've been wondering what my collection has been missing...

  - name: TX_0b18
    index: 0x18
    text: |-
      Wait!!!
      That \col(0x84)\item(0x04) \col(3)sword\col(0)!!!
      It would go nicely with my collection!
      Boy! Let me have that
      \col(0x84)\item(0x04) \col(3)sword\col(0)!\stop
      Give him the \col(0x84)\item(0x04)
      \col(1)Broken Sword\col(0)?
        \opt()Yes \opt()No

  - name: TX_0b19
    index: 0x19
    text: |-
      Fantastic! I...

  - name: TX_0b1a
    index: 0x1a
    text: |-
      What's this?
      It's broken?

  - name: TX_0b1b
    index: 0x1b
    text: |-
      Hyeee!
      What's the matter with you?

  - name: TX_0b1c
    index: 0x1c
    text: |-
      Just give it to me and go.
      Take this with you.

  - name: TX_0b1d
    index: 0x1d
    text: |-
      Forget it!
      You can't help!

  - name: TX_0b1e
    index: 0x1e
    text: |-
      My library is free to use, but it seems one of my books hasn't been returned.

  - name: TX_0b1f
    index: 0x1f
    text: |-
      That \col(3)salesman\col(0) must have swindled me from my \col(1)special book\col(0) on swordmanship!

  - name: TX_0b20
    index: 0x20
    text: |-
      Will you be conning me too?

  - name: TX_0b21
    index: 0x21
    text: |-
      The man seems to be fixated on the \col(0x84)\item(0x05) \col(1)Sparring Book\col(0) in your pocket...
      Give him the \col(0x84)\item(0x05)
      \col(1)Sparring Book\col(0)?
        \opt()Yes \opt()No

  - name: TX_0b22
    index: 0x22
    text: |-
      That's the one!
      What can I give you in return...?\stop
      How about this key! It leads into a vast labyrinth to the southwest of here.

  - name: TX_0b23
    index: 0x23
    text: |-
      Now I can work on getting the rest of my books back.

  - name: TX_0b24
    index: 0x24
    text: |-
      Hello, sir. Will you be lending a book out?

  - name: TX_0b25
    index: 0x25
    text: |-
      Koff!

  - name: TX_0b26
    index: 0x26
    text: |-
      ???

  - name: TX_0b27
    index: 0x27
    text: |-
      Whaa!

  - name: TX_0b28
    index: 0x28
    text: |-
      Ooo...hot!

  - name: TX_0b29
    index: 0x29
    text: |-
      Ewwww!

  - name: TX_0b2a
    index: 0x2a
    text: |-
      My head spins!

  - name: TX_0b2b
    index: 0x2b
    text: |-
      Wh-what?!?

  - name: TX_0b2c
    index: 0x2c
    text: |-
      So what kinda
      candy's never
      on time???\stop
      Choco-late!
      Isn't that a
      sweet joke!

  - name: TX_0b2d
    index: 0x2d
    text: |-
      I need something
      that will make
      people laugh. I
      wonder if a \col(1)fake
      mustache\col(0) would
      work?

  - name: TX_0b2e
    index: 0x2e
    text: |-
      I just wanna
      make people
      laugh. There's
      gotta be an easy
      way...

  - name: TX_0b2f
    index: 0x2f
    text: |-
      Give him the \col(0x84)\item(0x07)
      \col(1)Cheesy Mustache\col(0)?
        \opt()Yes \opt()No

  - name: TX_0b30
    index: 0x30
    text: |-
      What a hilarious
      \col(1)mustache\col(0)!
      It's a riot!
      OK, buddy, I'm
      gonna teach you
      the funniest gag
      I know! OK...\stop
      Here goes!

  - name: TX_0b31
    index: 0x31
    text: |-
      A performer's
      life is no
      cakewalk!

  - name: TX_0b32
    index: 0x32
    text: |-
      How do you like
      my \col(1)mustache\col(0)?

  - name: TX_0b33
    index: 0x33
    text: |-
      How I miss the
      smell and sound
      of the sea...

  - name: TX_0b34
    index: 0x34
    text: |-
      Back in my day,
      I was the best
      Zora musician.
      If I had an
      instrument, I
      could relive my
      youth.

  - name: TX_0b35
    index: 0x35
    text: |-
      Give him the \col(0x84)\item(0x0b)
      \col(1)Sea Ukulele\col(0)?
        \opt()Yes \opt()No

  - name: TX_0b36
    index: 0x36
    text: |-
      That \col(1)Ukulele\col(0) has
      the spirit of
      the sea in it!
      That smell! That
      sound! That's
      good of you to
      respect your
      elders, kids!
      I see you're on
      some adventure.
      Well I give you
      something old...
      This is the
      \col(1)Hero's Sword\col(0)
      that a great
      hero gave my
      ancestors
      long ago!

  - name: TX_0b37
    index: 0x37
    text: |-
      ...What's that?
      It's broken..?
      ...Ah-Ahem!\stop
      Ahh! Umm... What
      a great sound!

  - name: TX_0b38
    index: 0x38
    text: |-
      Why do I smell
      the sea in here?

  - name: TX_0b39
    index: 0x39
    text: |-
      Ah! What fun!
      I don't even
      want to think
      about any \col(1)Broken
      Swords\col(0), you
      know?\stop
      ...No!!!
      I mean, I have
      the power to fix
      anything, so I
      have to do it.

  - name: TX_0b3a
    index: 0x3a
    text: |-
      What a mess...\stop
      Oh! What? Do you
      need something?
        \opt()Yes \opt()No

  - name: TX_0b3b
    index: 0x3b
    text: |-
      Don't call me if
      you don't need
      me.

  - name: TX_0b3c
    index: 0x3c
    text: |-
      Oh! My dear
      mother is in
      \col(3)Holodrum\col(0)?
      That young-at-
      heart mother of
      mine is a worry!
      You've done so
      much, but can I
      make a request?
        \opt()Yes \opt()No

  - name: TX_0b3d
    index: 0x3d
    text: |-
      ???
      Silly boy...

  - name: TX_0b3e
    index: 0x3e
    text: |-
      Really? That's
      too bad...

  - name: TX_0b3f
    index: 0x3f
    text: |-
      My precious dog
      has gotten lost.
      He's somewhere
      in town, so I'd
      like you to get
      him. He's so
      delicate.
      You carry him
      properly. There
      is a huge reward
      if you find him!

  - name: TX_0b40
    index: 0x40
    text: |-
      Did you find my
      dog?

  - name: TX_0b41
    index: 0x41
    text: |-
      My precious pup!
      Where were you?
      Thank you for
      bringing him
      home safely!
      Here is your
      reward!

  - name: TX_0b42
    index: 0x42
    text: |-
      Don't forget to
      take it to the
      jeweler for
      appraisal!!!

  - name: TX_0b43
    index: 0x43
    text: |-
      Will you listen
      to my request?
        \opt()Yes \opt()No

  - name: TX_0b44
    index: 0x44
    text: |-
      Take that \col(1)ring\col(0)
      to the jeweler
      for appraisal.

  - name: TX_0b45
    index: 0x45
    text: |-
      Pah! Meat!!!

  - name:
    - TX_0b46
    - TX_0b47
    index:
    - 0x46
    - 0x47
    text: |-
      \pos(2)If \col(3)Maple\col(0) were
      here, I'd send
      her to \col(3)that labyrinth\col(0)
      for \item(0x06) \col(1)Mushrooms\col(0),
      but since she
      hasn't come
      back,
      I can't make my
      \col(1)Magic Potion\col(0)!

  - name: TX_0b48
    index: 0x48
    text: |-
      \pos(2)Sniff, sniff!!!
      That scent!!!\stop
      Ya've got a
      \item(0x06) \col(1)Mushroom\col(0)!
      I'll make it
      worth your while!
      How about it?
        \opt()OK \opt()No way

  - name: TX_0b49
    index: 0x49
    text: |-
      \pos(2)Ee, hee, hee! I
      can finally make
      my \col(1)Magic Potion\col(0).
      Guess I'll open
      the shop soon.
      How'd you get in anyway?

  - name: TX_0b4a
    index: 0x4a
    text: |-
      \pos(2)But where's that
      \col(3)Maple\col(0) wasting
      her time away?

  - name: TX_0b4b
    index: 0x4b
    text: |-
      \pos(2)Hmph! Can't
      someone give me
      a Mushroom?



- group: 0x0c
  data:
  - name: TX_0c00
    index: 0x00
    text: |-
      Did you drop a
      \col(1)Golden Bomb\col(0)? Or
      a \col(1)Silver Bomb\col(0)?\stop
       \opt()Golden \opt()Silver
       \opt()A regular one

  - name: TX_0c01
    index: 0x01
    text: |-
      ...Really?
      A \col(1)Golden Bomb\col(0)?
        \opt()Yes \opt()No

  - name: TX_0c02
    index: 0x02
    text: |-
      Really and truly
      a \col(1)Golden Bomb\col(0)???
        \opt()Yes \opt()No

  - name: TX_0c03
    index: 0x03
    text: |-
      Liar! Greed
      begets sorrow!

  - name: TX_0c04
    index: 0x04
    text: |-
      I hope you've
      learned not to
      lie.\heart

  - name: TX_0c05
    index: 0x05
    text: |-
      ...Really?
      A \col(1)Silver Bomb\col(0)?
        \opt()Yes \opt()No

  - name: TX_0c06
    index: 0x06
    text: |-
      Liar! I'm
      confiscating
      your \col(1)Bombs\col(0)!

  - name: TX_0c07
    index: 0x07
    text: |-
      You are an
      honest person.\stop
      I'll increase
      the number of
      \col(1)Bombs\col(0) you can
      carry to reward
      you.\stop
      Hee-yah!

  - name: TX_0c08
    index: 0x08
    text: |-
      You can now
      carry \num1 \col(1)Bombs\col(0).
      And I've filled
      your bag.
      Farewell...

- group: 0x0d
  data:
  - name: TX_0d00
    index: 0x00
    text: |-
      \pos(2)I am the Great
      Witch \col(3)Syrup\col(0) and
      this is my
      \col(1)Potion\col(0) shop.
      Bring me what
      you want.

  - name: TX_0d01
    index: 0x01
    text: |-
      \pos(2)\col(1)Magic Potion\col(0)
      300 Rupees each.
        \opt()OK \opt()No thanks\cmd8(0x0d)

  - name: TX_0d02
    index: 0x02
    text: |-
      \pos(2)That's \col(3)Syrup's\col(0)
      magic ointment.
      Works great when
      your hearts run
      out.

  - name: TX_0d03
    index: 0x03
    text: |-
      \pos(2)I hope you won't
      live to regret
      it! Hee, hee!

  - name: TX_0d04
    index: 0x04
    text: |-
      \pos(2)One potion
      per customer!
      Come get more if
      you run out.

  - name: TX_0d05
    index: 0x05
    text: |-
      \pos(2)\col(1)Gasha Seed\col(0)
      300 Rupees each!
        \opt()OK \opt()No thanks\cmd8(0x0e)

  - name: TX_0d06
    index: 0x06
    text: |-
      \pos(2)It's a precious
      \col(1)Gasha Seed\col(0). Just
      wait for it to
      bear fruit!

  - name: TX_0d07
    index: 0x07
    text: |-
      \pos(2)You greedy kid!
      You can't carry
      any more.
      Sorry!

  - name: TX_0d08
    index: 0x08
    text: |-
      \pos(2)I can't sell it
      to one with no
      Rupees.

  - name: TX_0d09
    index: 0x09
    text: |-
      \pos(1)Stop! Thief! You
      can't get by me!

  - name: TX_0d0a
    index: 0x0a
    text: |-
      \pos(2)\col(1)Bombchu\col(0)
      15 for 100 Rupees
        \opt()OK \opt()No thanks\cmd8(0x11)

  - name: TX_0d0b
    index: 0x0b
    text: |-
      \pos(2)We're closed!

  - name: TX_0d0c
    index: 0x0c
    text: |-
      \pos(2)This new type of
      \col(1)Bomb\col(0) runs around
      after you set
      it.

- group: 0x0e
  data:
  - name: TX_0e00
    index: 0x00
    text: |-
      Welcome, sir!
      Bring me any
      item you wish
      to purchase.

  - name: TX_0e01
    index: 0x01
    text: |-
      \col(1)Piece of Heart\col(0)\stop
        \num1 Rupees
      \jump(TX_0e2b)
    null_terminator: False

  - name: TX_0e02
    index: 0x02
    text: |-
      \col(1)3 Hearts\col(0)\stop
       \num1 Rupees
      \jump(TX_0e2b)
    null_terminator: False

  - name: TX_0e03
    index: 0x03
    text: |-
      \col(1)Wooden Shield\col(0)\stop
       \num1 Rupees
      \jump(TX_0e2b)
    null_terminator: False

  - name: TX_0e04
    index: 0x04
    text: |-
      \col(1)10 Bombs\col(0)\stop
       \num1 Rupees
      \jump(TX_0e2b)
    null_terminator: False

  - name: TX_0e05
    index: 0x05
    text: |-
      You have it. One
      more won't help.

  - name: TX_0e06
    index: 0x06
    text: |-
      You don't have
      enough Rupees.

  - name: TX_0e07
    index: 0x07
    text: |-
      Hey! Don't just
      take things!
      Thief! Give that
      back right now!

  - name: TX_0e08
    index: 0x08
    text: |-
      Welcome, sir.
      You must like
      my shop.

  - name:
    - TX_0e09
    - TX_0e0a
    index:
    - 0x09
    - 0x0a
    text: |-
      This satchel
      holds lots of
      \col(1)seeds\col(0). It's
      \num1 Rupees
      \jump(TX_0e2b)
    null_terminator: False

  - name: TX_0e0b
    index: 0x0b
    text: |-
      Oh! You don't
      have a \col(1)Satchel\col(0)!
      Then I can't
      help you!

  - name:
    - TX_0e0c
    - TX_0e0d
    index:
    - 0x0c
    - 0x0d
    text: |-
      We ran out of
      goods, so we're
      in a new line
      of business now.
      \jump(TX_0e0f)
    null_terminator: False

  - name: TX_0e0e
    index: 0x0e
    text: |-
      Welcome.\n
    null_terminator: False

  - name: TX_0e0f
    index: 0x0f
    text: |-
      One out of two
      chests will have
      treasure. You'll
      get a nice gift
      if you can open
      the right chest
      three times in
      a row!
      Each try costs
      10 Rupees.
        \opt()OK \opt()No thanks

  - name: TX_0e10
    index: 0x10
    text: |-
      OK! ...Begin!

  - name: TX_0e11
    index: 0x11
    text: |-
      I hope you'll
      come again.

  - name: TX_0e12
    index: 0x12
    text: |-
      Congratulations!
      This is your
      final chance!
      If you get this
      right, you'll
      get an awesome
      gift!
        \opt()OK \opt()No thanks

  - name: TX_0e13
    index: 0x13
    text: |-
      Feeling lucky?
      Pick your chest!

  - name: TX_0e14
    index: 0x14
    text: |-
      Oh? Then...
      \jump(TX_0e1f)
    null_terminator: False

  - name: TX_0e15
    index: 0x15
    text: |-
      Jackpot!
      Congratulations!
      This is your
      final chance! If
      you get this
      right, you'll
      get a special
      gift!
        \opt()OK \opt()No thanks

  - name: TX_0e16
    index: 0x16
    text: |-
      Congratulations!
      \jump(TX_0e1f)
    null_terminator: False

  - name: TX_0e17
    index: 0x17
    text: |-
      Too bad. Will
      you try again?
        \opt()OK \opt()No thanks

  - name: TX_0e18
    index: 0x18
    text: |-
      This time will
      be harder.

  - name: TX_0e19
    index: 0x19
    text: |-
      Sir! You haven't
      chosen yet!
      I'll only warn
      you once.

  - name: TX_0e1a
    index: 0x1a
    text: |-
      Hurry up!

  - name: TX_0e1b
    index: 0x1b
    text: |-
      \col(1)Strange Flute\col(0)\stop
       \num1 Rupees
      \jump(TX_0e2b)
    null_terminator: False

  - name:
    - TX_0e1c
    - TX_0e1d
    index:
    - 0x1c
    - 0x1d
    text: |-
      \col(1)Heart Container\col(0)\stop
      \num1 Rupees
      \jump(TX_0e2b)
    null_terminator: False

  - name:
    - TX_0e1e
    - TX_0e1f
    index:
    - 0x1e
    - 0x1f
    text: |-
      Your gift is
      \col(1)rupees\col(0), but how
      much is granted
      by your luck.

  - name: TX_0e20
    index: 0x20
    text: |-
      Welcome, sir...\stop
      to the Great Sword
      and Shield Shop.
      I'm amazed you
      found us! We're
      only found on
      this small
      island!
      Everything is
      quite expensive.\stop
      Don't let our
      secret out!

  - name: TX_0e21
    index: 0x21
    text: |-
      Oh! Is your life
      Advanced?
      My life's
      Advanced!
      From now on,
      it's Advance!

  - name:
    - TX_0e22
    - TX_0e23
    index:
    - 0x22
    - 0x23
    text: |-
      \col(1)Advance Ring\col(0)\stop
       \num1 Rupees
      \jump(TX_0e2b)
    null_terminator: False

  - name:
    - TX_0e24
    - TX_0e25
    index:
    - 0x24
    - 0x25
    text: |-
      \col(1)Magical Ring\col(0).
      What kind of
      \col(1)ring\col(0) it is
      a secret.\stop
      \num1 Rupees
      \jump(TX_0e2b)
    null_terminator: False

  - name: TX_0e26
    index: 0x26
    text: |-
      You've bought
      it all, so I'm
      closing shop.

  - name:
    - TX_0e27
    - TX_0e28
    index:
    - 0x27
    - 0x28
    text: |-
      We're not open.
      Come back later.

  - name: TX_0e29
    index: 0x29
    text: |-
      \col(1)Iron Shield\col(0)
      Takes about 20 hits without buffs.\stop
       \num1 Rupees
      \jump(TX_0e2b)
    null_terminator: False

  - name: TX_0e2a
    index: 0x2a
    text: |-
      \col(1)Mirror Shield\col(0)
      Takes about 100 hits without any buffs.\stop
       \num1 Rupees
      \jump(TX_0e2b)
    null_terminator: False

  - name: TX_0e2b
    index: 0x2b
    text: |2-
        \opt()OK \opt()No thanks\cmd8(0x0f)

  - name:
    - TX_0e2c
    - TX_0e2d
    index:
    - 0x2c
    - 0x2d
    text: |-
      This slingshot
      can shoot lots
      of \col(1)seeds\col(0). It's
       \num1 Rupees
      \jump(TX_0e2b)
    null_terminator: False

  - name: TX_0e2e
    index: 0x2e
    text: |-
      \col(1)Magic Potion\col(0).
      Can reverse the fall of a hero.
       \num1 Rupees
      \jump(TX_0e2b)
    null_terminator: False

  - name: TX_0e2f
    index: 0x2f
    text: |-
      \col(1)Noble Sword\col(0)
      Takes 20 hits without buffs.\stop
       \num1 Rupees
      \jump(TX_0e2b)
    null_terminator: False

  - name: TX_0e30
    index: 0x30
    text: |-
      \col(1)Great Sword\col(0)
      Takes 100 hits without buffs.\stop
       \num1 Rupees
      \jump(TX_0e2b)
    null_terminator: False




- group: 0x0f
  data:
  - name: TX_0f00
    index: 0x00
    text: |-
      I have in my
      backyard a tree
      that bears very
      \col(1)special seeds\col(0).
      Take as many as you need.

  - name: TX_0f01
    index: 0x01
    text: >-
      Did you push the rock near my house?
      I ask that you put it back!

      Who knows what consequences may come
      from what you've done!

  - name: TX_0f02
    index: 0x02
    text: >-
      There is a \col(1)mine\col(0) above this crag.
      Those who tried to excavate it
      soon found themselves possessed by demons
      so it was shut and the \col(1)key\col(0) locked deep in the
      \col(1)Labyrinth\col(0).

      You'd have to wait \col(1)hundreds of years\col(0)
      in order to find that key!

      But if you did find it, I guess you could
      access the mine.\stop

      But who knows what \col(3)evil spirits\col(0) lurk in there!

  - name: TX_0f03
    index: 0x03
    text: >-
      Did you find the \col(1)mine\col(0)?

      How did you survive?\stop

      What was in there?
      What sort of \col(1)treasure\col(0) did the \col(3)evil spirits\col(0) keep?

- group: 0x10
  data:
  - name: TX_1000
    index: 0x00
    text: |-
      Welcome to the Gifts of Kinomi
      Archipelago Randomizer.\stop
      Did you 
      read the FAQ?
      \opt()Yes \opt()No

  - name: TX_1001
    index: 0x01
    text: |-
      Oh, I suggest you read 
      the FAQ first. 
      \opt()Ok \opt()Where?

  - name: TX_1002
    index: 0x02
    text: |-
      It is linked in
      the setup. If
      you don't have
      it check
      tinyurl.com/
      kinomiSetup 

  - name: TX_1003
    index: 0x03
    text: |-
      How do you refill your satchel and shield
      \opt() Shop \opt() Rosa

  - name: TX_1004
    index: 0x04
    text: |-
      Wrong. Please check the FAQ, you will get stuck otherwise.

  - name: TX_1005
    index: 0x05
    text: |-
      Right! You can get out of here by warping.

  - name: TX_1006
    index: 0x06
    text: |-
      Just warp to
      the start,
      you can do it
      everywhere

  - name: TX_1007
    index: 0x07
    text: |-
      Please take
      what's in that
      chest as a thank
      you for finding me.\stop I know that 
      you may be struggling 
      to find all the checks 
      in this randomizer.\stop 
      Trust me, I know how 
      you feel. I felt the 
      same way when I first 
      played this randomizer.\stop
      I hope you can 
      find the courage to keep 
      going and finish the game.

  - name:
    - TX_1008
    - TX_1009
    index:
    - 0x08
    - 0x09
    text: |-
      I... I'm so...
      tired... No
      sleep...
      just work...
      But we're almost
      done...

  - name: TX_100a
    index: 0x0a
    text: |-
      This here, that
      there... No!
      That goes here!
      No sleep...
      My son's home
      alone... It's no
      use. What a
      horrible queen!
      (But don't
      tell anyone!)

  - name: TX_100b
    index: 0x0b
    text: |-
      My job isn't
      done! How can I
      face the Queen?
      I'll never make
      it...

  - name: TX_100c
    index: 0x0c
    text: |-
      I have been pacing around trying to figure out which stair leads to which place.
      Man this randomizer does sure get tricky sometimes. From where I came in, I am pretty sure that the stair on my left
      leads to Crown Dungeon while the one on my right leads to the remains of Moonlit Grotto.
      I am not sure if that's correct, but you may take them for yourself to find out.

  - name: TX_100d
    index: 0x0d
    text: |-
      It's dangerous
      past this point.
      There are beasts
      everywhere, and
      you can't even
      find your way to
      the top without
      getting lost!
      What's going on?

- group: 0x11
  data:
  - name: TX_1100
    index: 0x00
    text: >-
      \pos(2)Hello mister! I'm Uffie!
      This is our
      playground!

      Welcome to the
      \col(1)Forest of Time\col(0)!\stop

      Eh? Are you worried you're stuck here?

      If you can, go meet the
      kind \col(1)witch\col(0)!
      She would know how to help you!

  - name: TX_1101
    index: 0x01
    text: >-
      Hi, I'm Deffie!
      Won't you play
      hide 'n' seek?\stop

      No?\stop

      Aw!

      There is a \col(1)labyrinth\col(0) beneath
      us that hides as well.\stop

      Us fairies like to poke in and out
      of it, seeing where we'll end up!

  - name: TX_1102
    index: 0x02
    text: >-
      I'm Triffie!
      Where did you come from?\stop

      Was it from that icky \col(1)labyrinth\col(0)?

      I keep getting lost when I go in!

      The kind \col(1)witch\col(0)
      told us that she has many magical powers,
      but she sometimes likes to be left alone.

      She locked her door and I think
      the key is now hidden in the \col(1)labyrinth\col(0)!

  - name: TX_1103
    index: 0x03
    text: >-
      I'm Chloe! The kind \col(1)witch\col(0)
      to the west offers many remedies,
      but I think she's looking for a mushroom!

      But I don't know where to find one,
      except maybe in that dark \col(1)labyrinth\col(0).

  - name: TX_1104
    index: 0x04
    text: >-
      What's that, mister?
      Oh! Is that the \col(1)Cane\col(0)?\stop

      Let me have it!

      Let me have it!\stop

      I bet that would help get your through
      the \col(1)labyrinth\col(0)!

  - name: TX_1105
    index: 0x05
    text: >-
      The \col(1)labyrinth\col(0)
      has an exit all the way
      on top of the cliffs!

      I wonder what's up there...

  - name: TX_1106
    index: 0x06
    text: >-
      Do you think this
      forest will last forever?

      I hope so! It is my home!\stop

      I love playing pranks on
      my sisters and talking with
      the kind \col(1)witch\col(0)!

      She has a really sweet cucco
      in her house.

      I want to pet it.

  - name: TX_1107
    index: 0x07
    text: >-
      At the top of these cliffs,
      there is a spring that feeds the whole forest.

      I just can't imagine if the waters
      stopped flowing!

      Oh it would be horrible!

  - name: TX_1108
    index: 0x08
    text: >-
      Ooh, ooh!
      Where did you get those?

      I want to play with those \col(1)gloves\col(0)!
      They look like they could lift many heavy objects!

      But what would you need those for?
      And where did they come from?

  - name: TX_1109
    index: 0x09
    text: >-
      I made it up here, mister!
      The spring is just as beautiful
      as I imagined!

      Have you met the fairy of the spring yet?

  - name: TX_110a
    index: 0x0a
    text: >-
      The kind \col(1)witch\col(0)
      told us that there is a
      cursed \col(1)mine\col(0)
      connected to the \col(1)labyrinth\col(0)
      even higher up on these cliffs.

      It was locked away with a key
      that \col(1)won't be found for
      centuries\col(0)!

      Oh, how I wish to never go there!
      Imagine the horrible monsters that may
      attack us!

  - name: TX_110b
    index: 0x0b
    text: >-
      I can't believe the waters to our
      beautiful forest start from this
      itty bitty spring!

  - name: TX_110c
    index: 0x0c
    text: >-
      Are you going up to the
      cursed \col(1)mine\col(0)?

      You are now our friend,
      so please be careful!

      The kind \col(1)witch\col(0)
      told us to avoid entering
      the \col(1)labyrinth\col(0) up here near
      the spring if we didn't want
      to get caught near the \col(1)mine\col(0).

  - name: TX_110d
    index: 0x0d
    text: >-
      Be careful up there, mister!

      My sister, Uffie, is really concerned about your safety!

  - name: TX_110e
    index: 0x0e
    text: >-
      Mister, you're back!\stop

      Oh, I'm so happy! We should celebrate!

      What did you find in the mine?

  - name: TX_110f
    index: 0x0f
    text: >-
      Uffie and Triffie couldn't stop
      worrying about you!

      You won't be going back there, right?\stop

      A beautiful princess had been taken there?

      Oh I bet you vanquished those monsters real good, mister!

  - name: TX_1110
    index: 0x10
    text: >-
      I'm happy you're back!

      But about the spring...
      Do you think we could make sure
      the water always gets to the forest?

      I wonder if we could do something about that big \col(1)rock\col(0) near the bank?

  - name: TX_1111
    index: 0x11
    text: >-
      Pssst, mister!

      Is this where you are from?
      Oh, it is very pretty!

      I'll tell my sisters all about this!

  - name: TX_1112
    index: 0x12
    text: |-
      \pos(2)The forest is
      at peace again,
      so come play
      with us!

  - name: TX_1113
    index: 0x13
    text: |-
      \pos(2)Maybe I'll tease
      you again...

  - name: TX_1114
    index: 0x14
    text: |-
      \pos(2)The bad guys
      run away when
      we tease them.

  - name:
    - TX_1115
    - TX_1116
    - TX_1117
    - TX_1118
    - TX_1119
    - TX_111a
    - TX_111b
    - TX_111c
    - TX_111d
    - TX_111e
    - TX_111f
    index:
    - 0x15
    - 0x16
    - 0x17
    - 0x18
    - 0x19
    - 0x1a
    - 0x1b
    - 0x1c
    - 0x1d
    - 0x1e
    - 0x1f
    text: |-
      \pos(2)Next time the
      forest maze will
      be harder!

  - name: TX_1120
    index: 0x20
    text: |-
      Mister! I
      found you!

  - name: TX_1121
    index: 0x21
    text: |-
      Listen! It's a
      mess!\n
    null_terminator: False

  - name: TX_1122
    index: 0x22
    text: |-
      \call(0xff)
      got lost in our
      forest and can't
      get out! We were
      playin' a little
      trick...
      But now it'll
      never get out!
      Can you help us
      find it? Do you
      get our problem?
        \opt()Yes \opt()No

  - name: TX_1123
    index: 0x23
    text: |-
      An animal with
      gloves on

  - name: TX_1124
    index: 0x24
    text: |-
      A red, lizard-
      lookin' animal

  - name: TX_1125
    index: 0x25
    text: |-
      A big, winged,
      bearlike animal

  - name: TX_1126
    index: 0x26
    text: |-
      Wait, Mister!
      This way!

  - name: TX_1127
    index: 0x27
    text: |-
      It's deep in
      the woods.

  - name: TX_1128
    index: 0x28
    text: |-
      We don't even
      know where it
      is.

  - name: TX_1129
    index: 0x29
    text: |-
      We didn't mean
      to be such
      trouble. Really!

  - name: TX_112a
    index: 0x2a
    text: |-
      Mister! You
      found it! OK.
      We'll take you
      to the edge of
      the forest.\stop
      Yah!

  - name: TX_112b
    index: 0x2b
    text: |-
      You won't get
      lost here!

  - name: TX_112c
    index: 0x2c
    text: |-
      Sorry! We didn't
      mean it! But
      seeking is more
      fun than hiding!

  - name: TX_112d
    index: 0x2d
    text: |-
      Really! I want
      to do it again!

  - name: TX_112e
    index: 0x2e
    text: |-
      Next time will
      be harder!

  - name: TX_112f
    index: 0x2f
    text: |-
      Come play with
      us again, OK?
      Goodbye!

  - name: TX_1130
    index: 0x30
    text: |-
      Hurry! I'll wait
      at the forest
      entrance south
      of here!

  - name: TX_1131
    index: 0x31
    text: |-
      \call(0xff)

  - name: TX_1132
    index: 0x32
    text: |-
      \call(0xfe)

  - name: TX_1133
    index: 0x33
    text: |-
      \sfx(0xc3)Umm...this
      leads that way,
      that goes...
      Ugh! I don't
      know! What's
      going on?

  - name: TX_1134
    index: 0x34
    text: |-
      \sfx(0xc3)You found my
      gloves, right...

  - name: TX_1135
    index: 0x35
    text: |-
      \sfx(0xc3)\Link! Why
      are you here?

  - name: TX_1136
    index: 0x36
    text: |-
      \sfx(0xc3)I still don't
      get it, but you
      helped me out.
      I'm \col(3)Ricky\col(0).
      Did you remember
      it? Say, do I
      know your name?\stop
      \Link? Cool!\stop
      Thanks for your
      help, \Link!
      Thanks a lot! I
      want to give
      you something...
      Hey! That's a
      weird \col(1)flute\col(0).
      I know!\stop
      \jump(TX_1138)
    null_terminator: False

  - name: TX_1137
    index: 0x37
    text: |-
      \sfx(0xc3)I still don't
      get it, but you
      helped me out,
      \Link!
      You really are
      my best friend!\stop
      I want to go
      adventuring with
      you like we did
      in \col(3)Holodrum\col(0)!
      I know! Take
      this \col(1)flute\col(0)!\n
    null_terminator: False

  - name: TX_1138
    index: 0x38
    text: |-
      Play that \col(1)flute\col(0)
      anytime you need
      my help. If I
      hear the \col(1)flute\col(0),
      I'll come find
      you!

  - name: TX_1139
    index: 0x39
    text: |-
      \sfx(0xc3)You want to go
      north, right?
      I'll take you!
      Hop in my pouch!

  - name: TX_113a
    index: 0x3a
    text: |-
      \sfx(0xc4)Dee? Everyplace
      looks the same.
      How can \col(3)Dimitri\col(0)
      get out?

  - name: TX_113b
    index: 0x3b
    text: |-
      \sfx(0xc4)Dee! You helped
      \col(3)Dimitri\col(0) on the
      island. You have
      good timing!

  - name: TX_113c
    index: 0x3c
    text: |-
      \sfx(0xc4)\Link!
      You have good
      timing! How did
      you get here?

  - name: TX_113d
    index: 0x3d
    text: |-
      \sfx(0xc4)I'm so happy
      to leave! You
      helped me twice.
      Who are you?\stop
      \Link? That's
      a weird name.\stop
      But starting
      today, \Link
      is my friend.
      Hey! Nice \col(1)flute\col(0),
      \Link!
      \jump(TX_113f)
    null_terminator: False

  - name: TX_113e
    index: 0x3e
    text: |-
      \sfx(0xc4)Out! I'm out!
      Thank you,
      \Link! What
      a good friend!\stop
      You helped me,
      \Link, so
      I help \Link.
      I learned in
      \col(3)Holodrum\col(0)--
      Me and \Link
      are unstoppable!
      Take this
      \col(1)flute\col(0)!\n
    null_terminator: False

  - name: TX_113f
    index: 0x3f
    text: |-
      Play that \col(1)flute\col(0).
      I will come if
      I hear the
      \col(1)flute\col(0).

  - name: TX_1140
    index: 0x40
    text: |-
      Go north?
      Get on my back.

  - name: TX_1141
    index: 0x41
    text: |-
      \sfx(0xc5)I'm back in the
      same spot. I'm
      so hungry. I
      can't move...

  - name: TX_1142
    index: 0x42
    text: |-
      \sfx(0xc5)Oh! You chased
      away ghosts...

  - name: TX_1143
    index: 0x43
    text: |-
      \sfx(0xc5)\Link!
      Are you lost,
      too?

  - name: TX_1144
    index: 0x44
    text: |-
      \sfx(0xc5)Thank you for
      helping me out.
      You haven't told
      me your name.
      Please tell me.\stop
      \Link...
      That's easy to
      remember. First
      the graveyard,
      now this...
      You are always
      helping me out,
      \Link. I must
      help you in your
      adventures, too,
      \Link, so
      take this \col(1)flute\col(0).
      \jump(TX_1146)
    null_terminator: False

  - name: TX_1145
    index: 0x45
    text: |-
      \sfx(0xc5)Thank you,
      \Link. I thought
      I would never
      get out.\stop
      You're always
      helping me out,
      \Link. I must
      help you in your
      adventures, too.
      Maybe I can help
      like I did in
      \col(3)Holodrum\col(0), so
      take this \col(1)flute\col(0).\n
    null_terminator: False

  - name: TX_1146
    index: 0x46
    text: |-
      Play that \col(1)flute\col(0)
      when you need
      me. I'll come if
      I hear it.

  - name: TX_1147
    index: 0x47
    text: |-
      \sfx(0xc5)You want to go
      north, right.
      OK, climb onto
      my back.

  - name: TX_1148
    index: 0x48
    text: |-
      Hi! Are you
      looking for me?
        \opt()Yes \opt()No

  - name: TX_1149
    index: 0x49
    text: |-
      Oh, really...

  - name: TX_114a
    index: 0x4a
    text: |-
      That's the
      \col(1)secret\col(0) we taught
      to the girl from
      \col(3)Holodrum\col(0)!\stop
      We'll give you
      some happiness,
      too!

  - name: TX_114b
    index: 0x4b
    text: |-
      What? A new
      trick?

  - name:
    - TX_114c
    - TX_114d
    index:
    - 0x4c
    - 0x4d
    text: |-
      Here's the
      \col(1)secret\col(0) to being
      happy in
      \col(3)Holodrum\col(0):\stop
      \secret1\stop
      If you forget
      the \col(1)secret\col(0), just
      come ask!

- group: 0x12
  data:
  - name: TX_1200
    index: 0x00
    text: |-
      There was a loud
      sound far off,
      like a magic
      barrier being
      weakened!

  - name: TX_1201
    index: 0x01
    text: >-
      It sounds like
      the magic barrier
      was detroyed!

      \col(3)Winter\col(0) has
      returned to the
      \col(1)north\col(0) stump!

  - name: TX_1202
    index: 0x02
    text: |-
      \pos(2)Bwee! This is
      the guy \col(3)Veran\col(0)
      was talking
      about! Get 'im!

  - name: TX_1203
    index: 0x03
    text: |-
      \pos(2)What's with you?
      Keep clear!

  - name: TX_1204
    index: 0x04
    text: |-
      Heh heh! This
      guy's shocked!

  - name: TX_1205
    index: 0x05
    text: |-
      Let's shock 'im
      some more!

  - name: TX_1206
    index: 0x06
    text: |-
      Bwee! Why's the
      weirdo here!
      What are you
      lookin' at?

  - name: TX_1207
    index: 0x07
    text: |-
      We'll shock you,
      too!

  - name: TX_1208
    index: 0x08
    text: |-
      You heard water
      going out.

  - name: TX_1209
    index: 0x09
    text: |-
      You heard water
      coming in.

  - name: TX_120a
    index: 0x0a
    text: |-
      Show your
      Courage, Wisdom
      and Power.
      The road to the
      past shall then
      open.

  - name: TX_120b
    index: 0x0b
    text: |-
      \right4 \up2 \right2

  - name: TX_120c
    index: 0x0c
    text: |-
      \up2 \left1 \up2 \right1 \up1

  - name: TX_120d
    index: 0x0d
    text: |-
      \left2 \up1 \left3

  - name: TX_120e
    index: 0x0e
    text: |-
      \down1 \left3 \up1 \left3

  - name: TX_120f
    index: 0x0f
    text: |-
      \down1 \right1 \down2 \left2 \down3

  - name: TX_1210
    index: 0x10
    text: |-
      \right1 \down1 \right2 \up1 \right1
      \up1 \right2

  - name: TX_1211
    index: 0x11
    text: |-
      It's a podium
      for holding a
      \col(1)book\col(0).

  - name: TX_1212
    index: 0x12
    text: |-
      \call(TX_1211)
      Place the \col(1)Book
      of Seals\col(0) here?
        \opt()Yes \opt()No

  - name: TX_1213
    index: 0x13
    text: |-
      \pos(2)Accept our
      quest, hero!

  - name: TX_1214
    index: 0x14
    text: |-
      It sounds like there was a massive explosion,
      opening a new path!

- group: 0x13
  data:
  - name: TX_1300
    index: 0x00
    text: |-
      \pos(2)What have you
      brought before
      me?

  - name: TX_1301
    index: 0x01
    text: |-
      \pos(2)\col(1)Mystery Seeds\col(0)!\stop
      \col(3)Nayru\col(0) desires
      \col(1)Mystery Seeds\col(0)
      more than
      anything else!
      She will be most
      pleased!
      By what name do
      you go, boy?\stop
      ...\Link? I
      offer a reward,
      \Link.

  - name: TX_1302
    index: 0x02
    text: |-
      \pos(2)Bring it here...

  - name: TX_1303
    index: 0x03
    text: |-
      \pos(2)\Link, this
      is your reward.
      Take it with
      great thanks.

  - name: TX_1304
    index: 0x04
    text: |-
      \pos(2)My palace is
      very large--you
      will not be able
      to find the way
      out alone.

  - name: TX_1305
    index: 0x05
    text: |-
      \pos(2)Will that boy be
      able to return?

  - name: TX_1306
    index: 0x06
    text: |-
      \pos(2)Oh... I shall be
      known as a
      great queen...\n
    null_terminator: False

  - name: TX_1307
    index: 0x07
    text: |-
      \pos(2)\col(3)Nayru\col(0), Oracle of
      Ages, give me an
      endless day, so
      the people can
      work without
      stopping to
      rest! Young and
      old alike will
      work toward
      my ends!

  - name: TX_1308
    index: 0x08
    text: |-
      \pos(0)What is this
      commotion?!?

  - name: TX_1309
    index: 0x09
    text: |-
      \pos(0)Are you truly
      \col(3)Nayru\col(0)?
      You seem
      different...
      You seem nice...

  - name: TX_130a
    index: 0x0a
    text: |-
      \pos(0)Heeee!
      What are you
      doing? Catch
      them! Now!

  - name: TX_130b
    index: 0x0b
    text: |-
      \pos(0)Ah hah hah hah!\stop
      The \col(3)Black Tower\col(0)
      is finally
      complete! Powers
      of darkness,
      come to me!

  - name: TX_130c
    index: 0x0c
    text: |-
      \pos(0)Ahh! The powers
      of darkness flow
      through me! The
      powers swell!
      Hah! Even
      without the
      powers of
      young \col(3)Nayru\col(0),
      I can stop time!
      Now true
      darkness comes!
      The sorrow of
      people shall be
      delivered to me,
      lighting my
      Flame of Sorrow!
      Ah hah hah hah!

  - name: TX_130d
    index: 0x0d
    text: |-
      \pos(0)None can stop
      \col(3)Veran\col(0) now! You
      can only wait
      for the Flame of
      Sorrow to light!
      What a view! All
      humanity can
      feel the sorrow!
      Ah hah hah hah!

  - name: TX_130e
    index: 0x0e
    text: |-
      \pos(2)\Link!
      You are safe!
      I just called my
      knights from the
      palace to help
      since you were
      locked inside
      the tower...

  - name: TX_130f
    index: 0x0f
    text: |-
      \pos(2)\Link, thanks
      to you, everyone
      is back to
      normal.
      I thank you.

  - name: TX_1310
    index: 0x10
    text: |-
      \pos(2)\col(3)Ralph\col(0) is my
      grandson's
      grandson's
      ...grandson!
      You, too, have
      great courage.
      You shall be the
      pride of my
      people.

  - name: TX_1311
    index: 0x11
    text: |-
      \pos(2)How rude! I
      am still young!
      Don't call me
      granny!

  - name: TX_1312
    index: 0x12
    text: |-
      \pos(3)All is well
      in this age!
      You may return
      without worry.
      We shall never
      forget you.

  - name: TX_1313
    index: 0x13
    text: |-
      \pos(2)You must be...
      \col(3)Ralph\col(0), of \col(3)Ambi's\col(0)
      line...\stop
      Hah! I have no
      time for such a
      small fry! Be
      gone with you!\stop
      Or do you mean
      to fight me?
      Don't make me
      laugh!\stop
      Fool! This is
      the body of
      \col(3)Ambi's\col(0), your
      ancestor. If you
      slay me, you
      will vanish from
      this world!\stop
      Do you still
      wish to fight?

  - name: TX_1314
    index: 0x14
    text: |-
      \pos(2)Oh, \Link!\stop
      Because of my
      kindness, young
      \col(3)Ralph\col(0) still
      lives. But you
      still attack me!
      If you damage
      \col(3)Ambi's\col(0) body,
      \col(3)Ralph\col(0) will
      vanish.\stop
      You can't intend
      to end your dear
      friend's life by
      your own hand!
      Hah hah hah hah!

  - name: TX_1315
    index: 0x15
    text: |-
      \pos(1)You come despite
      my warning? Do
      you not value
      life? Or are you
      a mere fool?
      Regardless, it
      won't be easy!
      I'll teach you
      your place!\stop
      I'll not be as
      kind as before!

  - name: TX_1316
    index: 0x16
    text: |-
      \col(3)Ambi's Tower\col(0)
      will soon be
      complete!

  - name: TX_1317
    index: 0x17
    text: |-
      Once Ambi's
      Tower is done,
      history shall
      remember me as
      the greatest of
      queens!

  - name: TX_1318
    index: 0x18
    text: |-
      \Link! What
      happened? I feel
      as though I've
      been caught in a
      bad dream... As
      if pure evil had
      inhabited my
      body...

  - name: TX_1319
    index: 0x19
    text: |-
      What? I must
      leave at once! I
      see worry in
      your eyes. I
      should have done
      as I was told...

  - name: TX_131a
    index: 0x1a
    text: |-
      Worry not about
      the town.
      \col(3)Ralph\col(0) and I are
      here. You must
      focus on saving
      \col(3)Princess Zelda\col(0).

- group: 0x14
  data:
  - name: TX_1400
    index: 0x00
    text: |-
      This is \col(3)Lynna
      Village\col(0)...
      Hwahhhh! Oh!
      Excuse me! We
      haven't had any
      nights for a few
      days now.

  - name: TX_1401
    index: 0x01
    text: |-
      Everyone in the
      village is so
      sleepy.

  - name:
    - TX_1402
    - TX_1408
    - TX_1409
    - TX_140a
    - TX_140b
    - TX_140c
    - TX_140d
    - TX_140e
    - TX_140f
    - TX_1410
    - TX_1411
    - TX_1412
    - TX_1413
    index:
    - 0x02
    - 0x08
    - 0x09
    - 0x0a
    - 0x0b
    - 0x0c
    - 0x0d
    - 0x0e
    - 0x0f
    - 0x10
    - 0x11
    - 0x12
    - 0x13
    text: |-
      Is it morning?
      Noon? Or night?
      I have no idea
      anymore.

  - name: TX_1403
    index: 0x03
    text: |-
      There's some
      ruckus over at
      \col(3)Ambi's Palace\col(0).

  - name: TX_1404
    index: 0x04
    text: |-
      This is it for
      this world. Even
      my flowing tears
      have dried up.

  - name: TX_1405
    index: 0x05
    text: |-
      Ohhh... My hope,
      my dreams...
      All is lost...

  - name: TX_1406
    index: 0x06
    text: |-
      They've taken
      \col(3)Princess Zelda\col(0)?
      This is the end!

  - name: TX_1407
    index: 0x07
    text: |-
      Welcome to
      \col(3)Lynna\col(0), Village
      of Time!

  - name: TX_1414
    index: 0x14
    text: |-
      I used to throw
      myself at
      anything that
      came along until
      only recently...
      It's like a hole
      just opened up
      in my heart.

  - name:
    - TX_1415
    - TX_1416
    index:
    - 0x15
    - 0x16
    text: |-
      I stopped \col(3)Ralph\col(0)
      as he went into
      the tower and he
      said, "I don't
      care what
      happens to me!"
      He's like the
      rest of us.
      Nothing matters
      anymore.

  - name: TX_1417
    index: 0x17
    text: |-
      Good morning!
      Good day!
      Good evening!
      Good night!
      Ahh! I love
      greetings!

  - name:
    - TX_1418
    - TX_1419
    - TX_141a
    - TX_141b
    - TX_141c
    - TX_141d
    - TX_141e
    - TX_141f
    index:
    - 0x18
    - 0x19
    - 0x1a
    - 0x1b
    - 0x1c
    - 0x1d
    - 0x1e
    - 0x1f
    text: |-
      I thought
      nothing changed
      when \col(3)Princess
      Zelda\col(0) was here,
      but now that
      she's gone, it's
      like a hole has
      opened in my
      heart.

  - name: TX_1420
    index: 0x20
    text: |-
      The \col(3)Maku Tree\col(0)
      stands at the
      far end of this
      cave.

  - name: TX_1421
    index: 0x21
    text: |-
      My sense of time
      is all out of
      whack. I wonder
      why...

  - name: TX_1422
    index: 0x22
    text: |-
      \col(3)Nayru\col(0), the
      Oracle of Ages,
      has returned?!?
      Hooray!

  - name: TX_1423
    index: 0x23
    text: |-
      Even though
      \col(3)Nayru\col(0) came back,
      the tower still
      grows! It's a
      bad sign.

  - name: TX_1424
    index: 0x24
    text: |-
      I sense mystical
      power in the
      \col(3)Maku Tree\col(0).

  - name:
    - TX_1425
    - TX_1426
    - TX_1427
    - TX_1428
    - TX_1429
    - TX_142a
    - TX_142b
    - TX_142c
    - TX_142d
    - TX_142e
    - TX_142f
    index:
    - 0x25
    - 0x26
    - 0x27
    - 0x28
    - 0x29
    - 0x2a
    - 0x2b
    - 0x2c
    - 0x2d
    - 0x2e
    - 0x2f
    text: |-
      The \col(3)Maku Tree\col(0)
      has been very
      happy lately,
      hasn't she,
      heartbreaker!

  - name: TX_1430
    index: 0x30
    text: |-
      That joke goes
      against our
      aesthetics,
      ya know...

  - name:
    - TX_1431
    - TX_1432
    - TX_1433
    index:
    - 0x31
    - 0x32
    - 0x33
    text: |-
      We can't do this
      anymore!
      Off with ya!!!

  - name: TX_1434
    index: 0x34
    text: |-
      So, what's with
      this gloomy
      uncertainty,
      anyway?

  - name:
    - TX_1435
    - TX_1436
    - TX_1437
    - TX_1438
    - TX_1439
    - TX_143a
    - TX_143b
    - TX_143c
    - TX_143d
    - TX_143e
    - TX_143f
    - TX_1440
    index:
    - 0x35
    - 0x36
    - 0x37
    - 0x38
    - 0x39
    - 0x3a
    - 0x3b
    - 0x3c
    - 0x3d
    - 0x3e
    - 0x3f
    - 0x40
    text: |-
      I'd be careful wandering around this villa further than the main halls!

  - name: TX_1441
    index: 0x41
    text: |-
      There's no going
      past this point.
      Nothing up there
      is complete, so
      there's no
      entry. Now get!

  - name: TX_1442
    index: 0x42
    text: |-
      The village is
      happy to have
      the \col(1)oracles\col(0) here
      for their birth-
      days!\stop
      The \col(2)princess\col(0)'
      villa just north
      of here is large
      and beautiful!
      Gotta stick with
      the kids today!
      Hey! Nice one!

  - name: TX_1443
    index: 0x43
    text: >-
      I'm so happy that Zelda has returned safely!
      It was thanks to you and the power of the oracles.

      Now I can keep playing catch with
      my son all day long!

      Hey! Nice one!!

  - name:
    - TX_1444
    index:
    - 0x44
    text: >-
      I like when Zelda and the oracles visit.
      There's always something to do!

      But I'm stuck in here...

  - name:
    - TX_1445
    index:
    - 0x45
    text: >-
     My mom keeps telling me to stay
     inside or else I'm going to
     be attacked by monsters!

     But I don't want to stay in here!
     There's so much to see outside!

     Could you tell her that it's fine for me
     to go out?

     I want to adventure like you!

  - name:
    - TX_1446
    index:
    - 0x46
    text: >-
      Did you talk with my mom yet?

      She's so controlling!

  - name:
    - TX_1447
    index:
    - 0x47
    text: >-
      My mom says it's okay to
      go out now.

      I'm not sure if you
      said anything to her,
      but thank you if you did!

  - name:
    - TX_1448
    index:
    - 0x48
    text: >-
      I wish my brother did
      more than play catch
      with his son all day!

      He doesn't go out of the
      town like I do!

      Isn't this a great view?

  - name:
    - TX_1449
    index:
    - 0x49
    text: >-
      The oracles don't come
      often, but it's nice
      when they do!

      I think I'd really like
      to meet \col(1)Din\col(0)
      if I can!

      Is she as pretty as
      they say, \Link?

  - name:
    - TX_144a
    index:
    - 0x4a
    text: >-
      I don't think my brother
      knows how to have as much fun
      as me!
      I've seen the cliffs of
      Jiku and plains of Daichi
      while he just sits at home
      with his kid.

      \Link, what did you think of the lands
      outside our village?

  - name:
    - TX_144b
    index:
    - 0x4b
    text: >-
      Hooray the princess is saved!
      Thank you, \Link!

      This is a great party too!

- group: 0x15
  data:
  - name: TX_1500
    index: 0x00
    text: |-
      We're glad you were also able to make it, \Link! Welcome to our small village.

  - name: TX_1501
    index: 0x01
    text: |-
      My husband was
      sent to work at
      the \col(3)Black Tower\col(0).
      I may never see
      him again.

  - name: TX_1502
    index: 0x02
    text: |-
      Bad-mouthing the
      Queen too much
      gets you sent to
      prison. She's
      so harsh lately.

  - name: TX_1503
    index: 0x03
    text: |-
      \col(3)Queen Ambi\col(0) seems
      like a different
      person now. She
      always seems
      nervous.

  - name: TX_1504
    index: 0x04
    text: |-
      Strange things
      are happening
      all around.

  - name:
    - TX_1505
    - TX_1506
    index:
    - 0x05
    - 0x06
    text: |-
      I have to do all
      the things I
      want to before
      the birthday
      party!

  - name: TX_1507
    index: 0x07
    text: |-
      The Queen is
      nice again, just
      like before!

  - name:
    - TX_1508
    - TX_1509
    - TX_150a
    - TX_150b
    - TX_150c
    - TX_150d
    - TX_150e
    - TX_150f
    index:
    - 0x08
    - 0x09
    - 0x0a
    - 0x0b
    - 0x0c
    - 0x0d
    - 0x0e
    - 0x0f
    text: |-
      I miss the old,
      peaceful days...

  - name: TX_1510
    index: 0x10
    text: |-
      \col(3)Queen Ambi\col(0) had a
      boyfriend--a
      seafaring man.
      But he set sail
      one day and
      never came back.
      She's building a
      tall tower so
      she can search
      the lands for
      any sign of his
      return.
      It's called
      \col(3)Ambi's Tower\col(0).
      It was a
      touching tale...

  - name: TX_1511
    index: 0x11
    text: |-
      There are few
      who still call
      it \col(3)Ambi's Tower\col(0).
      Now everyone
      calls it the
      \col(3)Black Tower\col(0).

  - name: TX_1512
    index: 0x12
    text: |-
      I don't know if
      the bad one is
      \col(3)Queen Ambi\col(0) or
      that girl called
      \col(3)Nayru\col(0). What do
      you think?

  - name:
    - TX_1513
    - TX_1514
    index:
    - 0x13
    - 0x14
    text: |-
      I was smitten by
      \col(3)Ralph's\col(0) face
      when he thought
      of \col(3)Nayru\col(0). He
      looked so
      romantic.\heart

  - name:
    - TX_1515
    - TX_1516
    - TX_1517
    index:
    - 0x15
    - 0x16
    - 0x17
    text: |-
      \col(3)Ralph\col(0) hasn't
      come back...
      Umm, not that it
      matters.

  - name:
    - TX_1518
    - TX_1519
    - TX_151a
    - TX_151b
    - TX_151c
    - TX_151d
    - TX_151e
    - TX_151f
    index:
    - 0x18
    - 0x19
    - 0x1a
    - 0x1b
    - 0x1c
    - 0x1d
    - 0x1e
    - 0x1f
    text: |-
      I feel better
      now that I know
      \col(3)Queen Ambi\col(0)
      isn't evil, but
      what will happen
      to \col(3)Princess
      Zelda\col(0)?

  - name: TX_1520
    index: 0x20
    text: >-
      It's nice when Zelda comes to visit.
      Her parties are always fun!

  - name: TX_1521
    index: 0x21
    text: >-
      I live with my son here in town.
      He hopes to someday adventure out,
      but I hope he doesn't.\stop
      It's too dangerous!!\stop
      \Link, would you put some sense in him?

  - name: TX_1522
    index: 0x22
    text: >-
      Did you talk with my son?
      What did he say?

  - name: TX_1523
    index: 0x23
    text: >-
      I've talked with my son,
      and made sure he understands the dangers.

      I don't think I could keep him from
      going out like you do, \Link,
      but I hope he just stays safe.

  - name: TX_1524
    index: 0x24
    text: >-
      I'm so listless.

      I don't feel

      like doing

      anything.

      When is the party going to start?

  - name: TX_1525
    index: 0x25
    text: >-
      Mom says that we should get ready for the party.
      I wish it were my birthday!

      What makes the oracles so special?

  - name: TX_1526
    index: 0x26
    text: >-
      I met \col(3)Nayru\col(0).
      She seems really cool!

      I hope to sing like her someday.

  - name: TX_1527
    index: 0x27
    text: |-
      I'm so happy everything is okay!
      Isn't \col(3)Nayru\col(0) amazing?

  - name: TX_1528
    index: 0x28
    text: >- 
      My husband works in the
      \col(1)villa\col(0) as a guard,
      but I rarely see him except for
      late at night!

      He tells me that no one
      comes to tell him that his
      shift is over, but I don't
      know if I believe him.

      What sort of man doesn't
      \col(1)keep time\col(0) while
      on the clock?

  - name: TX_1529
    index: 0x29
    text: >- 
      I saw a girl flying around
      on a broom.

      It seemed like she was looking for something,
      but I don't know what!

      I hope she found it. I remember
      when I had a \col(1)doll\col(0)
      when I was younger.

      Once, I had lost it. I didn't even want
      to eat or sleep until I found it!

- group: 0x16
  data:
  - name: TX_1600
    index: 0x00
    text: |-
      The village is
      full of excess
      dirt from the
      tower. There's
      no room to walk,
      and any tools we
      could use to
      clear a path are
      being used for
      construction.

  - name: TX_1601
    index: 0x01
    text: |-
      All the men have
      been hauled off
      to build the
      tower. Only us
      old folk remain.

  - name:
    - TX_1602
    - TX_1603
    index:
    - 0x02
    - 0x03
    text: |-
      The Oracle of
      Ages who wields
      power over time
      lives somewhere
      in this land. I
      wonder if she
      hasn't been
      feeling well
      lately.

  - name: TX_1604
    index: 0x04
    text: |-
      What will happen
      to this world?

  - name:
    - TX_1605
    - TX_1606
    index:
    - 0x05
    - 0x06
    text: |-
      Some loudmouth
      named \col(3)Ralph\col(0)
      just ran into
      the \col(3)Black Tower\col(0).

  - name: TX_1607
    index: 0x07
    text: |-
      My son returned
      from the tower!
      But then he went
      right back out!
      He's such an
      anxious child!

  - name: TX_1608
    index: 0x08
    text: |-
      Someone washed
      ashore down
      south. It was a
      very sub-rosan
      fellow.

  - name: TX_1609
    index: 0x09
    text: |-
      I have no hope
      left. All I can
      do is quietly
      await the end...

  - name:
    - TX_160a
    - TX_160b
    - TX_160c
    - TX_160d
    - TX_160e
    - TX_160f
    index:
    - 0x0a
    - 0x0b
    - 0x0c
    - 0x0d
    - 0x0e
    - 0x0f
    text: |-
      Hmph! I guess
      it's not time
      for me to go
      yet!

  - name: TX_1610
    index: 0x10
    text: |-
      'ey, watch i'!
      My store 'oom i' full o' e'plosi'es. Tread ligh'ly!\stop
      Wha'?
      Ya wan' some?
      Go fin' yer own! Git!

  - name: TX_1611
    index: 0x11
    text: |-
      Wha's tha'? Ya foun' a ba'door to my store 'oom?
      Prepos'rous! 'ose ain't my bombs!

  - name: TX_1612
    index: 0x12
    text: |-
      'm glad 'a be 'ere to enjoy the fes'ivi'ies.

  - name: TX_1613
    index: 0x13
    text: |-
      'e 'rinces' 'as 'een ki'na't!!

  - name: TX_1614
    index: 0x14
    text: |-
      'm glad 'a be 'ere to enjoy the fes'ivi'ies.
      'y w'f' be 'ere too!

      'a'nt' Din a b'ty?

  - name:
    - TX_1615
    - TX_1616
    - TX_1617
    - TX_1618
    - TX_1619
    - TX_161a
    - TX_161b
    - TX_161c
    - TX_161d
    - TX_161e
    - TX_161f
    index:
    - 0x15
    - 0x16
    - 0x17
    - 0x18
    - 0x19
    - 0x1a
    - 0x1b
    - 0x1c
    - 0x1d
    - 0x1e
    - 0x1f
    text: |-
      This is \col(3)Lynna
      City\col(0). It's the
      city where time
      runs on without
      end!

  - name: TX_1620
    index: 0x20
    text: |-
      What did the
      Queen want?
      Puzzle Seeds?
      Enigma Seeds?
      It's a mystery
      to me!

  - name: TX_1621
    index: 0x21
    text: |-
      That's it! The
      Queen wanted
      them Puzzle
      Seeds! I bet
      she was happy!

  - name: TX_1622
    index: 0x22
    text: |-
      Another one?!?\stop
      First, that guy
      with the weird
      hat appears,
      then you...
      Ever since that
      girl \col(3)Nayru\col(0) came,
      there's been all
      sorts o' weird
      goings on!

- group: 0x17
  data:
  - name:
    - TX_1700
    - TX_1701
    index:
    - 0x00
    - 0x01
    text: |-
      Do you know of
      the \col(3)Tokay\col(0)? I
      hear there's an
      island full of
      them across the
      sea!

  - name: TX_1702
    index: 0x02
    text: |-
      That \col(3)Nayru\col(0) has
      tricked \col(3)Queen
      Ambi\col(0), right?
      I knew it!

  - name: TX_1703
    index: 0x03
    text: |-
      Just when \col(3)Nayru\col(0)
      vanishes, the
      Queen herself
      starts acting
      strange!

  - name:
    - TX_1704
    - TX_1705
    - TX_1706
    index:
    - 0x04
    - 0x05
    - 0x06
    text: |-
      The Queen seems
      to be a totally
      different
      person.

  - name:
    - TX_1707
    - TX_1708
    - TX_1709
    - TX_170a
    - TX_170b
    - TX_170c
    - TX_170d
    - TX_170e
    - TX_170f
    index:
    - 0x07
    - 0x08
    - 0x09
    - 0x0a
    - 0x0b
    - 0x0c
    - 0x0d
    - 0x0e
    - 0x0f
    text: |-
      The Queen
      changed
      completely. It's
      nice that she's
      kind now.

  - name: TX_1710
    index: 0x10
    text: |-
      I'm gonna find
      something that
      \col(3)Queen Ambi\col(0)
      desires so I
      don't have to
      work at \col(3)Ambi's
      Tower\col(0).

  - name: TX_1711
    index: 0x11
    text: |-
      I wonder what
      \col(3)Queen Ambi\col(0) will
      want next...

  - name: TX_1712
    index: 0x12
    text: |-
      They look like a
      happy family. I
      wish I could
      join them...

- group: 0x18
  data:
  - name: TX_1800
    index: 0x00
    text: |-
      There's been no
      night for many
      days, as if time
      has stopped.

  - name: TX_1801
    index: 0x01
    text: |-
      There's an odd
      pattern near the
      gate to the
      \col(3)Maku Tree\col(0). What
      could it be?

  - name: TX_1802
    index: 0x02
    text: |-
      All day,
      everyday, it's
      "good morning!"

  - name:
    - TX_1803
    - TX_1804
    - TX_1805
    - TX_1806
    - TX_1807
    - TX_1808
    index:
    - 0x03
    - 0x04
    - 0x05
    - 0x06
    - 0x07
    - 0x08
    text: |-
      Another one was
      taken to work on
      the tower. What
      is going on?

  - name: TX_1809
    index: 0x09
    text: >-
      Zelda is always busy,
      but I'm happy to have audience with her when I can.
      I don't visit the town often,
      but I want to be here for the \col(1)party\col(0).

  - name: TX_180a
    index: 0x0a
    text: >-
      My husband runs a bomb shop on
      the \col(1)Daichi Plains\col(0).
      He has to be there many nights
      so no monsters wander in.
      I hope to see him soon.

      I'm here in town to pick up some supplies
      and then I'm going back home to rest.

  - name: TX_180b
    index: 0x0b
    text: |-
      Isn't my husband the handsomest?\stop
      Thank you again for the medicine, Mr. \Link. \heart

  - name: TX_180c
    index: 0x0c
    text: |-
      I saw it with my own eyes!
      A terrible beast ran \col(1)west\col(0) to the \col(1)Falls\col(0)!\stop
      I couldn't see where it went after it crossed the west-most river!\stop
      \Link, please save the princess!
      Never in my days have I seen such horror!

- group: 0x1a
  data:
  - name:
    - TX_1a00
    - TX_1a01
    - TX_1a02
    index:
    - 0x00
    - 0x01
    - 0x02
    text: |-
      The \col(3)Maku Tree\col(0) is
      a talking tree!
      But lately she's
      been bothered by
      monsters...

  - name: TX_1a03
    index: 0x03
    text: |-
      A weird person
      came to the
      village. You
      couldn't tell if
      it was a man or
      a woman! It
      was scary!

  - name: TX_1a04
    index: 0x04
    text: |-
      I'm so mad! Even
      though the tower
      is done, my dad
      hasn't returned!

  - name:
    - TX_1a05
    - TX_1a06
    - TX_1a08
    index:
    - 0x05
    - 0x06
    - 0x08
    text: |-
      Do you know
      what "my own
      blood" means?
      \col(3)Ralph\col(0) knows.
      What is it?

  - name: TX_1a07
    index: 0x07
    text: |-
      I can go play
      wherever I like!
      What fun!

  - name: TX_1a09
    index: 0x09
    text: |-
      What?!? \col(3)Princess
      Zelda\col(0) is gone???

- group: 0x1b
  data:
  - name: TX_1b00
    index: 0x00
    text: |-
      The village has
      been full of
      rubble ever
      since work
      started on that
      tower! You can't
      get anywhere
      without a \col(1)Shovel\col(0)
      to clear a path!

  - name: TX_1b01
    index: 0x01
    text: |-
      Ohh! How long
      have I worked???
      Night never
      comes, so I
      can't tell. I
      want to go
      home.

  - name: TX_1b02
    index: 0x02
    text: |-
      \col(3)Queen Ambi\col(0) has
      changed. She
      was never cruel,
      but now she
      makes us do
      the impossible.
      But you didn't
      hear it from me!

  - name: TX_1b03
    index: 0x03
    text: |-
      It's been awful
      ever since that
      \col(3)Nayru\col(0) girl
      appeared. Now we
      have to work
      hours on end!

  - name: TX_1b04
    index: 0x04
    text: |-
      Dig! Dump! Dig!

  - name: TX_1b05
    index: 0x05
    text: |-
      Heave! Ho!

- group: 0x1c
  data:
  - name: TX_1c00
    index: 0x00
    text: |-
      You didn't know \col(3)Nayru\col(0) and I shared a birthday?
      It only makes sense!\stop
      So, \Link... what did you get \col(1)me\col(0)? I know it's something amaz- ing!

  - name: TX_1c01
    index: 0x01
    text: |-
      \Link, you already found a \col(1)toy\col(0) to play hero!
      Even in a \col(1)strange land\col(0) like this, you can't resist adventure!

  - name: TX_1c02
    index: 0x02
    text: |-
      What's taking so long, \Link?
      I thought you'd give me your \col(1)present\col(0) by now!\stop
      Are you crawling in a bunch of \col(1)caves\col(0) again?

  - name: TX_1c03
    index: 0x03
    text: |-
      Ooh, is that a \col(1)boomerang\col(0) in your pocket?
      I think I'd like one of those!\stop
      But you seem to have your heart on this one, so I think you got me something else!\stop
      What is it?
      What is it?

  - name: TX_1c04
    index: 0x04
    text: |-
      \Link, \col(3)Zelda\col(0) told me about the \col(1)Rod\col(0). Just keep it safe! Don't make me come save you again, tee hee.\stop
      You remember how it works, right? Swing it on a stump!
      Seasons will change the environment around you.
      \col(4)Spring\col(0) opens \col(1)flowers\col(0)...\stop
      \col(4)Summer\col(0) \col(1)dries\col(0) up ponds and \col(1)vines\col(0) will grow...\stop
      \col(2)Autumn\col(0) will make \col(1)leaves\col(0) fall and \col(1)mushrooms\col(0) will become ripe for picking...\stop
      \col(3)Winter\col(0) will \col(1)freeze water\col(0) and cause \col(1)snow\col(0) to pile up!\stop
      Just don't play around too much before the party starts!

  - name: TX_1c05
    index: 0x05
    text: |-
      When the \col(1)oracles\col(0) lived here, our power flowed into the sur- rounding areas.
      From ancient times, there was a mystic \col(1)shrine\col(0) built deep in the \col(1)southeast woods\col(0) to honor my kin and the seasons.
      This is not like the \col(1)Temple of Seasons\col(0) you saw in Holodrum, but rather a tower with many but also only one floor!
      Each floor is dedicated to one of the four seasons, and falling from one floor to the next will land you in the next season, even if it seems you should have reached the basement!
      It is almost like you are using the \col(1)Rod\col(0)!
      Spring to summer to autumn to winter and back to spring.\stop
      But I've not been there in many years and the way there has been lost to the repeating woods it resides in.
      Maybe there are still some worshippers in the woods who could guide you there!
      Although the party is starting soon, I bet you could find it in a pinch!\stop
      Who knows what will be there? Of course, you already have your \col(1)gift\col(0) for me so I can't imagine much!

  - name: TX_1c06
    index: 0x06
    text: |-
      \Link, this mystic \col(1)shrine\col(0) dedicated to the seasons...
      What did you think? Was it wonderful\stop

      Is that a \col(1)cape\col(0)? Oh how I'd love to \col(1)fly\col(0) as well!
      Then people from all lands could witness my famous dancing!
      Oh, I hope the party starts soon so we can dance together!\stop

      \col(3)Nayru\col(0) and I are thinking of going out to see some of Kinomi before the party. Don't be late!

  - name: TX_1c07
    index: 0x07
    text: |-
      What's that behind your back? Is that your \col(1)gift\col(0)? Is that for me? Oh, give it, give it!\stop
      \slow()No fair!

  - name: TX_1c08
    index: 0x08
    text: |-
      I'm so happy everything is normal again!
      Oh, \Link, I'm so happy for my \col(1)gift\col(0)!
      Now I can \col(1)fly\col(0) and show my dancing to all kinds of people!

  - name: TX_1c09
    index: 0x09
    text: |-
      \pos(1)\col(3)Zelda\col(0) has been kidnapped!

  - name: TX_1c0a
    index: 0x0a
    text: |-
      \pos(2)I just checked with the head guard. He said a \col(1)big monster\col(0) came to the villa and took the \col(3)princess\col(0)!

  - name: TX_1c0b
    index: 0x0b
    text: |-
      \pos(1)\Link, what will we do?

  - name: TX_1c0c
    index: 0x0c
    text: |-
      \pos(2)\Link, you must find her! The guard said the \col(1)monster\col(0) went \col(1)west\col(0) before disappearing around \col(1)Forever Falls\col(0)!\stop
      Do you think there's another entrance to the \col(1)Lost Labyrinth\col(0)?

  - name: TX_1c0d
    index: 0x0d
    text: |-
      \pos(1)Why would it go west?\stop
      Oh this is terrible! What about the party? I wanted my gifts!

  - name: TX_1c0e
    index: 0x0e
    text: |-
      \pos(2)\Link, if he went there, then you must know this!\stop
      Long ago, there was a mine high above the spring where Forever Falls is now.
      But I think it became haunted and was locked for safety! The key must have been hidden away in the Labyrinth somewhere... but where?

  - name:
    - TX_1c0f
    index:
    - 0x0f
    text: |-
      \pos(1)Please, \Link, save \col(3)Princess Zelda\col(0)!

  - name: TX_1c10
    index: 0x10
    text: |-
      How could this happen? \col(3)Nayru\col(0) and I weren't gone for long and then this!\stop
      As \col(3)Nayru\col(0) said, you must go find a \col(1)key\col(0) in the Labyrinth to enter an ancient mine.
      Be careful!

  - name: TX_1c11
    index: 0x11
    text: |-
      Was that, like,
      your \col(1)Shovel\col(0)?
      If you don't
      hang on to it,
      it could, like,
      wash out to sea.

  - name: TX_1c12
    index: 0x12
    text: |-
      Hi \Link, I am so happy to see you again, especially for the birthday of the Oracles!
      Come see me again if you need a refill!

  - name: TX_1c13
    index: 0x13
    text: |-
      Hi, \Link!
      The Goron Dance
      is all the rage
      in these
      mountains! But
      the Subrosian
      Dance is way
      cooler. These
      Gorons have a
      ways to go!

  - name: TX_1c14
    index: 0x14
    text: |-
      That Goron Dance
      is way cool! I'm
      gonna make it
      popular in
      Subrosia, too!

  - name: TX_1c15
    index: 0x15
    text: |-
      The \col(3)Graceful
      Goron\col(0) is the
      bomb! I'm gonna
      be the \col(3)Graceful
      Subrosian\col(0)!

- group: 0x1d
  data:
  - name: TX_1d00
    index: 0x00
    text: |-
      Isn't it great that we could all visit \col(3)Zelda's villa\col(0) this summer? And just in time for our \col(1)birthdays\col(0)!\stop
      Oh, yes, you're right, \Link. It's a bit late, but \col(3)Zelda\col(0) didn't want to let us pass the year without cele- brating!\stop
      I know \col(1)Din\col(0) is incredibly excited for the party! As am I, but you know how she can be.

  - name: TX_1d01
    index: 0x01
    text: |-
      \Link, shouldn't you be helping prepare for the party?
      Why do you have a \col(1)sword\col(0)?\stop
      I don't think we could stop you from adventure, but please get back soon!

  - name: TX_1d02
    index: 0x02
    text: |-
      Oh, who gave you those \col(1)seeds\col(0), \Link?
      Just be careful! Don't want you burning anything down out there, but come back safely!\stop
      \col(1)Din\col(0) keeps asking me to guess what your present is, but I'd rather be surprised!

  - name: TX_1d03
    index: 0x03
    text: |-
      \Link! What is that in your pocket? Is it something you'd like me to have? I'm sure what- ever it is will be fine...\stop
      But wait until the party, okay? Maybe \col(1)someone else\col(0) would want it more than me before then.\stop
      And beware of a \col(1)labyrinth\col(0) at the \col(1)southwest\col(0) edge of this land. We don't want you lost before the party even be- gins!

  - name: TX_1d04
    index: 0x04
    text: |-
      \Link, I'm not certain what caused you to pick up the \col(1)Harp of Ages\col(0) again. What could be in the \col(1)past\col(0) that we can't enjoy now?\stop
      \slow()Don't be silly!\stop
      No, I won't teach you any- more songs! I think the \col(1)Tune of Echoes\col(0) is all you'd need right now!\stop
      Thinking of the past... ages ago, there was a \col(1)Forest of Time\col(0) where the quarry now stands.
      The \col(1)labyrinth\col(0) was a lot more dangerous too since back then it hadn't been dug up with the quarry yet.
      Oh, \Link, don't go! I can't be certain you'll \col(1)be able to re- turn\col(0) since not every age has time portals to wake.\stop
      If you find yourself stran- ded, be certain to ask any \col(1)locals\col(0) for help.

  - name: TX_1d05
    index: 0x05
    text: |-
      Hey, is that the \col(1)Cane of Somaria\col(0)? I see it has been blessed with a \col(1)special power\col(0) in this land that you may not have witnessed be- fore.\stop
      Its blocks can instantly fill in holes! Isn't that some ama- zing magic?\stop
      It emanates from the powers of the \col(3)Oracle of Ages\col(0), and as such it cannot function outside of the lands \col(1)west\col(0) of the town.\stop
      Where are you going to use that, anyway?
      It must have been helpful in the \col(1)labyrinth\col(0) when it still stood, but you promised you would't ever go there!

  - name: TX_1d06
    index: 0x06
    text: |-
      What? You went into a \col(1)temple\col(0)? The party is about to begin, and you can't hold yourself back!
      \Link, I'm just begging that you'll return safely to the villa soon...\stop
      I was preparing to \col(1)sing\col(0) for the guests tonight, but I saw \col(1)Din\col(0) and \col(3)Zelda\col(0) chat- ting.
      It got me won- dering if you even have a present for \col(1)us\col(0).\stop
      \slow()Did you forget?\stop
      Don't worry if you did, but you have to be honest!\stop
      Also, \Link, \col(1)Din\col(0) and I will be out shopping right before the party. Don't be late!

  - name: TX_1d07
    index: 0x07
    text: |-
      You're finally back! But that look on your face tells me you're not done out there...
      What is it now? \Link, just tell me! Is it some- thing for \col(1)Din\col(0)?
      I could help!\stop
      Then again, you've had us wait this long. Why don't you go out and get what you need? See you in a few, and good luck! \heart

  - name: TX_1d08
    index: 0x08
    text: |-
      Oh, this is so wonderful! You've brought \col(3)Zelda\col(0) back and the party has begun!\stop
      \Link, thank you for your \col(1)gift\col(0)! It sounds beau- tiful, and I can't wait to fully learn it for my friends back at home!\stop
      Enjoy the party!

  - name: TX_1d09
    index: 0x09
    text: >-
      The guards have blocked off the \col(1)villa\col(0)
      to prevent further attacks! \col(1)Din\col(0)
      and I weren't gone for long...

      Oh, \Link, that fearsome beast wandered into
      an ancient mine closed \col(1)long ago\col(0)!
      Please find Zelda!

  - name: TX_1d0a
    index: 0x0a
    text: |-
      \pos(0)\Link...\stop
      What's happening
      inside..?

  - name: TX_1d0b
    index: 0x0b
    text: |-
      \pos(0)\Link!!!
      I'm so glad
      you're safe!
      Thank goodness!

  - name: TX_1d0c
    index: 0x0c
    text: |-
      \pos(0)Let us go!

  - name: TX_1d0d
    index: 0x0d
    text: |-
      \pos(0)I am reluctant
      to part, but we
      must return to
      our own age!

  - name:
    - TX_1d0e
    - TX_1d0f
    index:
    - 0x0e
    - 0x0f
    text: |-
      You won't get
      away so easily!

  - name: TX_1d10
    index: 0x10
    text: |-
      I am \col(3)Nayru\col(4),
      Oracle of Ages.\stop
      You are holding
      an instrument
      called the \col(2)Harp
      of Ages\col(4). \Link,
      you are a hero
      chosen by the
      currents
      of time.\stop
      Your arrival
      means I am not
      home right now.\stop
      Take the \col(2)harp\col(4).
      I entrust the
      \col(2)harp\col(4) to you!
      By playing
      certain \col(2)tunes\col(4)
      on the \col(2)Harp of
      Ages\col(4), you can
      travel through
      time!\stop
      Let me teach
      you the \col(2)Tune
      of Echoes\col(4) again!

  - name: TX_1d11
    index: 0x11
    text: |-
      If you play that
      \col(2)tune\col(4), you will
      unlock the
      powers of the
      \col(3)Time Portals\col(4)
      found across
      this land.\stop
      Step into a \col(3)Time
      Portal\col(4) to travel
      through time
      to another age.\stop
      Please, chosen
      hero, find me! I am counting on you, \Link.

  - name: TX_1d12
    index: 0x12
    text: |-
      \pos(2)\Link,
      please! Stop
      \col(3)Ralph\col(0)! He means
      to sacrifice
      himself for the
      people of this
      age by slaying
      \col(3)Queen Ambi\col(0)...
       I can't allow
      \col(3)Ralph\col(0) to make
      such a
      sacrifice!

  - name: TX_1d13
    index: 0x13
    text: |-
      \pos(2)\col(3)Impa\col(0) and I will
      find a way to
      give strength to
      the villagers.
      Please, \Link,
      save \col(3)Ralph\col(0).

  - name: TX_1d14
    index: 0x14
    text: |-
      I am fine.\stop
      \Link...
      You may be the
      only one who can
      stop \col(3)Veran\col(0).
      But surely \col(3)Ralph\col(0)
      will help you.

  - name: TX_1d15
    index: 0x15
    text: |-
      \Link, hurry!
      I'm afraid \col(3)Ralph\col(0)
      may do something
      hasty!

  - name: TX_1d16
    index: 0x16
    text: |-
      Thank you,
      \Link,
      Thanks to you,
      \col(3)Lynna City\col(0) is a
      peaceful place
      once again!

  - name: TX_1d17
    index: 0x17
    text: |-
      Just when we
      thought the
      shadow would
      wane, it grows
      stronger, just
      as \col(3)Veran\col(0)said.
      \Link!
      Please help
      \col(3)Zelda\col(0)!

  - name: TX_1d18
    index: 0x18
    text: |-
      \Link, are
      you all right?

  - name: TX_1d19
    index: 0x19
    text: |-
      You've finally
      beaten \col(3)Veran\col(0).
      Now the chaotic
      flows of time
      should return
      to normal.
      Shall we go
      back to the
      village?

  - name: TX_1d1a
    index: 0x1a
    text: |-
      \pos(1)I will come to
      your aid!

  - name: TX_1d1b
    index: 0x1b
    text: |-
      \pos(2)Time, Nature...
      Hero of the
      \col(1)essences\col(0), I am
      \col(3)Din\col(0), Oracle of
      Seasons. Hurry,
      \Link! You've
      beaten \col(3)Veran\col(0),
      but \col(3)Twinrova's\col(0)
      plans are not
      yet thwarted!\stop
      The dark powers
      of the Evil King
      are growing!

  - name: TX_1d1c
    index: 0x1c
    text: |-
      \pos(2)The powers of
      we Oracles\stop
      will guide you
      to \col(3)Princess
      Zelda\col(0)! Cast down
      \col(3)Twinrova\col(0) and
      stop the Evil
      King \col(3)Ganon's\col(0)
      revival!\stop
      \Link, surely
      you can do it!
      We're counting
      on you!

  - name: TX_1d1d
    index: 0x1d
    text: |-
      \pos(1)May the divine
      protection of
      the Triforce be
      with the hero
      of the \col(1)Essences
      of Time and
      Nature\col(0)!

  - name: TX_1d1e
    index: 0x1e
    text: |-
      \Link, the
      hero! You have
      overcome many
      trials, and
      gained knowledge
      of the \col(1)Essences
      of Time and
      Nature\col(0). Only you
      can defeat
      \col(3)Twinrova\col(0)!

  - name: TX_1d1f
    index: 0x1f
    text: |-
      Mystical power
      fills your body!

  - name: TX_1d20
    index: 0x20
    text: |-
      Responsibility
      for \col(3)Veran\col(0) coming
      to this land
      falls on me,
      too. I will not
      let \col(3)Ralph\col(0) carry
      that burden
      alone.

  - name: TX_1d21
    index: 0x21
    text: |-
      \Link!
      How are you?
      Listen to me.
      After all that's
      happened, \col(3)Ralph\col(0),
      like a changed
      man, has taken
      up the art of
      fighting. But I
      will not let him
      outdo me!
      I must fulfill
      my duties as the
      Oracle of Ages
      faithfully.\stop
      But one thing
      concerns me--
      \col(3)Impa\col(0). This bird
      brought me a
      letter that says
      \col(3)Impa\col(0) has changed
      course and is
      headed to
      \col(3)Holodrum\col(0)...
      Could something
      terrible again
      be happening
      without my
      knowing? Perhaps
      I worry too
      much...

  - name: TX_1d22
    index: 0x22
    text: |-
      I'm sorry,
      \Link.
      \col(3)Ralph\col(0) is always
      like this when
      it comes to me.
      But I feel that
      something evil
      is approaching,
      just as \col(3)Ralph\col(0)
      claims...

- group: 0x1e
  data:
  - name: TX_1e00
    index: 0x00
    text: |-
      What's this?
      Green clothes...
      Sir, are you
      smitten with
      forest fairies?
      My name is
      \col(3)Tingle\col(0), the one
      and only! I am
      a true fairy!\stop
      The villagers
      say that at 35,
      I should open my
      eyes...
      But I say \col(3)Tingle\col(0)
      is the very
      reincarnation
      of a fairy!
      How'd you like
      \col(3)Tingle\col(0) the fairy
      for a friend?
        \opt()Sure \opt()No way

  - name: TX_1e01
    index: 0x01
    text: |-
      Sir, you must be
      smitten with the
      forest fairies!\stop
      How'd you like
      \col(3)Tingle\col(0) the fairy
      as a friend?
        \opt()Sure \opt()No way

  - name: TX_1e02
    index: 0x02
    text: |-
      Then from today,
      you and \col(3)Tingle\col(0)
      are friends!\stop
      Yes! Yes! As a
      sign of our
      friendship,
      \col(3)Tingle\col(0) will give
      you his \col(1)chart\col(0)
      that shows the
      way to the
      secret island!

  - name: TX_1e03
    index: 0x03
    text: |-
      ...I see! I hope
      you won't
      regret it!

  - name: TX_1e04
    index: 0x04
    text: |-
      Come back here
      anytime you wish
      to see \col(3)Tingle\col(0)!
      If you get more
      \col(1)Mystical Seeds\col(0),
      something good
      may happen!

  - name: TX_1e05
    index: 0x05
    text: |-
      \call(TX_1e0c)\stop
      ...These are the
      magic words that
      Tingle created
      myself. Don't
      steal them!

  - name: TX_1e06
    index: 0x06
    text: |-
      What's this?
      Look at all the
      \col(1)Mystical Seeds\col(0)
      you've gathered!
      \col(3)Tingle\col(0) the fairy
      can make it so
      your \col(1)satchel\col(0) can
      carry more
      seeds! Shall I?
        \opt()Yes \opt()No

  - name: TX_1e07
    index: 0x07
    text: |-
      Very well! Then
      \col(3)Tingle\col(0) shall
      work his magic.
      Close your eyes!

  - name: TX_1e08
    index: 0x08
    text: |-
      Come back
      anytime you
      wish to see
      \col(3)Tingle\col(0).

  - name: TX_1e09
    index: 0x09
    text: |-
      Do you by chance
      know cooler
      \col(1)secrets\col(0) than
      \col(3)Tingle\col(0)?
        \opt()Yes \opt()No

  - name: TX_1e0a
    index: 0x0a
    text: |-
      ...I see!\n
    null_terminator: False

  - name: TX_1e0b
    index: 0x0b
    text: |-
      I guess \col(3)Tingle\col(0)
      is the coolest.

  - name: TX_1e0c
    index: 0x0c
    text: |-
      \sfx(0xb5)Tingle, Tingle!
      Kooloo-Limpah!

  - name: TX_1e0d
    index: 0x0d
    text: |-
      That's not cool
      at all!!!
      \jump(TX_1e0b)
    null_terminator: False

  - name: TX_1e0e
    index: 0x0e
    text: |-
      What's this?!?
      I hate to admit
      it, but you're
      far cooler than
      \col(3)Tingle\col(0)...
      In exchange for
      teaching me
      that, I'll make
      it so you can
      carry more
      \col(1)seeds\col(0)!
      Close your eyes!

  - name: TX_1e0f
    index: 0x0f
    text: |-
      I'll teach you
      the \col(1)secret\col(0) to
      carrying more
      \col(1)seeds\col(0) in
      \col(3)Holodrum\col(0), too.\stop
      \secret1\stop
      Call on me again
      if you forget.

  - name: TX_1e10
    index: 0x10
    text: |-
      \call(TX_1e0c)
      \col(3)Tingle's\col(0) words
      are the coolest!
      Don't steal
      them!

- group: 0x20
  data:
  - name: TX_2000
    index: 0x00
    text: |-
      \sfx(0xc3)Hoh...
      I'm \col(3)Ricky\col(0).
      Usually, I can
      clear holes and
      cliffs with my
      patented jump...
      \jump(TX_2002)
    null_terminator: False

  - name: TX_2001
    index: 0x01
    text: |-
      \sfx(0xc3)Hoh...
      \Link? It's
      been a while!\stop
      Usually I'd be
      happy to see
      you...\n
    null_terminator: False

  - name: TX_2002
    index: 0x02
    text: |-
      But I'm not in
      such a good mood
      right now...
      You see...
      I lost my
      precious
      \col(1)gloves\col(0)...

  - name: TX_2003
    index: 0x03
    text: |-
      I think I left
      them by the tree
      on the beach,
      but I can't seem
      to find them.

  - name: TX_2004
    index: 0x04
    text: |-
      \sfx(0xc3)Hey! My \col(1)gloves\col(0)!
      You found them!
      Thanks!\stop
      Now I'll help
      you find what
      you're looking
      for! Hop into
      my pocket!

  - name: TX_2005
    index: 0x05
    text: |-
      \sfx(0xc3)Press \abtn to
      punch, or build
      power to unleash
      a tornado. I can
      also jump small
      holes or cliffs.

  - name: TX_2006
    index: 0x06
    text: |-
      \sfx(0xc3)I guess you
      found what you
      were after...
      This is just
      between you and
      me, but I can't
      stand this guy,
      so I'll see you
      later!

  - name: TX_2007
    index: 0x07
    text: |-
      Isn't what
      you're looking
      for over there?

  - name: TX_2008
    index: 0x08
    text: |-
      \sfx(0xc3)If you move
      toward a hole,
      I'll just jump
      right over.
      I can clear one
      hole easy.
      Give it a try.

  - name: TX_2009
    index: 0x09
    text: |-
      \sfx(0xc3)A cliff like
      that is one
      leap. I'll jump
      if you move up
      to it. Try it.

  - name: TX_200a
    index: 0x0a
    text: |-
      \sfx(0xc3)Yow! I'm sorry,
      but it's too
      hot for me in
      there!

- group: 0x21
  data:
  - name: TX_2100
    index: 0x00
    text: |-
      \pos(2)\sfx(0xc4)Dee! Dee!

  - name: TX_2101
    index: 0x01
    text: |-
      \sfx(0xc4)I was almost
      eaten! I'm
      \col(3)Dimitri\col(0). I can
      swim in the sea.
      \jump(TX_2103)
    null_terminator: False

  - name: TX_2102
    index: 0x02
    text: |-
      \sfx(0xc4)\Link! It's
      you! You saved
      me! You're a
      good friend.\n
    null_terminator: False

  - name: TX_2103
    index: 0x03
    text: |-
      Are you going
      somewhere? I can
      give you a ride.

  - name: TX_2104
    index: 0x04
    text: |-
      \sfx(0xc4)We're here! You
      go alone now.
      Bye!

  - name: TX_2105
    index: 0x05
    text: |-
      \sfx(0xc4)I'll get lost if
      I go too far!

  - name: TX_2106
    index: 0x06
    text: |-
      \sfx(0xc4)I chomp when you
      press \abtn.\stop
      And I swim like
      a fish--even up
      waterfalls. You
      can even carry
      me using the
      \col(1)Power Bracelet\col(0).

  - name: TX_2107
    index: 0x07
    text: |-
      \sfx(0xc4)You can carry
      and throw me
      when you use the
      \col(1)Power Bracelet\col(0).
      Want to try?

  - name: TX_2108
    index: 0x08
    text: |-
      \sfx(0xc4)I even swim up
      waterfalls.
      Try it!

  - name: TX_2109
    index: 0x09
    text: |-
      \sfx(0xc4)Too hot! It's
      boiling hot
      here! You go
      alone, \Link!

- group: 0x22
  data:
  - name: TX_2200
    index: 0x00
    text: |-
      \sfx(0xc5)A g-g-g-ghost!
      Help!

  - name: TX_2201
    index: 0x01
    text: |-
      \sfx(0xc5)D-don't eat me!
      I taste awful!

  - name: TX_2202
    index: 0x02
    text: |-
      \sfx(0xc5)...The ghosts
      are all gone!

  - name: TX_2203
    index: 0x03
    text: |-
      \call(TX_2202)
      Did you chase
      them away? Thank
      you! I am \col(3)Moosh\col(0).
      Maybe I can help
      you out. Climb
      onto my back.

  - name: TX_2204
    index: 0x04
    text: |-
      \call(TX_2202)
      \sfx(0xc5)!!!
      \Link???
      I can help you
      if you like,
      \Link.
      Climb onto my
      back.

  - name: TX_2205
    index: 0x05
    text: |-
      \sfx(0xc5)Tap \abtn to hover,
      or hold it to
      charge up for a
      ground pound.\stop
      But water is my
      weakness. The
      shallow stuff is
      one thing, but I
      can't take deep
      water, so be
      careful.

  - name: TX_2206
    index: 0x06
    text: |-
      \sfx(0xc5)Hold \abtn to
      charge up. If
      you build enough
      power and let it
      go, I'll pound
      the ground. Try
      it.

  - name: TX_2207
    index: 0x07
    text: |-
      \sfx(0xc5)I can float if
      you tap \abtn.
      If you move as
      I float, you can
      float across
      pits. Try it.

  - name: TX_2208
    index: 0x08
    text: |-
      \sfx(0xc5)You found what
      you were looking
      for? I'm glad I
      could help. See
      you around.

  - name: TX_2209
    index: 0x09
    text: |-
      \sfx(0xc5)I don't want
      to go too far...

  - name: TX_220a
    index: 0x0a
    text: |-
      \sfx(0xc5)Ugh! It's hot!\stop
      I can't take so
      much heat. I'm
      sorry.

- group: 0x23
  data:
  - name: TX_2300
    index: 0x00
    text: |-
      Those lazy,
      worthless fools!\stop
      Just as we're
      buildin' this
      bridge to the
      \col(3)Symmetry City
      Ruins\col(0), they go
      off on break!
      I wait and I
      wait, but they
      don't come back!

  - name: TX_2301
    index: 0x01
    text: |-
      \call(TX_2300)
      We'll never get
      the bridge done
      at this rate!
      I'd go find 'em
      but the terrain
      'round here is
      too rough!\stop
      A man can't
      navigate it on
      his own! Pahh!
      What a fix!

  - name: TX_2302
    index: 0x02
    text: |-
      \call(TX_2300)\stop
      C'mon, buddy.
      Can you go find
      those slackers
      for me?
        \opt()Sure \opt()Sorry

  - name: TX_2303
    index: 0x03
    text: |-
      Then scram!
      Lazy kid!

  - name: TX_2304
    index: 0x04
    text: |-
      Thanks, buddy!
      I guess you'll
      be off, then!\n
    null_terminator: False

  - name: TX_2305
    index: 0x05
    text: |-
      If you can get
      all three of
      those slackers
      back here, we
      can get to work
      on this bridge.
      But the terrain
      around here is
      too rough,
      so you can't
      manage it on
      your own. OK?
        \opt()OK \opt()What?

  - name: TX_2306
    index: 0x06
    text: |-
      If you get those
      three slackers
      back here, we'll
      finish this
      bridge.

  - name: TX_2307
    index: 0x07
    text: |-
      You ain't been
      over that way
      yet! Or are you
      giving up?
        \opt()Yes \opt()No

  - name: TX_2308
    index: 0x08
    text: |-
      Really! Then see
      ya later!

  - name: TX_2309
    index: 0x09
    text: |-
      Then keep on
      lookin'!

  - name: TX_230a
    index: 0x0a
    text: |-
      Hah hah! They're
      finally here!
      They were just
      late! Well, get
      to work! No more
      breaks until the
      bridge is done!

  - name: TX_230b
    index: 0x0b
    text: |-
      What? You're
      already done?
      I guess you
      fools can work!
      But no time for
      breaks now! On
      to the next job!

  - name: TX_230c
    index: 0x0c
    text: |-
      My boss is an
      ornery fellow!
      He does no work,
      but complains
      about quality!

  - name: TX_230d
    index: 0x0d
    text: |-
      He says to build
      a bridge to the
      \col(3)Symmetry City
      Ruins\col(0), but it's
      not like anyone
      is waiting to
      use it. There's
      no rush, don'cha
      think?

  - name: TX_230e
    index: 0x0e
    text: |-
      Ahh! It's a
      beautiful day!
      Forget work!
      Maybe I'll write
      a poem...

  - name: TX_230f
    index: 0x0f
    text: |-
      Huh? The boss?\stop
      But I wanted to
      hang out a while
      longer... But I
      can head back...

  - name: TX_2310
    index: 0x10
    text: |-
      No way! He can't
      think I'm
      skippin' out!

  - name: TX_2311
    index: 0x11
    text: |-
      Yesss, boss...

  - name: TX_2312
    index: 0x12
    text: |-
      We're done,
      boss!

  - name: TX_2313
    index: 0x13
    text: |-
      Have you heard
      of \col(1)Fairy Powder\col(0)?\stop
      Fairy tales say
      it turned a
      cursed Queen
      back to her
      original shape.
      They say that
      \col(1)Fairy Powder\col(0) was
      kept in back
      long ago!\stop
      I don't know if
      it's true or
      not, but it sure
      is romantic.

  - name: TX_2314
    index: 0x14
    text: |-
      I'm looking for
      a romantic poem,
      but I can't find
      anything good...
      How's this...
      "Roses are red,
      violets are..."

- group: 0x24
  data:
  - name: TX_2400
    index: 0x00
    text: |-
      \sfx(0xc7)Welcome!\stop
      I am the first
      generation of
      Graceful
      Dancers! This is
      our dance hall!
      One must know
      our dance if he
      is to be called
      a Goron.
      If you dance
      well, I'll give
      you a \col(1)Symbol of
      Brotherhood\col(0)!
      One try costs
      20 Rupees.
      Shall we dance?
        \opt()Yes \opt()No

  - name: TX_2401
    index: 0x01
    text: |-
      \sfx(0xc7)Welcome!
      I am the first
      generation of
      Graceful
      Dancers! This is
      my dance hall.
      The Goron Dance
      is all the rage
      with hip, young
      Gorons.
      It's great!!!\stop
      Want to dance?
      It's 20 Rupees.
        \opt()OK \opt()No thanks

  - name:
    - TX_2402
    - TX_2422
    index:
    - 0x02
    - 0x22
    text: |-
      \sfx(0xc7)Shall I explain
      the dance?
        \opt()No \opt()Yes

  - name:
    - TX_2403
    - TX_2423
    index:
    - 0x03
    - 0x23
    text: |-
      \sfx(0xc7)We refuse none
      who come but
      chase none who
      leave. Come back
      anytime.

  - name:
    - TX_2404
    - TX_2424
    index:
    - 0x04
    - 0x24
    text: |-
      \sfx(0xc7)Pay attention to
      my lesson.
      You'll hear the
      rhythm as the
      dance begins.
      You must repeat
      that rhythm.
      There are two
      types.

  - name:
    - TX_2405
    - TX_2425
    index:
    - 0x05
    - 0x25
    text: |-
      \sfx(0xc7)Press \bbtn to move
      to this sound!

  - name:
    - TX_2406
    - TX_2426
    index:
    - 0x06
    - 0x26
    text: |-
      \sfx(0xc7)Press \abtn to hold
      a pose when you
      hear this sound!
      There are eight
      rounds in all.
      Dance well in
      six rounds to
      get a prize!
      If you make
      three mistakes,
      you're out.\stop
      To try is to
      learn!
      Got it?
        \opt()Yes \opt()No

  - name:
    - TX_2407
    - TX_2427
    index:
    - 0x07
    - 0x27
    text: |-
      \sfx(0xc7)We don't care
      how you dance,
      as long as you
      have rhythm!
      Am I a good
      dancer?

  - name:
    - TX_2408
    - TX_2428
    index:
    - 0x08
    - 0x28
    text: |-
      \sfx(0xc7)One... Two...\stop
      One, two, three!

  - name:
    - TX_2409
    - TX_2429
    index:
    - 0x09
    - 0x29
    text: |-
      \sfx(0xc7)Hey! You need
      more Rupees!

  - name:
    - TX_240a
    - TX_242a
    index:
    - 0x0a
    - 0x2a
    text: |-
      You are a
      talented Goron
      dancer! You can
      dance at any
      level you like!
      Which do you
      choose?

  - name: TX_240b
    index: 0x0b
    text: |-
      \sfx(0xc7)\call(TX_240a)\stop
       \opt()Platinum \opt()Gold
       \opt()Silver

  - name:
    - TX_240c
    - TX_242c
    index:
    - 0x0c
    - 0x2c
    text: |-
      \sfx(0xc7)Platinum?

  - name:
    - TX_240d
    - TX_242d
    index:
    - 0x0d
    - 0x2d
    text: |-
      \sfx(0xc7)Gold?

  - name:
    - TX_240e
    - TX_242e
    index:
    - 0x0e
    - 0x2e
    text: |-
      \sfx(0xc7)Silver?

  - name:
    - TX_240f
    - TX_242f
    index:
    - 0x0f
    - 0x2f
    text: |-
      \sfx(0xc7)Bronze?

  - name:
    - TX_2410
    - TX_2430
    index:
    - 0x10
    - 0x30
    text: |-
      \sfx(0xc7)You're pretty
      good! This makes
      you a brother to
      the Gorons!\stop
      As I promised,
      here you go!

  - name:
    - TX_2411
    - TX_2431
    index:
    - 0x11
    - 0x31
    text: |-
      \sfx(0xc7)All Gorons will
      call you friend!
      May we always
      dance together!

  - name:
    - TX_2412
    - TX_2432
    index:
    - 0x12
    - 0x32
    text: |-
      \sfx(0xc7)Perfect!
      That was great!
      It felt wild and
      open, like the
      sea! It was
      poetry in
      motion! Thank
      you for sharing
      it with us. Here
      is your prize.

  - name:
    - TX_2413
    - TX_2433
    index:
    - 0x13
    - 0x33
    text: |-
      \sfx(0xc7)You cleared \num1
      of 8 rounds!
      Very well done!
      You're almost as
      good as me!
      Here is your
      prize!

  - name:
    - TX_2414
    - TX_2434
    index:
    - 0x14
    - 0x34
    text: |-
      \sfx(0xc7)Use your body to
      express your
      passion more!

  - name:
    - TX_2415
    - TX_2435
    index:
    - 0x15
    - 0x35
    text: |-
      \sfx(0xc7)Dance is heart!
      It is passion!\stop
      Your body must
      express the
      passion! Turn up
      the heat!!! Want
      to try again?
        \opt()Yes \opt()No

  - name:
    - TX_2416
    - TX_2436
    index:
    - 0x16
    - 0x36
    text: |-
      \sfx(0xc7)Concentrate!
      OK, next round!

  - name:
    - TX_2417
    - TX_2437
    index:
    - 0x17
    - 0x37
    text: |-
      \sfx(0xc7)You fail if you
      miss once more!

  - name:
    - TX_2418
    - TX_2438
    index:
    - 0x18
    - 0x38
    text: |-
      \sfx(0xc7)Too bad! You
      fail this time.

  - name: TX_2419
    index: 0x19
    text: |-
      \sfx(0xc7)Huh? That's an
      \col(1)introduction\col(0)
      from a brother?
      What's this..?\stop
      Give me your
      \col(1)Mermaid Key\col(0)?
      How did he know
      I have it?
      Oh well...\stop
      I can't turn
      down a brother's
      request.
      But I can't just
      give you this!
      Dance me for it!
      If you can match
      my moves, the
      \col(1)Mermaid Key\col(0) is
      yours. So?
      It's 20 Rupees
      to try...
        \opt()OK \opt()No thanks

  - name: TX_241a
    index: 0x1a
    text: |-
      \sfx(0xc7)What soul!\stop
      Since a brother
      has recommended
      you, I will do
      as I promised!

  - name:
    - TX_241b
    - TX_241c
    - TX_241d
    - TX_241e
    - TX_241f
    index:
    - 0x1b
    - 0x1c
    - 0x1d
    - 0x1e
    - 0x1f
    text: |-
      \sfx(0xc7)Come back if
      you need another
      lesson!

  - name: TX_2420
    index: 0x20
    text: |-
      \sfx(0xc7)Welcome!\stop
      I am the fifth
      generation of
      Graceful
      Dancers! This is
      my dance hall.
      One must know
      our dance if he
      is to be called
      a Goron.
      If you dance
      well, I'll give
      you a \col(1)Symbol of
      Brotherhood\col(0)!
      One try costs
      10 Rupees.
      Shall we dance?
        \opt()Yes \opt()No

  - name: TX_2421
    index: 0x21
    text: |-
      \sfx(0xc7)Welcome!
      I am the fifth
      generation of
      Graceful
      Dancers! This is
      my dance hall.
      The Goron dance
      is all the rage
      with hip, young
      Gorons.
      It's great!!!\stop
      Want to dance?
      It's 10 Rupees.
        \opt()OK \opt()No thanks

  - name:
    - TX_242b
    - TX_2439
    - TX_243a
    - TX_243b
    - TX_243c
    - TX_243d
    - TX_243e
    - TX_243f
    index:
    - 0x2b
    - 0x39
    - 0x3a
    - 0x3b
    - 0x3c
    - 0x3d
    - 0x3e
    - 0x3f
    text: |-
      \sfx(0xc7)\call(TX_242a)\stop
        \opt()Gold \opt()Silver
        \opt()Bronze

  - name: TX_2440
    index: 0x40
    text: |-
      \sfx(0xc7)I love dancing!
      This dance will
      be danced for
      all eternity!

  - name: TX_2441
    index: 0x41
    text: |-
      \sfx(0xc7)With practice,
      you can be a
      master Goron
      Dancer, too!

  - name: TX_2442
    index: 0x42
    text: |-
      \sfx(0xc7)Someday I want
      to teach this to
      my children!!!

  - name: TX_2443
    index: 0x43
    text: |-
      \sfx(0xc7)I dance when
      I'm happy and
      when I'm sad. If
      everyone did it,
      they'd all be
      happy!

  - name: TX_2444
    index: 0x44
    text: |-
      \sfx(0xc7)Dancing everyday
      tires you out.
      Sometimes you
      have to rest.
      It's the same as
      work and study.
      But you can't
      just relax all
      the time.

  - name: TX_2445
    index: 0x45
    text: |-
      \sfx(0xc7)The Goron Dance
      is my favorite.
      I want everyone
      to learn it!

  - name:
    - TX_2446
    - TX_2447
