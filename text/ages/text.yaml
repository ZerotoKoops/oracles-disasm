    - 0xc1
    text: |-
      It's me, \col(3)Zelda\col(4)! Did you find a gift for \col(2)Din\col(4) yet?\stop
      Oh, it's just beautiful! \col(2)Din\col(4) is going to just love it!\stop
      If it's a gift for \col(3)Nayru\col(4) that you seek next, that should be to the \col(2)west\col(4).

  - name:
    - TX_05b2
    - TX_05c2
    index:
    - 0xb2
    - 0xc2
    text: |-
      \Link! Did you get both oracles a gift? Hurry back then to the \col(2)villa\col(4)! We want to start the party!

  - name:
    - TX_05b3
    - TX_05c3
    index:
    - 0xb3
    - 0xc3
    text: |-
      \Link! It's \col(3)Zelda\col(4)! What was that you got from the \col(3)Spirit's Grotto\col(4)?\stop
      A \col(2)doll\col(4)? I don't think either oracle would like that!! Maybe you could \col(2)trade\col(4) it for something better!\stop
      Hurry, \Link! The party is almost started! Remember that Nayru is the Oracle of \col(3)Ages\col(4).

  - name:
    - TX_05b4
    - TX_05c4
    index:
    - 0xb4
    - 0xc4
    text: |-
      \Link! It's \col(3)Zelda\col(4)! Did the \col(3)Four Corners' Cave\col(4) have anything?\stop
      No, a boomerang won't do...\stop
      The \col(2)Rod of Seasons\col(4)! Din may not like you gifting her something she already owns as the Oracle of \col(2)Seasons\col(4).\stop
      \Link, you must hurry! The guests have all arrived. Why don't you use the \col(2)Rod\col(4) to explore further southeast?

  - name:
    - TX_05b5
    - TX_05c5
    index:
    - 0xb5
    - 0xc5
    text: >-
      \Link, there seem to be some new creatures here at the party,
      calling themselves the \col(2)Tokay\col(4).
      They say they've settled in this land for generations,
      but I don't remember them yesterday!\stop
      
      \Link, please find out what happened to our \col(3)present time\col(4)!

  - name:
    - TX_05b6
    - TX_05c6
    index:
    - 0xb6
    - 0xc6
    text: >-
      \Link, what did you find in the \col(2)Daichi\col(4) region?\stop

      Four \col(2)stones\col(4)?

      If they represent the seasons,
      they must be telling you a \col(2)secret\col(4)
      about where to find the ancient \col(2)shrine\col(4)!\stop

      \col(2)Study\col(4) the stones in your pocket and
      \col(2)listen\col(4) to what they say, \Link!

  - name:
    - TX_05b7
    - TX_05c7
    index:
    - 0xb7
    - 0xc7
    text: >-
      \Link, you seem very far away now! What is taking you so long?
      When are you coming back?\stop

      \col(3)Nayru\col(4) told me about the \col(2)Labyrinth\col(4).
      She said there was a \col(2)staff\col(4) that could summon blocks!

      That sounds amazing!
      But she also said that it was sealed long ago
      and the only hopes you'd have in
      finding it would be in the \col(2)present\col(4)
      when the \col(3)walls have been made weaker\col(4)!\stop

      Oh, \Link! Please hurry back to the our time!

  - name:
    - TX_05b8
    - TX_05c8
    index:
    - 0xb8
    - 0xc8
    text: >-
      \Link! It's me, Zelda!
      So you found a \col(2)sword\col(4)!

      Well, it's best to go in search
      of those \col(2)gifts\col(4)!

      Please be back in time for the party!\stop

      Explore the town, and go either \col(2)east\col(4) or \col(2)west\col(4)
      to find the \col(2)gifts\col(4) for the oracles!

      I'm sure you'll figure out what they want as you go, \Link!

      But if you ever get stuck, just come back and \col(2)ask any of us\col(4).

  - name:
    - TX_05b9
    - TX_05c9
    index:
    - 0xb9
    - 0xc9
    text: |-
      Saving \col(3)Nayru\col(4)
      isn't enough...
      \col(3)Veran's\col(4) deeds
      have changed
      the world...
      \Link!
      I cannot hear
      the last \col(2)essence\col(4)
      at all...
      But it must be
      somewhere in
      \col(3)Labrynna\col(4).
      I'm relying on
      you, \Link.

  - name:
    - TX_05ba
    - TX_05ca
    index:
    - 0xba
    - 0xca
    text: |-
      Thank you,
      \Link!
      You've gathered
      all the \col(2)Essences
      of Time\col(4)! Now I
      can create
      something that
      will aid you,
      \Link!
      \pos(2)Please visit me
      after you've
      grown up! I'll
      wait for you, no
      matter how long!

  - name:
    - TX_05bb
    - TX_05bc
    - TX_05bd
    - TX_05be
    - TX_05bf
    index:
    - 0xbb
    - 0xbc
    - 0xbd
    - 0xbe
    - 0xbf
    text: |-
      \Link did it.

  - name:
    - TX_05cb
    - TX_05cc
    - TX_05cd
    - TX_05ce
    - TX_05cf
    index:
    - 0xcb
    - 0xcc
    - 0xcd
    - 0xce
    - 0xcf
    text: |-
      \Link did it.

  - name: TX_05d0
    index: 0xd0
    text: |-
      \pos(2)No! Noooo!
      LEAVE ME ALONE!

  - name: TX_05d1
    index: 0xd1
    text: |-
      \pos(2)Aaahh! Oh dear!
      Get them!

  - name: TX_05d2
    index: 0xd2
    text: |-
      \pos(2)Wow! You were so
      daring and cool!

  - name: TX_05d3
    index: 0xd3
    text: |-
      Th-thank you!
      Who are you?
      \Link! What
      a nice name. I'm
      the \col(3)Maku Tree\col(0).
      You were brave!
      They said the
      Oracle of Ages
      convinced \col(3)Queen
      Ambi\col(0) to build a
      \col(3)Black Tower\col(0)...
      Maybe she made
      them attack me.\stop
      Thank you for
      rescuing me!
      I will never,
      ever forget it!
      And I promise
      I'll repay you
      when I grow up!
      This is about
      all I can do...
      Ah-hah!

  - name: TX_05d4
    index: 0xd4
    text: |-
      \pos(2)Dear!
      ...Umm...
      ...ahh...
      When I grow up,
      I'm going to be
      your bride!
      Ahh! I said it!

  - name: TX_05d5
    index: 0xd5
    text: |-
      Ohh, \Link...

  - name: TX_05d6
    index: 0xd6
    text: |-
      \pos(2)Remember...
      I will repay you
      when I grow up!
      Be sure to come
      see me.

  - name: TX_05d7
    index: 0xd7
    text: |-
      Dearest! You did
      it! This is
      wonderful! Now
      peace can return
      to \col(3)Labrynna\col(4)!

- group: 0x06
  data:
  - name: TX_0600
    index: 0x00
    text: >-
      I've invited

      \col(3)Nayru\col(0) and \col(1)Din\col(0)

      to my villa to

      celebrate their

      birthdays!\stop

      You didn't know

      that they shared

      a birthday? Scoff!

      You should go

      find some gifts

      for them or else

      they will be mad

      at you!\stop

      But first, could you help my guards clear
      away some of the \col(1)monsters\col(0) that have
      moved into the villa?

      We don't come as often as I'd like and
      they always fill the place
      while we're gone.

  - name: TX_0601
    index: 0x01
    text: >-
      \Link, I see you found a \col(1)treasure\col(0) in the basement of the villa.

      While I don't think that would be a good \col(1)gift\col(0) for either Oracle,
      maybe you can use it to explore the rest of \col(1)Kinomi\col(0)?

  - name: TX_0602
    index: 0x02
    text: >-
      So you've seen a bit of Daichi to the east?
      Aren't the trees just beautiful in the plain?
      I've seen a few \col(1)caves\col(0) there, but I've never gone inside!

  - name: TX_0603
    index: 0x03
    text: >-
      Hi, \Link!\stop

      Do you know anything about this land of Kinomi?\n
    null_terminator: False

  - name: TX_0604
    index: 0x04
    text: >-
      I've been coming here since my childhood.

      There are two bodies of water on the plains.
      The one south of town is the \col(1)Lake of Memories\col(0).

      In the fall, I'd sit and watch the waters at the bank.

      It's not so pretty in the \col(1)summer\col(0) as that is when it \col(1)dries up\col(0).

  - name: TX_0605
    index: 0x05
    text: >-
      So you've seen a bit of Jiku to the west?
      \col(1)Forever Falls\col(0) may seem gloomy,
      but the rushing waters and mist on your face can be soothing.

      There was a man who lived just \col(1)outside of town\col(0)
      that kept watch for monsters, but he passed before I started coming.

      \col(3)Nayru\col(0) told me he was a kind soul in life.

      She suggested to me that he didn't go quite as peacefully as his friends thought.

      I hope he made it to the after- life safely!

  - name: TX_0606
    index: 0x06
    text: >-
      \call(TX_0602)

      There are also some \col(1)caves\col(0) in \col(1)Forever Falls\col(0)!

      I wonder if you'd ever take me in one.

  - name: TX_0607
    index: 0x07
    text: >-
      \Link, I see you're getting a few trinkets,
      teehee. \heart

      How is the search for those gifts?
      Do you know anything about this place?

      \jump(TX_0604)
    null_terminator: False

  - name: TX_0608
    index: 0x08
    text: >-
      \Link, speaking with \col(1)Din\col(0),
      she's concerned you've picked up the \col(1)Rod\col(0).

      Just don't swing it too hard!

      \jump(TX_0604)
    null_terminator: False

  - name: TX_0609
    index: 0x09
    text: >-
      Oh, \Link! Are those \col(1)flippers\col(0)?
      Perfect for the season, I'd say!\stop

      I know some of the lakes dry up in the summer,
      but we can cer- tainly still find places to swim!

  - name: TX_060a
    index: 0x0a
    text: >-
      Did you find another \col(1)cape\col(0)?
      I'm sorry your old one got tat- tered!\stop

      Serves you right for using it so much!\stop

      Where did you get it?\stop

      A mystic \col(1)shrine\col(0) deep in the east woods?
      Wow! \col(1)Din\col(0) was telling me a bit about this earlier.

      I'd been coming to Kinomi since my childhood,
      but I would have never known about that!
      I'm so glad the Oracles finally have come back to
      a place that is so meaningful to their kin.

  - name: TX_060b
    index: 0x0b
    text: >-
      Oh, fantastic! You already have a gift for \col(1)Din\col(0)!

      May I see it?\stop
      Oh, that is so sweet! She will just love it!

  - name: TX_060c
    index: 0x0c
    text: >-
      Do your pockets ever get full?

      You'd think you'd be strug- gling to carry all those items!

  - name: TX_060d
    index: 0x0d
    text: >-
      Past the \col(1)Lake of Memories\col(0) is a wild maze that you will get you easily lost.
      Further on I've heard you will find a \col(1)deep woods\col(0), but I've never been there.
      I hope someday you might be able to take me!

      I can already see it on your face that you're heading that way. \heart

  - name: TX_060e
    index: 0x0e
    text: >-
      \Link, have you had any luck finding gifts for the Oracles?
      It's not that you absolutely need to find one,
      but I'm sure you'd want to get something for their birthday!
      They did save the world with your help after all!\stop

      \slow()What about the woods deep in south Daichi?\stop

      \jump(TX_0609)
    null_terminator: False

  - name: TX_060f
    index: 0x0f
    text: >-
      I'm visiting the \col(1)library\col(0) with \col(3)Nayru\col(0).
      I think she much prefers books over the games \col(1)Din\col(0) is playing outside.\stop

      She was telling me about a \col(1)Labyrinth\col(0) in the south Jiku region.
      Can you believe that it's lasted for \col(1)hundreds of years\col(0) now?
      She says there are many entrances to it,
      and the interior map's entrances \col(1)lines up\col(0) to  the map of Jiku.\stop

      What's that?
      \jump(TX_060a)
    null_terminator: False

  - name: TX_0610
    index: 0x10
    text: >-
      \call(TX_060b)\stop

      The libary here has many books,
      but some people \col(1)do not return\col(0) their books.

      It's really unfortunate, though I suppose it makes sense
      if they were \col(1)far far away\col(0) from anyone.

      I wish we had a system here so people can bring them back for the borrower!

  - name: TX_0611
    index: 0x11
    text: >-
      \col(3)Nayru's Harp\col(0)? \col(1)Din's Rod\col(0)?
      \Link, isn't it a bit shameful to be taking other people's stuff?

      And on their birthday?

      I hope you know what you're doing...\stop

      I am fascinated with the magical efficacy of that \col(1)Harp\col(0),
      but I'd rather spend my vacation relax- ing.\stop

      \jump(TX_0604)
    null_terminator: False

  - name: TX_0612
    index: 0x12
    text: >-
      \call(TX_0621)\stop

      \jump(TX_0609)
    null_terminator: False

  - name: TX_0613
    index: 0x13
    text: >-
      \call(TX_0621)\stop

      Oh,
      \jump(TX_060a)
    null_terminator: False

  - name: TX_0614
    index: 0x14
    text: >-
      \call(TX_060b)\stop

      \jump(TX_0621)
    null_terminator: False

  - name: TX_0615
    index: 0x15
    text: >-
      My favorite part about visiting Kinomi is meet- ing with all the locals!

      This land is very ancient.\stop
      \col(3)Nayru\col(0) told me all about how \col(1)Jiku\col(0) to the west
      and \col(1)Daichi\col(0) to the east held special tribute to the oracles.

      They created great and vast buildings in their honor, and
      the oracles lived in the \col(1)villa\col(0) presiding over the lands.

      I just love that we get to stay at a place with great history!

  - name: TX_0616
    index: 0x16
    text: >-
      \Link, what is that? That \col(1)cane\col(0) looks like the Rod of Seasons!
      But who made the cane? Where did you find it?

      \col(3)Nayru\col(0) knows a lot about the \col(1)Jiku\col(0) region,
      and \col(1)Din\col(0) does for \col(1)Daichi\col(0).

      Those lands were dedicated to the oracles long ago, before it was resettled by Hylians.
      What do you think the people were like?\stop

      \jump(TX_0609)
    null_terminator: False

  - name: TX_0617
    index: 0x17
    text: >-
      \call(TX_060b)

      \col(1)Din\col(0) says she is going to dance the whole night!

      I hope the other guests can match her energy!

      \col(1)Din\col(0) may be the \col(1)Oracle of Seasons\col(0) but she really knows how to party!
      Do you think it's in her blood?

  - name: TX_0618
    index: 0x18
    text: >-
      \Link, why are you wearing those \col(1)gloves\col(0)?\stop

      What could possibly need that much strength?\stop

      \jump(TX_0607)
    null_terminator: False

  - name: TX_0619
    index: 0x19
    text: >-
      My hope is that tomorrow after the party,
      we'll be able to go out to the \col(1)Lake of Memories\col(0)
      and swim to our content!
      Hopefully it is not too shallow from \col(1)drying up\col(0).

      \col(1)Din\col(0) told me there might be some \col(1)secrets\col(0) under the water.\stop

      I don't care if there are any monsters, we should go!
      Just take off those \col(1)gloves\col(0), please!

      I don't want you sinking into the water.
      You have to protect me!\stop

      Maybe the day after, \col(3)Nayru\col(0) can
      show us more of the \col(1)Jiku Cliffs\col(0).
      She said that a spring used to be at the top of
      the cliffs which supplied water to a vast forest!

      I wonder what happened to that forest...

  - name: TX_061a
    index: 0x1a
    text: >-
      \call(TX_060b)\stop

      \jump(TX_0619)
    null_terminator: False

  - name: TX_061b
    index: 0x1b
    text: >-
      \call(TX_0623)\stop

      \jump(TX_0615)
    null_terminator: False

  - name: TX_061c
    index: 0x1c
    text: >-
      \call(TX_0623)\stop

      \jump(TX_0619)
    null_terminator: False

  - name: TX_061d
    index: 0x1d
    text: >-
      \call(TX_0623)\stop

      What's that?

      \jump(TX_060a)
    null_terminator: False

  - name: TX_061e
    index: 0x1e
    text: >-
      You found gifts for both of the oracles?

      Oh this is fantastic and wonderful!
      I'm sure they will love them at the party!

  - name: TX_061f
    index: 0x1f
    text: >-
      Thank you again for saving me, \Link.\stop

      The party is just perfect,
      and I'm glad the oracles loved their gifts,
      especially the ones from you.

      Do you think we could host a party like this every year?

  - name: TX_0620
    index: 0x020
    text: |-
      \col(1)WARNING\col(0)
      If you see this text, then this is a bug.
      Please report it.   -ZTK

  - name: TX_0621
    index: 0x021
    text: >-
      Can't the harp take you to the past if you spot a portal?
      Have you used it yet? Don't get stuck in the past, please!
      We have a party soon!!

  - name: TX_0622
    index: 0x022
    text: >-
      I've been thinking about that \col(1)labyrinth\col(0)
      \col(3)Nayru\col(0) told me about.

      What sort of artifacts may be hidden in there?
      I read about a magical \col(1)block\col(0) that can be carried
      along distaces and when tossed in a hole,
      it can fill it as if there was always land there!

      I hope I get to witness such a thing once!

  - name: TX_0623
    index: 0x023
    text: >-
      Is that your gift to \col(3)Nayru\col(0)?

      I wish you could play it for me, but I'm busy right now.

      I'm sure she and the rest of the guests will love to hear it at the party!

- group: 0x07
  data:
  - name: TX_0700
    index: 0x00
    text: |-
      Ow! Ow! Ow!!!\stop
      Watch where
      you're goin'!
      You just hit
      \col(3)Maple\col(0), the Great
      Witch Syrup's
      apprentice!
      Thanks to you,
      all the stuff
      fell out of my
      bag! The Great
      Witch will be
      mad!
      And I have to
      get my \col(1)scary
      doll\col(0) back. Who could have that \col(0x84)\item(0x01) \col(1)doll\col(0)?\stop
      Well, it's all
      made me mad! So
      I'm gonna take
      your stuff, too!

  - name: TX_0701
    index: 0x01
    text: |-
      You again?\stop
      Thanks to you,
      everything in my
      bag flew out!
      You must be
      brave to hit
      \col(3)Maple\col(0) like this!
      I'll just take
      your stuff, too!
      Here goes!

  - name: TX_0702
    index: 0x02
    text: |-
      O-U-C-H-!!!
      You--AGAIN?
      Do you have it
      in for me or
      what? Thanks to
      you, all the
      stuff flew out
      of my bag! Well,
      I'll just take
      your stuff, too!

  - name: TX_0703
    index: 0x03
    text: |-
      AH! All my stuff
      flew out of my
      bag! I'll just
      take what you
      dropped, too!
      This'll show you
      what happens
      when you make
      \col(3)Maple\col(0) mad!

  - name: TX_0704
    index: 0x04
    text: |-
      Ouch...
      Back again?
      The stuff flew
      out of my bag!
      I'll just have
      to take what you
      dropped, too!

  - name: TX_0705
    index: 0x05
    text: |-
      We meet again!
      You know the
      drill! Fastest
      one wins.
      Ready..? Go!

  - name: TX_0706
    index: 0x06
    text: |-
      Ah ha ha ha! Now
      you're sorry! I
      have more stuff
      than before!
      See ya!

  - name: TX_0707
    index: 0x07
    text: |-
      You little--
      I'll remember
      this!

  - name: TX_0708
    index: 0x08
    text: |-
      Hmm! Not bad!\stop
      But that's all
      you get today.

  - name: TX_0709
    index: 0x09
    text: |-
      Ouch...\stop
      Watch where
      you're goin'!
      You just hit
      \col(3)Maple\col(0), the Great
      Witch Syrup's
      apprentice!\stop
      Oh my!

  - name:
    - TX_070a
    - TX_070b
    index:
    - 0x0a
    - 0x0b
    text: |-
      This makes up
      for your bumping
      into me! See ya!

  - name: TX_070c
    index: 0x0c
    text: |-
      Ah!
      . . . . . . . .\stop
      Bye!\heart

  - name: TX_070d
    index: 0x0d
    text: |-
      Hey! That doll!

  - name: TX_070e
    index: 0x0e
    text: |-
      That's the \col(0x84)\item(0x01)
      \col(1)Ghastly Doll\col(0)
      I had traded before for a useless egg!

  - name: TX_070f
    index: 0x0f
    text: |-
      What..?\stop
      Oh, my...\stop
      .........\stop
      Eek! ...........

  - name: TX_0710
    index: 0x10
    text: |-
      Uh-wahhh!\stop
      Ahhh...(sniff)
      How long I've wanted this back!

  - name: TX_0711
    index: 0x11
    text: |-
      Thanks...(sniff)
      Take this. It's
      the first one I
      made. Syrup
      never gave me
      any compliments
      on it. I'll be keeping this doll.
      (Sniff!)

  - name: TX_0712
    index: 0x12
    text: |-
      Ouch...\stop
      Watch where
      you're walkin'!
      I came through
      this weird
      tunnel and was
      flyin' happily
      along when you
      run into me! I'm
      \col(3)Maple\col(0), the Great
      Witch Syrup's
      apprentice!
      Why does this
      happen to me?
      The Great Witch
      is so mean. She
      even took away
      my \col(1)picture book\col(0)!
      Doesn't anyone
      have that \col(0x84)\item(0x09)
      \col(1)book\col(0)?\stop
      Now you come
      along and make
      me drop all my
      stuff!
      Anyway, it's all
      got me mad!
      I'm gonna take
      your stuff, too!

  - name: TX_0713
    index: 0x13
    text: |-
      Ouch...\stop
      Watch where
