    index: 0x3b
    text: |-
      Oh! You don't
      have a \col(1)Ring Box\col(0)?
      I like you, so
      here! Take this
      \col(1)Ring Box\col(0).

  - name: TX_303c
    index: 0x3c
    text: |-
