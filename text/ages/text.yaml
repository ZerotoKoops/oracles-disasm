- group: 0x56
  data:
  - name: TX_5600
    index: 0x00
    text: |-
      \pos(0)Ah hah hah hah!

  - name: TX_5601
    index: 0x01
    text: |-
      \pos(0)Thank you,
      \Link!\stop
      You allowed me
      to pass through
      the sacred
      barrier! I've
      been waiting for
      this moment!\stop
      I am \col(3)Veran\col(0),
      Sorceress of
      Shadows!

  - name: TX_5602
    index: 0x02
    text: |-
      \pos(0)\col(3)Nayru\col(0)! Oracle
      of Ages! I shall
      make your body
      my own!
      Ah hah hah hah!

  - name: TX_5603
    index: 0x03
    text: |-
      \pos(2)Hah! Aren't you
      brave! Turning a
      sword at me! If
      you cut me, it's
      \col(3)Nayru\col(0) who dies!

  - name: TX_5604
    index: 0x04
    text: |-
      \pos(2)\col(3)Nayru\col(0) is no mere
      diva! She is the
      Oracle of Ages,
      who controls
      time!\stop
      Now the oracle's
      powers are mine.
      I can travel
      through time as
      I choose!

  - name: TX_5605
    index: 0x05
    text: |-
      \pos(2)Now a new age
      shall begin...
      The age of
      darkness!!!
      Ah hah hah hah!

  - name: TX_5606
    index: 0x06
    text: |-
      \pos(0)You are correct!
      Not bad for a
      diva... Not bad
      for \col(3)Nayru\col(0),
      Oracle of Ages!
      Something
      terrible will
      happen right now
      before your very
      eyes!

  - name: TX_5607
    index: 0x07
    text: |-
      I shall go to
      the past and do
      as I please!

  - name: TX_5608
    index: 0x08
    text: |-
      \pos(1)\Link! I am
      amazed you have
      come so far...

  - name: TX_5609
    index: 0x09
    text: |-
      \pos(1)Wait!

  - name: TX_560a
    index: 0x0a
    text: |-
      \pos(1)Do you mean to
      turn your sword
      on me?\stop
      Hah hah hah hah!
      If you want to
      hurt \col(3)Nayru\col(0), then
      go right ahead!

  - name: TX_560b
    index: 0x0b
    text: |-
      Uhh...
      Not bad at all!
      Just wait until
      next time...

  - name: TX_560c
    index: 0x0c
    text: |-
      \pos(1)Hah hah hah!!!\stop
      The queen comes
      with impeccable
      timing!

  - name: TX_560d
    index: 0x0d
    text: |-
      \pos(0)Hahh... The body
      of a queen suits
      me just fine!
      Do you know
      what I am going
      to do now?
      Let me tell you!\stop
      Meet the
      petrified ones!
      I shall catch
      them all!

  - name: TX_560e
    index: 0x0e
    text: |-
      \pos(2)Well done!
      I thought I
      might possess
      you this time.
      Perhaps you
      have a different
      flavor from that
      fool, \col(3)Ralph\col(0).

  - name: TX_560f
    index: 0x0f
    text: |-
      \pos(2)You've seen me
      like this
      before, but this
      is my true form.
      You'll regret
      making me show
      my true might!

  - name: TX_5610
    index: 0x10
    text: |-
      \pos(2)I'll give you
      reasons to fear
      \col(3)Veran\col(0), Sorceress
      of Shadows!!!

  - name: TX_5611
    index: 0x11
    text: |-
      Ughh...
      I never expected
      to be beaten by
      this boy...

  - name: TX_5612
    index: 0x12
    text: |-
      This should not
      have happened
      to me...

  - name: TX_5613
    index: 0x13
    text: |-
      How cold of you
      to run off and
      leave me all
      alone! But, my,
      aren't you
      courageous!
      You've spoiled
      all my plans! I
      hoped to avoid
      revealing this
      vile shape...
      You'll pay for
      my humiliation
      with your life!
      Now, \Link,
      it is your turn
      to taste
      despair...

  - name: TX_5614
    index: 0x14
    text: |-
      and the fear
      of death!

  - name: TX_5615
    index: 0x15
    text: |-
      My... My body
      withers...
      But you are too
      late! My role...
      was to disrupt
      the currents of
      time... To flood
      humanity in
      sorrow...
      The despair that
      fills this land
      has already
      passed
      through this
      tower and on
      to \col(3)Twinrova\col(0)!
      I see it...
      Burning blue...
      The Flame of
      Sorrow!!!\stop
      Hah hah hah...

  - name: TX_5616
    index: 0x16
    text: |-
      \call(TX_5615)
      I'll be waiting,
      \Link...
      to haunt you...
      And the Evil
      King \col(3)Ganon\col(0)...
      will plunge the
      world...
      into darkness!

- group: 0x57
  data:
  - name: TX_5700
    index: 0x00
    text: |-
      This is the
      animal's utopia!
      Soon more
      animals come!

  - name: TX_5701
    index: 0x01
    text: |-
      What a great
      spot! Such clean
      air! Now if only
      time could stop!

  - name: TX_5702
    index: 0x02
    text: |-
      How charming...

  - name: TX_5703
    index: 0x03
    text: |-
      Sit here and
      listen. How
      charming...

  - name: TX_5704
    index: 0x04
    text: |-
      Huh?\stop
      \col(3)Nayru\col(0)'s the best
      singer in
      \col(3)Labrynna\col(0)!

  - name: TX_5705
    index: 0x05
    text: |-
      \sym(0x1c)La la li li la\sym(0x1c)
      \sym(0x1c)La Li li la\sym(0x1c)

  - name: TX_5706
    index: 0x06
    text: |-
      Isn't it\x20
      enchanting?

  - name: TX_5707
    index: 0x07
    text: |-
      I am going to
      be a princess!

  - name: TX_5708
    index: 0x08
    text: |-
      We're going to
      build paradise!

  - name: TX_5709
    index: 0x09
    text: |-
      You don't work,
      you don't eat!

  - name: TX_570a
    index: 0x0a
    text: |-
      I'm hungry!
      When's dinner?

  - name: TX_570b
    index: 0x0b
    text: |-
      If you believe,
      it will be!

  - name: TX_570c
    index: 0x0c
    text: |-
      I want to be a
      real princess,
      like \col(3)Princess
      Zelda\col(0)!

  - name: TX_570d
    index: 0x0d
    text: |-
      Get along with
      humans, too!
      That's my motto!

  - name: TX_570e
    index: 0x0e
    text: |-
      The world is so
      peaceful. I'm
      going to build
      my own utopia!

  - name: TX_570f
    index: 0x0f
    text: |-
      \sym(0x1c)Utopian dream\sym(0x1c)
      La la\sym(0x1c)Utopia\sym(0x1c)

  - name: TX_5710
    index: 0x10
    text: |-
      The world is at
      peace, the air
      is clean! It's
      like a dream!

  - name: TX_5711
    index: 0x11
    text: |-
      Bwoop! Bwoop!

  - name: TX_5712
    index: 0x12
    text: |-
      \col(3)Nayru\col(0) is gone so
      there are no
      more songs...

  - name: TX_5713
    index: 0x13
    text: |-
      I thought we'd
      hear songs when
      \col(3)Nayru\col(0) returned,
      but I guess now
      isn't the time.

  - name: TX_5714
    index: 0x14
    text: |-
      \col(3)Nayru's\col(0) songs
      are so
      wonderfully
      enchanting...

  - name: TX_5715
    index: 0x15
    text: |-
      I can't stand
      not being able
      to hear \col(3)Nayru\col(0)
      sing!!!

  - name: TX_5716
    index: 0x16
    text: |-
      Listen quietly
      to \col(3)Nayru's\col(0)
      songs!

  - name: TX_5717
    index: 0x17
    text: |-
      Without \col(3)Nayru's\col(0)
      songs, I can't
      jump in rhythm.

  - name: TX_5718
    index: 0x18
    text: |-
      How long until
      \col(3)Nayru\col(0) sings
      again?

  - name: TX_5719
    index: 0x19
    text: |-
      Where has \col(3)Nayru\col(0)
      gone to?!?

  - name: TX_571a
    index: 0x1a
    text: |-
      I can't relax
      without \col(3)Nayru's\col(0)
      songs!

- group: 0x58
  data:
  - name: TX_5800
    index: 0x00
    text: |-
      I haven't had
      any visitors in
      some time.\n
    null_terminator: False

  - name: TX_5801
    index: 0x01
    text: |-
      I am \col(3)Patch\col(0), the
      restoration
      guru. Did you
      need me?
        \opt()Yes \opt()No

  - name: TX_5802
    index: 0x02
    text: |-
      You must have
      time to kill if
      you came all
      the way here.

  - name: TX_5803
    index: 0x03
    text: |-
      You don't seem
      to have anything
      I can restore.
      So, what then?

  - name: TX_5804
    index: 0x04
    text: |-
      Heh, heh! I see.
      You want me to
      repair that
      \col(1)\call(0xff)\col(0).\stop
      My Restoration
      Ceremony might
      fix it.
      ...Want to try?
        \opt()Yes \opt()No

  - name: TX_5805
    index: 0x05
    text: |-
      Then that
      \col(1)\call(0xff)\col(0)
      will never be
      restored...

  - name: TX_5806
    index: 0x06
    text: |-
      You are willing
      to try? Very
      well. Follow me.
      Heh, heh!

  - name: TX_5807
    index: 0x07
    text: |-
      Welcome to
      Patch's
      Crazy Cart!
      Will you partake
      in my ceremony?
        \opt()Yes \opt()No

  - name: TX_5808
    index: 0x08
    text: |-
      Very well! Do
      you want to hear
      the rules?
        \opt()No \opt()Yes

  - name: TX_5809
    index: 0x09
    text: |-
      Then let me
      explain!\stop
      I'll place your
      \col(1)\call(0xff)\col(0)
      on that green
      tile and recite
      the words of my
      Restoration
      Ceremony. You
      must knock all
      the beasts that
      appear into a
      hole--any hole
      will do. Sounds
      easy, right?
      ...However!!!\stop
      Restoration is
      delicate work.
      Your precious
      \col(1)\call(0xff)\col(0)
      sits on these
      tracks...
      The cart starts
      moving when the
      ceremony begins.
      As long as you
      stand on the
      switch, the cart
      won't hit your
      \col(1)\call(0xff)\col(0),
      but if you don't
      and it gets hit,\stop
      BANG!!!\stop
      So? Will you
      take part in
      this fun--err,
      delicate
      ceremony?
        \opt()Yes \opt()No

  - name: TX_580a
    index: 0x0a
    text: |-
      Let the ceremony
      begin!

  - name: TX_580b
    index: 0x0b
    text: |-
      Dex ifeb!!!
      Dex iflla!!!

  - name: TX_580c
    index: 0x0c
    text: |-
      The ceremony
      failed, but your
      \col(1)\call(0xff)\col(0)
      seems to have
      survived. Try
      again sometime.

  - name: TX_580d
    index: 0x0d
    text: |-
      Hmm... Eh, heh!
      My ceremony
      succeeded! You
      are talented.
      You got through
      this trap--err,
      ceremony.
      Here is your
      \col(1)\call(0xff)\col(0),
      as good as new!\stop
      As usual, I am
      perfect!

  - name: TX_580e
    index: 0x0e
    text: |-
      Here you go.

  - name: TX_580f
    index: 0x0f
    text: |-
      Bring me any-
      thing else that
      needs fixing,
      and I'll prepare
      my trap--err,
      ceremony!

  - name: TX_5810
    index: 0x10
    text: |-
      I haven't seen
      you in awhile.\stop
      If you've come
      all the way up
      the wall, you
      must need
      something fixed.
      But my fun--
      err, delicate
      ceremony, is
      more difficult
      now. Do you
      wish to try?
        \opt()Yes \opt()No

  - name: TX_5811
    index: 0x11
    text: |-
      There is nothing
      the restoration
      guru cannot
      repair!

  - name: TX_5812
    index: 0x12
    text: |-
      Tuni Nut

  - name: TX_5813
    index: 0x13
    text: |-
      Broken Sword

  - name: TX_5814
    index: 0x14
    text: |-
      Mermaid's Eye

- group: 0x59
  data:
  - name: TX_5900
    index: 0x00
    text: |-
      Are you also
      searching for
      that which \col(3)Ambi\col(0)
      desires? You
      should not go
      further! There
      are hordes of
      terrible beasts!

  - name: TX_5901
    index: 0x01
    text: |-
      Did you find
      what \col(3)Ambi\col(0)
      desires?

  - name: TX_5902
    index: 0x02
    text: |-
      \col(3)Ambi's\col(0) \col(1)bombs\col(0)
      have tremendous
      power!

  - name: TX_5903
    index: 0x03
    text: |-
      \pos(2)\col(3)Queen Ambi\col(0) is
      busy! She's in
      no mood for any
      who come empty-
      handed! Bring
      her a rare item
      in tribute if
      you wish to
      see her.

  - name: TX_5904
    index: 0x04
    text: |-
      Not bad, kid!
      You found them!
      Now come with me
      to meet \col(3)Queen
      Ambi\col(0)!

  - name: TX_5905
    index: 0x05
    text: |-
      \pos(0)\col(3)Queen Ambi\col(0)! He
      says he wishes
      to pay tribute!
      He brings the
      \col(1)Mystery Seeds\col(0)
      Your Majesty has
      been seeking!

  - name: TX_5906
    index: 0x06
    text: |-
      \pos(0)I shall guide
      you.

  - name: TX_5907
    index: 0x07
    text: |-
      \pos(0)Yes, Your
      Majesty!

  - name: TX_5908
    index: 0x08
    text: |-
      \pos(2)Nice work, kid!
      \col(3)Ambi\col(0) was most
      pleased! You may
      go now!

  - name: TX_5909
    index: 0x09
    text: |-
      \pos(2)Don't loiter
      around here too
      much, kid!!!

  - name: TX_590a
    index: 0x0a
    text: |-
      You! You can't
      come in without
      permission!

  - name: TX_590b
    index: 0x0b
    text: |-
      Those are the
      \col(1)Mystery Seeds\col(0)
      \col(3)Queen Ambi\col(0) has
      been demanding!
      Nice work, kid!
      I'll take you to
      the palace!

  - name: TX_590c
    index: 0x0c
    text: |-
      \pos(0)Let's go, kid!

  - name: TX_590d
    index: 0x0d
    text: |-
      \col(2)Zelda\col(0) explicitly told me to watch who comes up those steps!
      Sir \Link, please be careful on your way back.

  - name: TX_590e
    index: 0x0e
    text: |-
      Sending in a single guard may not have been the best of ideas...

  - name: TX_590f
    index: 0x0f
    text: >-
      What, kid?!?

      Are there any monsters around?\stop

      I saw a hoard of them to the room
      east of here, and fled!

      There were just so many!\stop

      The \col(1)key\col(0) to
      that room must be upstairs.
      

  - name: TX_5910
    index: 0x10
    text: |-
      \col(2)Zelda\col(0) has gone
      and done it this time with all of the festivities!
      This \col(3)small villa\col(0) can't hold all of these guests!

  - name: TX_5911
    index: 0x11
    text: |-
      We must keep the
      palace safe
      while \col(2)Zelda\col(0)
      is sojourning here!

  - name: TX_5912
    index: 0x12
    text: |-
      \col(2)Zelda\col(0) said she
      wanted to throw a party for the Oracles!

      We must prepare for anything!

  - name: TX_5913
    index: 0x13
    text: |-
      Sir \Link!
      Welcome!

  - name: TX_5914
    index: 0x14
    text: |-
      It is our job to
      guard the \col(3)villa\col(0)
      with our lives!

  - name: TX_5915
    index: 0x15
    text: >-
      This is \col(2)Zelda's\col(0)
      \col(3)summer villa\col(0) that
      she uses to spend time with the Oracles.

  - name: TX_5916
    index: 0x16
    text: >-
      Be careful! Without a \col(1)shield\col(0),
      monsters will try to ram into you!

- group: 0x5a
  data:
  - name: TX_5a00
    index: auto
    text: >-
      We are transfers from the Subrosia Dance Hall.
      Good dancers get
      a prize. We're
      about to
      practice. Would
      you like to
      dance with us?

        \opt()Yes \opt()No

  - name: TX_5a01
    index: auto
    text: |-
      We're about to
      start practice.
      Will you dance
      with us?
        \opt()Yes \opt()No

  - name: TX_5a02
    index: auto
    text: |-
      Then join the
      circle.

  - name: TX_5a03
    index: auto
    text: |-
      Come back if you
      feel the urge.

  - name: TX_5a04
    index: auto
    text: |-
      You're terrible!
      Get outta here!

  - name: TX_5a05
    index: auto
    text: |-
      Try to copy
      what I do.
      On "doo," step
      right.

  - name: TX_5a06
    index: auto
    text: |-
      On "dah," step
      left.

  - name: TX_5a07
    index: auto
    text: |-
      On "dee," hold a
      pose.

  - name: TX_5a08
    index: auto
    text: |-
      Don't mess up or
      bump into the
      people near you.
      Got it?
        \opt()Yes \opt()Umm...

  - name: TX_5a09
    index: auto
    text: |-
      OK! Let's dance!

  - name: TX_5a0a
    index: auto
    text: |-
      You're pretty
      good. You're our
      best dancer
      today! Here's
      your prize!

  - name: TX_5a0b
    index: auto
    text: |-
      Shh! We're
      starting!

  - name: TX_5a0c
    index: auto
    text: |-
      Don't talk!

  - name: TX_5a0d
    index: auto
    text: |-
      Today, I'll
      definitely win
      the prize!

  - name: TX_5a0e
    index: auto
    text: |-
      I'm gonna master
      the Subrosian
      Dance and
      impress \col(1)Din\col(0)!

  - name: TX_5a0f
    index: auto
    text: >-
      Our Subrosian Dance
      is a tradition of
      \col(3)Subrosia\col(0).

      We moved here to practice
      for a great party!

      Do you know of any?

  - name: TX_5a10
    index: auto
    text: |-
      The Subrosian
      Dance is a good
      workout, really!

  - name: TX_5a11
    index: auto
    text: |-
      Right on "doo,"
      left on "dah..."

  - name: TX_5a12
    index: auto
    text: |-
      Press \abtn to pose
      on "dee." Hmm...

  - name: TX_5a13
    index: auto
    text: |-
      Something good
      might happen if
      you're voted
      best many times.

  - name: TX_5a14
    index: auto
    text: |-
      ...Then join
      the circle.

  - name: TX_5a15
    index: auto
    text: |-
      Need
      instructions?
        \opt()No \opt()Yes

  - name: TX_5a16
    index: auto
    text: >-
      Would you like to try
      for a \col(3)special prize\col(0)?
        \opt()Yes \opt()No
      